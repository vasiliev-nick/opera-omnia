<script>
(function(){
  /* Fig. ∠.1, canvas rv3: random variables on three outcomes as arrows in space.
     Axis ω carries √(3P(ω))·ξ(ω): angles are those of L²(P), lengths are √3 times its lengths, and with equal probabilities the coordinates are just the values.
     The constants lie on the line through q = (√P(1), √P(2), √P(3)); the plane of zero mean is perpendicular to it.
     Each variable has two handles: the tip of its arrow moves parallel to that plane (the deviation changes, the mean stays),
     the foot of its perpendicular moves along the line of constants (only the mean changes). A triangle sets the probabilities. */
  const TB=window.TB,cv=document.getElementById('rv3');if(!TB||!cv||!TB.V3||!TB.fit||!TB.cols)return;
  const V=TB.V3,fx=document.getElementById('rvFx'),gC=new TB.Gauge('gRvC'),gR=new TB.Gauge('gRvR');
  /* AX: length of the axes; MM: range of the means; RDEV, RMIN: longest and shortest deviation in the picture; RD: radius of the disc; PMIN: least probability */
  const PI=Math.PI,S3=Math.sqrt(3),AX=3.5,MM=2,RDEV=2.6,RMIN=0.15,RD=1.9,PMIN=0.05,SNAP=2.5*PI/180;
  let XB=[1,2,3],YB=[3,2,1],p=[1/3,1/3,1/3];
  const st={yaw:-1.0,pitch:0.52,dist:18};
  const E=v=>V.dot(p,v),hm=(a,b)=>a.map((v,i)=>v*b[i]),scl=()=>p.map(v=>Math.sqrt(3*v));
  const toP=v=>hm(v,scl()),fromP=P=>{const s=scl();return P.map((v,i)=>v/s[i]);};
  /* q: the unit vector of the constants (the constant c is the point c·√3·q); F0, F1: an orthonormal frame of the plane of zero mean */
  function frame(){const q=p.map(Math.sqrt),F1=V.unit([1-p[0],-q[0]*q[1],-q[0]*q[2]]);return {q:q,F1:F1,F0:V.cross(F1,q)};}
  /* the shown variable: the stored values; if a change of probabilities made the deviation too long or put the mean off its range, they are brought back to the edge */
  function shown(B){const m=E(B),d=B.map(v=>v-m),s=Math.sqrt(3*E(d.map(v=>v*v))),l=s>RDEV?RDEV/s:1,mc=Math.max(-MM,Math.min(MM,m));
    return {m:mc,d:d.map(v=>v*l),v:d.map(v=>mc+v*l)};}
  /* layout: the scene, and the triangle of probabilities to its right (below it on a narrow column) */
  function lay(W){const sm=W<520,side=Math.min(150,sm?150:W*0.22),h=side*Math.sqrt(3)/2;
    if(!sm){const H=Math.round(W*0.62),tx=W-side/2-26,ty=78;return {sm:sm,H:H,hs:H,cx:W*0.39,s:W*0.086,A:[tx,ty],B:[tx-side/2,ty+h],C:[tx+side/2,ty+h]};}
    const hs=Math.round(W*1.02),ty=hs+52;return {sm:sm,H:Math.round(ty+h+30),hs:hs,cx:W*0.47,s:W*0.118,A:[W/2,ty],B:[W/2-side/2,ty+h],C:[W/2+side/2,ty+h]};}
  let cam=null,G=null,drag=null,pressing=false;
  const bary=(x,y)=>{const A=G.A,B=G.B,C=G.C,d=(B[1]-C[1])*(A[0]-C[0])+(C[0]-B[0])*(A[1]-C[1]),
    a=((B[1]-C[1])*(x-C[0])+(C[0]-B[0])*(y-C[1]))/d,b=((C[1]-A[1])*(x-C[0])+(A[0]-C[0])*(y-C[1]))/d;return [a,b,1-a-b];};
  const atB=b=>[b[0]*G.A[0]+b[1]*G.B[0]+b[2]*G.C[0],b[0]*G.A[1]+b[1]*G.B[1]+b[2]*G.C[1]];
  const segNear=(P,U,W)=>{const dx=W[0]-U[0],dy=W[1]-U[1],t=Math.max(0,Math.min(1,((P[0]-U[0])*dx+(P[1]-U[1])*dy)/(dx*dx+dy*dy)));return [U[0]+t*dx,U[1]+t*dy];};
  function triDist(x,y){const b=bary(x,y);if(Math.min(b[0],b[1],b[2])>=0)return 0;
    return Math.min(...[[G.A,G.B],[G.B,G.C],[G.C,G.A]].map(s=>{const q=segNear([x,y],s[0],s[1]);return Math.hypot(q[0]-x,q[1]-y);}));}
  /* a point of the triangle gives the probabilities: its barycentric coordinates, kept inside {P(ω) ≥ PMIN}, in hundredths; near the centre they snap to 1/3 */
  function setP(x,y){const ctr=atB([1/3,1/3,1/3]);if(Math.hypot(x-ctr[0],y-ctr[1])<9){p=[1/3,1/3,1/3];return;}
    let b=bary(x,y);
    if(Math.min(b[0],b[1],b[2])<PMIN){const e=PMIN,I=[atB([1-2*e,e,e]),atB([e,1-2*e,e]),atB([e,e,1-2*e])];let best=null,bd=1e9;
      for(const s of [[I[0],I[1]],[I[1],I[2]],[I[2],I[0]]]){const q=segNear([x,y],s[0],s[1]),dd=Math.hypot(q[0]-x,q[1]-y);if(dd<bd){bd=dd;best=q;}}
      b=bary(best[0],best[1]);}
    const c=b.map(v=>Math.max(PMIN,v)*100+1e-9),fl=c.map(Math.floor);let r=100-fl[0]-fl[1]-fl[2];
    const ord=[0,1,2].sort((i,j)=>(c[j]-fl[j])-(c[i]-fl[i]));for(let t=0;r>0&&t<3;t++,r--)fl[ord[t]]++;
    for(let t=0;r<0&&t<3;t++)if(fl[ord[2-t]]>5){fl[ord[2-t]]--;r++;}
    p=fl.map(v=>v/100);}
  /* the point of the scene under the screen point (sx, sy) at view depth D (inverse of V.camera) */
  function unproj(sx,sy,D){const a=(sx-cam.cx)/cam.s,b=(cam.cy-sy)/cam.s,f=1-D/st.dist,X=a*f,Y=b*f;
    const cyw=Math.cos(st.yaw),syw=Math.sin(st.yaw),cp=Math.cos(st.pitch),sp=Math.sin(st.pitch),x1=X,y1=sp*Y-cp*D,z=cp*Y+sp*D;
    return [cyw*x1+syw*y1,-syw*x1+cyw*y1,z];}
  /* the tip follows the pointer in the plane through it parallel to the plane of zero mean, so the mean stays;
     the length of the deviation stays in [RMIN, RDEV], and the angle ψ snaps to 0°, 90°, 180° when it is close */
  function moveTip(i,sx,sy){const fr=frame(),q=fr.q,S=[shown(XB),shown(YB)],h=S3*S[i].m;
    const W0=unproj(sx,sy,0),dW=V.sub(unproj(sx,sy,1),W0),den=V.dot(q,dW);if(Math.abs(den)<1e-6)return;
    const P=V.add(W0,V.mul(dW,(h-V.dot(q,W0))/den)),dv=V.sub(P,V.mul(q,h)),o=toP(S[1-i].d);
    const u=[V.dot(dv,fr.F0),V.dot(dv,fr.F1)],uo=[V.dot(o,fr.F0),V.dot(o,fr.F1)],to=Math.atan2(uo[1],uo[0]);
    let r=Math.hypot(u[0],u[1]),th=r>1e-9?Math.atan2(u[1],u[0]):to;r=Math.max(RMIN,Math.min(RDEV,r));
    let dl=th-to;while(dl>PI)dl-=2*PI;while(dl<=-PI)dl+=2*PI;
    for(const t of [0,PI/2,-PI/2,PI,-PI])if(Math.abs(dl-t)<SNAP){dl=t;break;}
    th=to+dl;const d=fromP(V.add(V.mul(fr.F0,r*Math.cos(th)),V.mul(fr.F1,r*Math.sin(th)))),v=d.map(t=>S[i].m+t);if(i)YB=v;else XB=v;}
  /* the foot slides along the screen image of the line of constants; the deviation stays */
  function moveFoot(i,x,y){const q=frame().q,A=cam.P([0,0,0]),B=cam.P(V.mul(q,S3)),dx=B[0]-A[0],dy=B[1]-A[1],n2=dx*dx+dy*dy;if(n2<1)return;
    let m=drag.m0+((x-drag.x0)*dx+(y-drag.y0)*dy)/n2;m=Math.max(-MM,Math.min(MM,Math.round(m*20)/20));
    const S=shown(i?YB:XB),v=S.d.map(t=>m+t);if(i)YB=v;else XB=v;}
  const f2=v=>TB.fmt(v,2),f3=v=>TB.fmt(v,3),tr=v=>'('+v.map(f2).join('; ')+')';
  function draw(){
    const F=TB.fit(cv,W=>lay(W).H),c=F.c,W=F.W,H=F.H,col=TB.cols(),L=lay(W),sm=L.sm,fs=sm?12:13;
    c.clearRect(0,0,W,H);
    const yb=TB.legend(c,[{k:'line',col:col.eth,t:[['ξ','i']]},{k:'line',col:col.warm,t:[['η','i']]},
      {k:'dash',col:col.ink,t:[['перпендикуляр на прямую постоянных','r']]}],sm?8:14,W-8,4,fs);
    cam=V.camera(st,W,H,L.cx,yb+(L.hs-yb)*(sm?0.55:0.57),L.s);
    const fr=frame(),q=fr.q,sc=scl(),SX=shown(XB),SY=shown(YB),X=toP(SX.v),Y=toP(SY.v),DX=toP(SX.d),DY=toP(SY.d),FX=V.mul(q,S3*SX.m),FY=V.mul(q,S3*SY.m);
    const items=[];
    /* the coordinate axes: the value at outcome ω times √(3P(ω)), marks at the integer values */
    for(let i=0;i<3;i++){const e=[0,0,0];e[i]=1;
      items.push({t:'line',pts:[V.mul(e,-AX*0.75),[0,0,0]],col:TB.rgba(col.ink,0.32),w:1,dash:[3,4]},{t:'arrow',p:[0,0,0],v:V.mul(e,AX),col:TB.rgba(col.ink,0.55),w:1.1});
      const o=[0,0,0];o[(i+1)%3]=0.07;const o2=[0,0,0];o2[(i+2)%3]=0.07,ss=[];
      for(let k=-8;k<=8;k++){const t=k*sc[i];if(!k||t>AX-0.15||t<-AX*0.75)continue;const P=V.mul(e,t);ss.push([V.add(P,o),V.sub(P,o)],[V.add(P,o2),V.sub(P,o2)]);}
      items.push({t:'segs',s:ss,col:TB.rgba(col.ink,0.55),w:1});
      items.push({t:'label',p:V.mul(e,AX+0.25),segs:[['ω','i'],[' = '+(i+1),'m']],dx:i===1?2:8,dy:i===1?19:5,size:fs,col:col.muted});}
    /* the plane of zero mean, as a disc */
    const rim=[];for(let k=0;k<=72;k++){const t=2*PI*k/72;rim.push(V.add(V.mul(fr.F0,RD*Math.cos(t)),V.mul(fr.F1,RD*Math.sin(t))));}
    items.push({t:'line',pts:rim,col:TB.rgba(col.eth,0.45),w:1,bias:0.01});
    /* the line of constants with marks c = ±1, ±2 */
    items.push({t:'line',pts:[V.mul(q,-2.4*S3),V.mul(q,2.4*S3)],col:TB.rgba(col.ink,0.8),w:1.4,ghost:0.35});
    for(const k of [-2,-1,1,2]){const P=V.mul(q,k*S3),o=V.mul(fr.F0,0.09);
      items.push({t:'segs',s:[[V.add(P,o),V.sub(P,o)]],col:TB.rgba(col.ink,0.8),w:1.3},{t:'label',p:P,segs:[['c','i'],[' = '+TB.fmt(k,0),'m']],dx:5,dy:16,size:fs-2,col:col.muted});}
    items.push({t:'label',p:V.mul(q,2.4*S3),segs:[['постоянные','r']],dx:-4,dy:-10,size:fs-1,col:col.muted,al:'right'});
    /* the perpendiculars from the tips to the line of constants, with right-angle marks */
    const corner=(foot,d,m,cl)=>{const n=V.norm(d);if(n<1e-6)return;const a=V.mul(d,0.2/n),b=V.mul(q,m>0.03?-0.2:0.2);
      items.push({t:'line',pts:[V.add(foot,a),V.add(V.add(foot,a),b),V.add(foot,b)],col:cl,w:1,alpha:0.85,bias:0.02});};
    items.push({t:'line',pts:[FX,X],col:col.eth,w:1.5,dash:[5,4],bias:0.02},{t:'line',pts:[FY,Y],col:col.warm,w:1.5,dash:[5,4],bias:0.02});
    corner(FX,DX,SX.m,col.eth);corner(FY,DY,SY.m,col.warm);
    /* the deviations in the plane and the angle ψ between them; the arrows ξ, η and the angle φ between them */
    const arc=(a,b,R)=>{const u=V.unit(a),w0=V.sub(V.unit(b),V.mul(u,V.dot(V.unit(b),u))),ang=Math.acos(Math.max(-1,Math.min(1,V.dot(u,V.unit(b)))));
      if(V.norm(w0)<1e-6||ang<0.03)return null;const w=V.unit(w0),pts=[];for(let k=0;k<=40;k++){const t=ang*k/40;pts.push(V.add(V.mul(u,R*Math.cos(t)),V.mul(w,R*Math.sin(t))));}
      return {pts:pts,mid:V.add(V.mul(u,Math.cos(ang/2)),V.mul(w,Math.sin(ang/2))),ang:ang};};
    items.push({t:'arrow',p:[0,0,0],v:DX,col:TB.rgba(col.eth,0.75),w:1.4},{t:'arrow',p:[0,0,0],v:DY,col:TB.rgba(col.warm,0.8),w:1.4});
    const aP=arc(DX,DY,0.5);if(aP){items.push({t:'line',pts:aP.pts,col:col.ink,w:1.2,alpha:0.8,bias:0.03},{t:'label',p:V.mul(aP.mid,0.78),segs:[['ψ','i']],dx:-4,dy:5,size:fs+1,col:col.ink});}
    items.push({t:'arrow',p:[0,0,0],v:X,col:col.eth,w:2.6},{t:'arrow',p:[0,0,0],v:Y,col:col.warm,w:2.6});
    const aF=arc(X,Y,0.95);if(aF){items.push({t:'line',pts:aF.pts,col:col.ink,w:1.2,alpha:0.55,dash:[3,3],bias:0.03},{t:'label',p:V.mul(aF.mid,1.25),segs:[['φ','i']],dx:-4,dy:5,size:fs+1,col:col.ink});}
    const lab=(P,t,cl)=>{const n=V.norm(P)||1;items.push({t:'label',p:V.add(P,V.mul(P,0.24/n)),segs:t,dx:-4,dy:5,size:fs+2,col:cl});};
    lab(X,[['ξ','i']],col.eth);lab(Y,[['η','i']],col.warm);
    c.save();c.beginPath();c.rect(0,yb,W,L.hs-yb);c.clip();
    /* the disc is one translucent fill under the scene, so that everything stays visible through it */
    c.globalAlpha=0.13;c.fillStyle=col.eth;c.beginPath();rim.forEach((P,k)=>{const Q=cam.P(P);k?c.lineTo(Q[0],Q[1]):c.moveTo(Q[0],Q[1]);});c.closePath();c.fill();c.globalAlpha=1;
    V.render(c,cam,items,col);
    /* handles: halos at the tips, a dot (ξ) and a ring (η) at the feet, so that both stay visible when the means coincide */
    const tX=cam.P(X),tY=cam.P(Y),fX=cam.P(FX),fY=cam.P(FY);
    [[tX,col.eth],[tY,col.warm]].forEach(z=>{c.fillStyle=TB.rgba(z[1],0.16);c.beginPath();c.arc(z[0][0],z[0][1],12,0,2*PI);c.fill();});
    c.strokeStyle=col.warm;c.lineWidth=2;c.beginPath();c.arc(fY[0],fY[1],7.5,0,2*PI);c.stroke();
    c.fillStyle=col.eth;c.strokeStyle=col.paper;c.lineWidth=1.4;c.beginPath();c.arc(fX[0],fX[1],4.6,0,2*PI);c.fill();c.stroke();
    c.restore();
    /* the triangle of probabilities: the distance from the point to the side opposite the corner ω is proportional to P(ω) */
    G={A:L.A,B:L.B,C:L.C,tX:tX,tY:tY,fX:fX,fY:fY};
    const A=L.A,B=L.B,C=L.C,Q=atB(p),ctr=atB([1/3,1/3,1/3]);
    c.fillStyle=TB.rgba(col.eth,0.07);c.strokeStyle=TB.rgba(col.ink,0.45);c.lineWidth=1;c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.lineTo(C[0],C[1]);c.closePath();c.fill();c.stroke();
    c.font=(fs-1)+'px '+TB.ui;c.fillStyle=col.muted;c.textAlign='center';c.fillText('вероятности исходов',A[0],A[1]-30);c.textAlign='start';
    TB.rich(c,[['ω','i'],[' = 1','m']],A[0],A[1]-9,fs,col.muted,'center');
    TB.rich(c,[['ω','i'],[' = 2','m']],B[0]+6,B[1]+fs+7,fs,col.muted,'center');TB.rich(c,[['ω','i'],[' = 3','m']],C[0]-6,C[1]+fs+7,fs,col.muted,'center');
    c.strokeStyle=TB.rgba(col.ink,0.4);c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();
    for(const s of [[B,C],[C,A],[A,B]]){const f=segNear(Q,s[0],s[1]);c.moveTo(Q[0],Q[1]);c.lineTo(f[0],f[1]);}c.stroke();c.setLineDash([]);
    c.fillStyle=col.muted;c.beginPath();c.arc(ctr[0],ctr[1],2.2,0,2*PI);c.fill();
    c.fillStyle=TB.rgba(col.ink,0.14);c.beginPath();c.arc(Q[0],Q[1],11,0,2*PI);c.fill();
    c.fillStyle=col.ink;c.strokeStyle=col.paper;c.lineWidth=1.5;c.beginPath();c.arc(Q[0],Q[1],5.5,0,2*PI);c.fill();c.stroke();
    /* readouts */
    const vX=E(SX.d.map(v=>v*v)),vY=E(SY.d.map(v=>v*v)),cov=E(hm(SX.d,SY.d)),exy=E(hm(SX.v,SY.v));
    gC.set(exy/Math.sqrt(E(hm(SX.v,SX.v))*E(hm(SY.v,SY.v))));gR.set(cov/Math.sqrt(vX*vY));
    fx.innerHTML=TB.rows([['(<i>P</i>(1); <i>P</i>(2); <i>P</i>(3)) = '+tr(p)],['<i>ξ</i> = '+tr(SX.v)+',','<i>η</i> = '+tr(SY.v)],
      ['𝔼<i>ξ</i> = '+f2(SX.m)+',','𝔼<i>η</i> = '+f2(SY.m)+',','𝔻<i>ξ</i> = '+f3(vX)+',','𝔻<i>η</i> = '+f3(vY)],
      ['Cov(<i>ξ</i>, <i>η</i>) = '+f3(cov)+',','𝔼<i>ξη</i> = Cov(<i>ξ</i>, <i>η</i>) + 𝔼<i>ξ</i>·𝔼<i>η</i> = '+f3(exy)]]);
  }
  /* a press on a tip, a foot or the triangle drags it; a press anywhere else turns the view */
  function hit(x,y){if(!G)return null;if(triDist(x,y)<14)return {k:'tri'};let best=null;
    for(const z of [['tip',0,G.tX,20],['tip',1,G.tY,20],['foot',0,G.fX,13],['foot',1,G.fY,13]]){const d=Math.hypot(z[2][0]-x,z[2][1]-y);
      if(d<z[3]&&(!best||d<best.d))best={k:z[0],i:z[1],d:d,P:z[2]};}
    return best;}
  cv.addEventListener('pointerdown',()=>{pressing=true;});window.addEventListener('pointerup',()=>{pressing=false;});window.addEventListener('pointercancel',()=>{pressing=false;});
  V.interact(cv,st,{active:()=>true,state:()=>st,
    grab(x,y){const h=hit(x,y);if(!pressing)return !!h;drag=h;if(!h)return false;
      if(h.k==='tip'){h.dx=h.P[0]-x;h.dy=h.P[1]-y;}
      else if(h.k==='foot'){h.m0=shown(h.i?YB:XB).m;h.x0=x;h.y0=y;}
      else{setP(x,y);draw();}
      return true;},
    move(x,y){if(!drag)return;if(drag.k==='tri')setP(x,y);else if(drag.k==='tip')moveTip(drag.i,x+drag.dx,y+drag.dy);else moveFoot(drag.i,x,y);draw();},
    redraw:draw});
  cv.style.touchAction='none';cv.style.cursor='grab';
  TB.onTheme(draw);TB.onResize(cv,draw);draw();
  if(window.IntersectionObserver){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();V.intro(st,draw);}},{threshold:0.4});io.observe(cv);}
})();
</script>
