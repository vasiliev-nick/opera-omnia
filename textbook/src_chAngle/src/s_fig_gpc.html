<script>
(function(){
  /* Fig. ∠.6, canvas gpc: Y_t = A cos t + B sin t. Left: the unit circle that Y_t traces in the plane of A and B in L²(P),
     the prediction of Y_s from Y_t as the foot of the perpendicular. Right: the sine curves of a few outcomes with the observed values,
     the true values and the predictions at the moments t and s. */
  const TB=window.TB,cv=document.getElementById('gpc');if(!TB||!cv||!TB.fit||!TB.cols||!TB.drag2d)return;
  const fx=document.getElementById('gpcFx'),btn=document.getElementById('gpcGo'),gR=new TB.Gauge('gGpcR'),gE=new TB.Gauge('gGpcE');
  const PI=Math.PI,TAU=2*PI,NS=5,YM=3;
  let t=0.7,s=1.6,G=null,rev=1,started=false;
  /* standard normal pairs (A, B) of the outcomes: a fixed seed for the first picture, then fresh ones */
  let seed=7;const rnd0=()=>{seed=(seed+0x6D2B79F5)|0;let q=Math.imul(seed^seed>>>15,1|seed);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};
  const gauss=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(TAU*r());
  const draw0=r=>{const o=[];for(let i=0;i<NS;i++)o.push([gauss(r),gauss(r)]);return o;};
  let AB=draw0(rnd0);
  const Yv=(ab,u)=>ab[0]*Math.cos(u)+ab[1]*Math.sin(u);
  const wrap=a=>{a=a%TAU;return a<0?a+TAU:a;},dlt=()=>{let d=wrap(s-t);return d>PI?d-TAU:d;};
  function lay(W){const sm=W<560;if(sm){const h1=Math.round(W*0.86),h2=Math.round(W*0.62);return {sm:sm,H:h1+h2,h1:h1};}
    return {sm:sm,H:Math.max(320,Math.round(W*0.47)),h1:0};}
  function arrow(c,x1,y1,x2,y2,col,lw){const a=Math.atan2(y2-y1,x2-x1),h=7;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;
    TB.ln(c,x1,y1,x2-h*0.6*Math.cos(a),y2-h*0.6*Math.sin(a));c.beginPath();c.moveTo(x2,y2);
    c.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));c.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));c.closePath();c.fill();}
  function draw(){
    const F=TB.fit(cv,W=>lay(W).H),c=F.c,W=F.W,H=F.H,col=TB.cols(),Ly=lay(W),fs=Ly.sm?12:13;
    c.clearRect(0,0,W,H);
    /* panels */
    let L1,T1,W1,H1,L2,T2,W2,H2;
    if(Ly.sm){L1=0;T1=0;W1=W;H1=Ly.h1;L2=30;T2=Ly.h1+8;W2=W-L2-10;H2=H-T2-26;}
    else{W1=Math.min(H,Math.round(W*0.42));L1=0;T1=0;H1=H;L2=W1+34;T2=12;W2=W-L2-18;H2=H-T2-28;}
    /* the circle in the plane of A and B */
    const R=Math.min(W1,H1)*(Ly.sm?0.3:0.33),ox=L1+W1/2,oy=T1+H1/2,P=(a,r)=>[ox+r*R*Math.cos(a),oy-r*R*Math.sin(a)];
    arrow(c,ox-1.3*R,oy,ox+1.3*R,oy,TB.rgba(col.ink,0.45),1);arrow(c,ox,oy+1.3*R,ox,oy-1.3*R,TB.rgba(col.ink,0.45),1);
    TB.rich(c,[['A','i']],ox+1.3*R+6,oy+5,fs,col.muted);TB.rich(c,[['B','i']],ox,oy-1.3*R-7,fs,col.muted,'center');
    c.strokeStyle=TB.rgba(col.ink,0.55);c.lineWidth=1.3;c.beginPath();c.arc(ox,oy,R,0,TAU);c.stroke();
    /* the line through Y_t, clipped to the panel */
    c.save();c.beginPath();c.rect(L1+4,T1+4,W1-8,H1-8);c.clip();
    const u=[Math.cos(t),-Math.sin(t)];c.strokeStyle=TB.rgba(col.eth,0.45);c.lineWidth=1;TB.ln(c,ox-u[0]*2*R,oy-u[1]*2*R,ox+u[0]*2*R,oy+u[1]*2*R);c.restore();
    const d=dlt(),k=Math.cos(d),pt=P(t,1),ps=P(s,1),pf=P(t,k);
    /* the angle s − t */
    const ra=0.26*R;c.strokeStyle=TB.rgba(col.ink,0.6);c.lineWidth=1;c.beginPath();c.arc(ox,oy,ra,-t,-(t+d),d>0);c.stroke();
    if(Math.abs(d)>0.35){const m=t+d/2,q=P(m,0.26+(Ly.sm?0.2:0.17));TB.rich(c,[['s','i'],[' − ','m'],['t','i']],q[0],q[1]+5,fs-1,col.muted,'center');}
    /* the vectors, the perpendicular and the prediction */
    arrow(c,ox,oy,pt[0],pt[1],col.eth,2);arrow(c,ox,oy,ps[0],ps[1],col.warm,2);
    const el=Math.hypot(ps[0]-pf[0],ps[1]-pf[1]);
    if(el>12){const n=[(ps[0]-pf[0])/el,(ps[1]-pf[1])/el],q=8,sg=k>=0?-1:1;c.strokeStyle=TB.rgba(col.ink,0.6);c.lineWidth=1;c.beginPath();
      c.moveTo(pf[0]+sg*u[0]*q,pf[1]+sg*u[1]*q);c.lineTo(pf[0]+sg*u[0]*q+n[0]*q,pf[1]+sg*u[1]*q+n[1]*q);c.lineTo(pf[0]+n[0]*q,pf[1]+n[1]*q);c.stroke();}
    c.setLineDash([5,4]);c.strokeStyle=col.warm;c.lineWidth=1.5;TB.ln(c,ps[0],ps[1],pf[0],pf[1]);c.setLineDash([]);
    c.fillStyle=col.paper;c.strokeStyle=col.ink;c.lineWidth=1.6;c.beginPath();c.arc(pf[0],pf[1],4.5,0,TAU);c.fill();c.stroke();
    if(Math.abs(Math.sin(d))>0.2&&el>1){const nx=-(ps[0]-pf[0])/el,ny=-(ps[1]-pf[1])/el,q=[pf[0]+nx*16,pf[1]+ny*16+5];
      TB.rich(c,[['a','i'],['*','n'],['Y','i'],['t','s']],q[0],q[1],fs,col.ink,nx<-0.3?'right':nx>0.3?'start':'center');}
    [[pt,col.eth,[['Y','i'],['t','s']],t],[ps,col.warm,[['Y','i'],['s','s']],s]].forEach(o=>{const p=o[0];
      c.fillStyle=TB.rgba(o[1],0.18);c.beginPath();c.arc(p[0],p[1],12,0,TAU);c.fill();
      c.fillStyle=o[1];c.strokeStyle=col.paper;c.lineWidth=1.5;c.beginPath();c.arc(p[0],p[1],5.5,0,TAU);c.fill();c.stroke();
      /* the label goes outside the circle, turned away from the ends of the axes A and B where their names stand */
      let a=wrap(o[3]);[0,PI/2,TAU].forEach(z=>{if(Math.abs(a-z)<0.32)a=z+(a>=z?0.32:-0.32);});
      const q=P(a,1.22),cs=Math.cos(a);TB.rich(c,o[2],q[0],q[1]+5,fs,o[1],cs<-0.3?'right':cs>0.3?'start':'center');});
    /* the sine curves of several outcomes */
    const X=v=>L2+W2*v/TAU,Y=v=>T2+H2/2-(H2/2)*v/YM;
    c.font=fs+'px '+TB.ui;c.textAlign='right';
    for(let v=-2;v<=2;v+=2){c.fillStyle=col.muted;c.fillText(v<0?'−'+(-v):String(v),L2-6,Y(v)+4);c.strokeStyle=TB.rgba(col.ink,v?0.1:0.35);c.lineWidth=1;TB.ln(c,L2,Y(v),L2+W2,Y(v));}
    c.textAlign='center';[[0,'0'],[PI/2,'π/2'],[PI,'π'],[1.5*PI,'3π/2'],[TAU,'2π']].forEach(q=>c.fillText(q[1],X(q[0]),T2+H2+17));c.textAlign='start';
    const tw=wrap(t),sw=wrap(s);
    [[tw,col.eth,'t'],[sw,col.warm,'s']].forEach(o=>{c.strokeStyle=TB.rgba(o[1],0.65);c.lineWidth=1.2;TB.ln(c,X(o[0]),T2,X(o[0]),T2+H2);
      TB.rich(c,[[o[2],'i']],X(o[0])+5,T2+13,fs,o[1]);});
    c.save();c.beginPath();c.rect(L2,T2,W2,H2);c.clip();
    const tm=TAU*rev;
    AB.forEach(ab=>{c.strokeStyle=TB.rgba(col.ink,0.5);c.lineWidth=1.3;c.beginPath();
      for(let i=0;i<=240;i++){const v=TAU*i/240;if(v>tm)break;i?c.lineTo(X(v),Y(Yv(ab,v))):c.moveTo(X(v),Y(Yv(ab,v)));}
      if(tm<TAU)c.lineTo(X(tm),Y(Yv(ab,tm)));c.stroke();});
    AB.forEach(ab=>{const yt=Yv(ab,t),ys=Yv(ab,s),yp=k*yt;
      if(tw<=tm){c.fillStyle=col.eth;c.beginPath();c.arc(X(tw),Y(yt),3.6,0,TAU);c.fill();}
      if(sw<=tm&&tw<=tm){c.strokeStyle=col.warm;c.lineWidth=1.6;TB.ln(c,X(sw),Y(ys),X(sw),Y(yp));
        c.fillStyle=col.paper;c.strokeStyle=col.ink;c.lineWidth=1.3;c.beginPath();c.arc(X(sw),Y(yp),3.8,0,TAU);c.fill();c.stroke();}
      if(sw<=tm){c.fillStyle=col.warm;c.beginPath();c.arc(X(sw),Y(ys),3.6,0,TAU);c.fill();}});
    c.restore();
    G={pt:pt,ps:ps,ox:ox,oy:oy,X:X,L2:L2,W2:W2,T2:T2,H2:H2,tw:tw,sw:sw};
    gR.set(k);gE.set(Math.sin(d)**2);
    fx.innerHTML=TB.rows([['<i>t</i> = '+TB.fmt(tw,2)+',','<i>s</i> = '+TB.fmt(sw,2)+',','<i>s</i> − <i>t</i> = '+TB.fmt(d,2)+' (по модулю 2π):'],
      ['<i>ρ</i>(<i>Y<sub>t</sub></i>, <i>Y<sub>s</sub></i>) = cos(<i>s</i> − <i>t</i>) = '+TB.fmt(k,3)+',','прогноз '+TB.fmt(k,3)+'·<i>Y<sub>t</sub></i>,',
        'квадрат ошибки sin²(<i>s</i> − <i>t</i>) = '+TB.fmt(Math.sin(d)**2,3)]]);
  }
  /* new outcomes: the curves are drawn from left to right */
  let run=0;
  function reveal(){const id=++run;if(TB.reduced()){rev=1;draw();return;}rev=0;const t0=performance.now();
    const step=q=>{if(id!==run)return;rev=Math.min(1,(q-t0)/1600);draw();if(rev<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
  btn.addEventListener('click',()=>{AB=draw0(Math.random);reveal();});
  if(window.IntersectionObserver&&!TB.reduced()){rev=0;const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&!started){started=true;io.disconnect();reveal();}},{threshold:0.4});io.observe(cv);}
  /* dragging Y_t and Y_s on the circle, or the moments t and s on the right */
  TB.drag2d(cv,{hit:(x,y,touch)=>{if(!G)return null;const r=touch?24:15;
      const dt=Math.hypot(x-G.pt[0],y-G.pt[1]),ds=Math.hypot(x-G.ps[0],y-G.ps[1]);
      if(Math.min(dt,ds)<r)return {k:dt<=ds?'t':'s',c:true};
      if(y>G.T2&&y<G.T2+G.H2){const a=Math.abs(x-G.X(G.tw)),b=Math.abs(x-G.X(G.sw)),rr=touch?16:8;if(Math.min(a,b)<rr)return {k:a<=b?'t':'s',c:false};}
      return null;},
    move(o,x,y){let v;if(o.c)v=Math.atan2(G.oy-y,x-G.ox);else v=Math.max(0,Math.min(TAU-1e-6,(x-G.L2)/G.W2*TAU));
      v=wrap(v);if(o.k==='t')t=v;else s=v;draw();}});
  TB.onTheme(draw);TB.onResize(cv,draw);draw();
})();
</script>
