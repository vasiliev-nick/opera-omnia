<script>
(function(){
  /* Fig. ∠.4, canvas spk: g = f + a tent of height h and width w at the point a. The value at a differs by |h|,
     the L² distance is |h|·√(w/3); as w → 0 the second goes to zero while the first stays. At w = 0 the functions differ at one point. */
  const TB=window.TB,cv=document.getElementById('spk');if(!TB||!cv||!TB.fit||!TB.cols||!TB.drag2d)return;
  const sl=document.getElementById('spkW'),out=document.getElementById('spkWOut'),fx=document.getElementById('spkFx'),gP=new TB.Gauge('gSpkP'),gL=new TB.Gauge('gSpkL');
  const PI=Math.PI,LO=-1.6,HI=3.6,HMIN=-1.8,HMAX=2.8;
  const f=x=>0.6*Math.sin(2*PI*x)+0.3*Math.cos(3*PI*x+0.4)+0.1;
  let A=0.42,Hh=2.2,G=null;
  const wOf=()=>0.2*Math.pow(+sl.value,2);
  const tent=(x,w)=>w>0?Math.max(0,1-Math.abs(x-A)/(w/2)):0;
  function lay(W){const sm=W<520;return {sm:sm,H:Math.round(sm?W*0.85:Math.max(300,W*0.42)),L:sm?30:38,R:14,B:26};}
  function draw(){
    const F=TB.fit(cv,W=>lay(W).H),c=F.c,W=F.W,H=F.H,col=TB.cols(),Ly=lay(W),fs=Ly.sm?12:13,w=wOf();
    c.clearRect(0,0,W,H);out.textContent=TB.fmt(w,3);
    const yb=TB.legend(c,[{k:'thin',col:col.ink,t:[['f','i']]},{k:'line',col:col.eth,t:[['g','i'],[' = ','m'],['f','i'],[' + шатёр','r']]},
      {k:'fill',col:col.eth,a:0.3,t:[['между ','r'],['f','i'],[' и ','r'],['g','i']]}],Ly.L,W-8,4,fs);
    const x0=Ly.L,x1=W-Ly.R,y0=yb+14,y1=H-Ly.B,X=x=>x0+(x1-x0)*x,Y=v=>y1-(y1-y0)*(v-LO)/(HI-LO);
    c.font=fs+'px '+TB.ui;c.textAlign='right';
    for(let v=Math.ceil(LO);v<=HI;v++){c.fillStyle=col.muted;c.fillText(TB.fmt(v,0),x0-6,Y(v)+4);c.strokeStyle=TB.rgba(col.ink,v?0.1:0.35);c.lineWidth=1;TB.ln(c,x0,Y(v),x1,Y(v));}
    c.textAlign='center';[[0,'0'],[0.5,'1/2'],[1,'1']].forEach(q=>{if(Math.abs(q[0]-A)>0.07)c.fillText(q[1],X(q[0]),y1+17);});c.textAlign='start';
    /* the tent and the area between the graphs */
    const pts=[];for(let i=0;i<=600;i++)pts.push(i/600);
    if(w>0){const l=Math.max(0,A-w/2),r=Math.min(1,A+w/2);pts.push(l,A,r);pts.sort((p,q)=>p-q);
      c.fillStyle=TB.rgba(col.eth,0.3);c.beginPath();c.moveTo(X(l),Y(f(l)));
      for(const x of pts)if(x>=l&&x<=r)c.lineTo(X(x),Y(f(x)+Hh*tent(x,w)));
      for(let i=pts.length-1;i>=0;i--){const x=pts[i];if(x>=l&&x<=r)c.lineTo(X(x),Y(f(x)));}c.closePath();c.fill();}
    c.strokeStyle=col.ink;c.lineWidth=1.3;c.beginPath();pts.forEach((x,i)=>i?c.lineTo(X(x),Y(f(x))):c.moveTo(X(x),Y(f(x))));c.stroke();
    c.strokeStyle=col.eth;c.lineWidth=2.2;c.beginPath();pts.forEach((x,i)=>{const y=Y(f(x)+Hh*tent(x,w));i?c.lineTo(X(x),y):c.moveTo(X(x),y);});c.stroke();
    /* the point a: at w = 0 the value of g at a alone is moved */
    const px=X(A),pf=Y(f(A)),pt=Y(f(A)+Hh);
    c.setLineDash([3,3]);c.strokeStyle=TB.rgba(col.ink,0.5);c.lineWidth=1;TB.ln(c,px,pf,px,y1);c.setLineDash([]);
    TB.rich(c,[['a','i']],px,y1+17,fs,col.ink,'center');
    if(w===0){c.setLineDash([2,3]);c.strokeStyle=TB.rgba(col.eth,0.7);TB.ln(c,px,pf,px,pt);c.setLineDash([]);
      c.strokeStyle=col.eth;c.fillStyle=col.paper;c.lineWidth=1.6;c.beginPath();c.arc(px,pf,4.5,0,2*PI);c.fill();c.stroke();}
    c.fillStyle=TB.rgba(col.eth,0.18);c.beginPath();c.arc(px,pt,12,0,2*PI);c.fill();
    c.fillStyle=col.eth;c.strokeStyle=col.paper;c.lineWidth=1.5;c.beginPath();c.arc(px,pt,5.5,0,2*PI);c.fill();c.stroke();
    G={X:X,Y:Y,x0:x0,x1:x1,px:px,pt:pt,y0:y0,y1:y1};
    const dp=Math.abs(Hh),dl=Math.abs(Hh)*Math.sqrt(w/3);gP.set(dp);gL.set(dl);
    fx.innerHTML=TB.rows([['<i>a</i> = '+TB.fmt(A,3)+',','<i>h</i> = '+TB.fmt(Hh,2)+',','<i>w</i> = '+TB.fmt(w,4)+':'],
      ['|<i>g</i>(<i>a</i>) − <i>f</i>(<i>a</i>)| = |<i>h</i>| = '+TB.fmt(dp,3)+',','‖<i>g</i> − <i>f</i>‖ = |<i>h</i>|·√(<i>w</i>/3) = '+TB.fmt(dl,4)]]);
  }
  TB.drag2d(cv,{hit:(x,y,touch)=>G&&Math.hypot(x-G.px,y-G.pt)<(touch?24:16)?{dx:G.px-x,dy:G.pt-y}:null,
    move(d,x,y){const g=G,xx=Math.max(g.x0,Math.min(g.x1,x+d.dx)),yy=y+d.dy;
      A=Math.max(0.03,Math.min(0.97,(xx-g.x0)/(g.x1-g.x0)));
      const v=LO+(g.y1-yy)/(g.y1-g.y0)*(HI-LO);Hh=Math.max(HMIN,Math.min(HMAX,v-f(A)));draw();}});
  sl.addEventListener('input',draw);TB.onTheme(draw);TB.onResize(cv,draw);draw();
})();
</script>
