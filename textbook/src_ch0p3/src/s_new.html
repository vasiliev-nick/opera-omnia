<script>
(function(){
  /* Canvas sizing for the figures of part 3: drawing in CSS pixels at the width of the column, sharp on dense screens; rich labels and a legend row. */
  const TB=window.TB;if(!TB)return;
  TB.fit=function(cv,hOf){
    const W=Math.round(cv.parentNode.getBoundingClientRect().width)||760,H=Math.round(hOf(W)),r=window.devicePixelRatio||1;
    const bw=Math.round(W*r),bh=Math.round(H*r);if(cv.width!==bw)cv.width=bw;if(cv.height!==bh)cv.height=bh;
    const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);c.textAlign='start';c.textBaseline='alphabetic';c.setLineDash([]);
    return {c:c,W:W,H:H};};
  TB.onResize=function(cv,fn){let w=Math.round(cv.parentNode.getBoundingClientRect().width);
    if(window.ResizeObserver)new ResizeObserver(()=>{const nw=Math.round(cv.parentNode.getBoundingClientRect().width);if(nw!==w){w=nw;fn();}}).observe(cv.parentNode);
    else window.addEventListener('resize',fn);};
  /* A label is a list of [text, kind]: 'i' italic letter, 's' italic subscript, 'r' upright sans, 'm' upright serif. */
  function font(k,s){return k==='i'?'italic '+(s+2)+'px '+TB.serif:k==='s'?'italic '+Math.round(s*0.78)+'px '+TB.serif:k==='m'?(s+1)+'px '+TB.serif:s+'px '+TB.ui;}
  const fsz=(k,s)=>k==='s'?Math.round(s*0.78):k==='m'?s+1:k==='r'?s:s+2;
  /* The italic θ of the text fonts is often the open, cursive form; the closed formula θ is drawn by hand so that labels match the formulas. */
  TB.theta=function(c,x,y,f,col){c.save();c.translate(x,y);c.transform(1,0,-0.2,1,0,0);c.strokeStyle=col;c.setLineDash([]);
    c.lineWidth=Math.max(1,f*0.075);c.beginPath();c.ellipse(f*0.27,-f*0.36,f*0.155,f*0.335,0,0,7);c.stroke();
    c.lineWidth=Math.max(0.9,f*0.06);c.beginPath();c.moveTo(f*0.12,-f*0.36);c.lineTo(f*0.42,-f*0.36);c.stroke();c.restore();};
  const segW=(c,q,s)=>{if(q[0]==='θ')return fsz(q[1],s)*0.56;c.font=font(q[1],s);return c.measureText(q[0]).width;};
  TB.richW=function(c,segs,s){let w=0;for(const q of segs)w+=segW(c,q,s)+(q[1]==='i'?1:0);return w;};
  TB.rich=function(c,segs,x,y,s,col,align){
    const w=TB.richW(c,segs,s);if(align==='center')x-=w/2;else if(align==='right')x-=w;
    c.fillStyle=col;c.textAlign='start';
    for(const q of segs){const gw=segW(c,q,s),yy=q[1]==='s'?y+s*0.3:y;
      if(q[0]==='θ')TB.theta(c,x,yy,fsz(q[1],s),col);else{c.font=font(q[1],s);c.fillStyle=col;c.fillText(q[0],x,yy);}
      x+=gw+(q[1]==='i'?1:0);}
    return w;};
  /* The same closed θ inside HTML readouts. */
  TB.thSvg='<svg class="gth" viewBox="0 -74 58 76" aria-label="θ"><g transform="skewX(-11.3)"><ellipse cx="27" cy="-36" rx="15.5" ry="33.5"/><line x1="12" y1="-36" x2="42" y2="-36"/></g></svg>';
  /* Legend items: {k:'line'|'thin'|'dash'|'fill', col, a (fill opacity), t: label}. Wraps to the next row when needed; returns the bottom y. */
  TB.legend=function(c,items,L,R,y,s){
    const sw=22,gap=18,rowH=s+9;let x=L;y+=s;
    for(const it of items){const w=sw+6+TB.richW(c,it.t,s);
      if(x>L&&x+w>R){x=L;y+=rowH;}
      const ym=y-s*0.33;
      if(it.k==='fill'){c.fillStyle=TB.rgba(it.col,it.a||0.3);c.fillRect(x,ym-6,sw,12);}
      else{c.strokeStyle=it.col;c.lineWidth=it.k==='thin'?1.2:2.2;c.setLineDash(it.k==='dash'?[5,4]:[]);
        c.beginPath();c.moveTo(x,ym);c.lineTo(x+sw,ym);c.stroke();c.setLineDash([]);}
      TB.rich(c,it.t,x+sw+6,y,s,TB.tok('--ink'));x+=w+gap;}
    return y+7;};
  /* Readout lines for .fx: each part stays on one line, a line may break only between parts. */
  TB.rows=rows=>rows.map(r=>'<span>'+r.map(p=>'<span class="nw">'+p+'</span>').join('&emsp;')+'</span>').join('').replace(/(<i[^>]*>)θ(<\/i>)/g,'$1'+TB.thSvg+'$2');
  TB.segs=function(cv,fn){const b=[...cv.closest('figure').querySelectorAll('.seg button')];
    b.forEach(e=>e.addEventListener('click',()=>{b.forEach(o=>o.setAttribute('aria-pressed',o===e?'true':'false'));fn(e.dataset.k);}));
    const on=b.find(e=>e.getAttribute('aria-pressed')==='true');return on?on.dataset.k:b[0].dataset.k;};
})();
</script>
<script>
(function(){
  /* Small shared pieces for the figures of part 3: theme colours, superscript digits, a heat-map pixel buffer. */
  const TB=window.TB;if(!TB)return;
  TB.cols=()=>({ink:TB.tok('--ink'),muted:TB.tok('--muted'),rule:TB.tok('--rule'),eth:TB.tok('--ether'),warm:TB.tok('--warm'),paper:TB.tok('--paper')});
  const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  TB.sup=n=>String(n).split('').map(ch=>SUP[ch]||ch).join('');
  /* Paint an n×n off-screen image: col(i,j) returns [r,g,b] for the pixel whose centre is ((i+.5)/n,(j+.5)/n), j counted from the bottom. */
  TB.heat=function(n,col){const o=document.createElement('canvas');o.width=n;o.height=n;const x=o.getContext('2d'),im=x.createImageData(n,n),d=im.data;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){const c=col(i,j),k=4*((n-1-j)*n+i);d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}
    x.putImageData(im,0,0);return o;};
  TB.mixa=(a,b,t)=>{const A=TB.hex(a),B=TB.hex(b);return [0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t));};
  TB.tickLabel=v=>TB.fmt(v,Math.abs(v-Math.round(v))<1e-9?0:(Math.abs(v*10-Math.round(v*10))<1e-9?1:2));
})();
</script>
<script>
(function(){
  /* Figure #push: the image of Lebesgue measure on [0,1] under T; points travel up to the graph and across to the y-axis, where a histogram of T_*λ grows. */
  const cv=document.getElementById('push');if(!cv||!window.TB||!TB.fit)return;
  const sl=document.getElementById('puH'),so=document.getElementById('puHOut'),fx=document.getElementById('puFx');
  const g1=new TB.Gauge('gPu1'),g2=new TB.Gauge('gPu2');
  const TF={M:x=>x+0.18*Math.sin(2*Math.PI*x)*(1-x),H:x=>6.75*x*(1-x)*(1-x)};
  const N=40000,cache={},HM=3;
  function vals(k){if(cache[k])return cache[k];const T=TF[k],v=new Float64Array(N);let s=0;
    for(let i=0;i<N;i++){v[i]=T((i+0.5)/N);s+=v[i]*v[i];}return cache[k]={v:v,I2:s/N};}
  let md=TB.segs(cv,k=>{md=k;draw();});
  const Y0=0.55;
  const sub=(a,b)=>a+'<sub>'+b+'</sub>',Tl=sub('<i>T</i>','*')+sub('<i>λ</i>',1),Ij=sub('<i>I</i>','<i>j</i>'),cj=sub('<i>c</i>','<i>j</i>');
  function draw(){
    const hv=+sl.value,nb=5*Math.pow(2,hv-1),h=1/nb;so.textContent=String(h).replace('.',',');
    const D=vals(md),T=TF[md];
    const m=new Float64Array(nb);for(let i=0;i<N;i++){let j=Math.floor(D.v[i]*nb);if(j>=nb)j=nb-1;if(j<0)j=0;m[j]++;}
    let S=0,mx=0;for(let j=0;j<nb;j++){m[j]/=N;const c=(j+0.5)*h;S+=c*c*m[j];mx=Math.max(mx,m[j]/h);}
    const js=Math.floor(Y0*nb),a=js*h,b=a+h;
    const F=TB.fit(cv,W=>Math.max(280,Math.min(380,Math.round(W*0.5)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,L=sm?30:40,R=W-(sm?8:14);
    const top=TB.legend(c,[{k:'line',col:K.ink,t:[['y','i'],[' = ','m'],['T','i'],['(','m'],['x','i'],[')','m']]},
      {k:'fill',col:K.eth,a:0.4,t:[['T','i'],['*','s'],['λ','i'],['1','s'],['(','m'],['I','i'],['j','s'],[')','m'],[' / ','m'],['h','i']]},
      {k:'fill',col:K.warm,a:0.7,t:[['I','i'],['j','s'],[' и ','r'],['T','i'],['⁻¹','m'],['(','m'],['I','i'],['j','s'],[')','m']]}],L,R,4,s)+8;
    const B=H-(sm?26:30),XL=L+(R-L)*0.55,HX0=XL+(sm?18:30),HR=R-6;
    const X=x=>L+x*(XL-L),Y=y=>B-y*(B-top);
    const hm=HM,HX=v=>HX0+Math.min(v,hm)/hm*(HR-HX0);
    // the highlighted interval of the y-axis, across both panels
    c.fillStyle=TB.rgba(K.warm,0.12);c.fillRect(L,Y(b),HR-L,Y(a)-Y(b));
    // axes
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,top);c.lineTo(L,B);c.lineTo(XL,B);c.moveTo(HX0,top);c.lineTo(HX0,B);c.lineTo(HR,B);
    for(const v of [0,0.5,1]){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));c.moveTo(X(v),B);c.lineTo(X(v),B+4);}
    const ht=[0,1,2,3];for(const v of ht){c.moveTo(HX(v),B);c.lineTo(HX(v),B+4);}c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';for(const v of [0,0.5,1])c.fillText(TB.tickLabel(v),L-7,Y(v)+s*0.35);
    c.textAlign='center';for(const v of [0,0.5,1])c.fillText(TB.tickLabel(v),X(v),B+s+5);for(const v of ht)c.fillText(TB.tickLabel(v),HX(v),B+s+5);c.textAlign='start';
    TB.rich(c,[['x','i']],XL+4,B-5,s,K.muted);TB.rich(c,[['y','i']],L+6,top+s,s,K.muted);
    // paths of some grid points: up to the graph, then right to the histogram axis
    for(let k=0;k<=60;k+=3){const x=k/60,y=T(x),hit=y>=a&&y<b;
      c.strokeStyle=hit?TB.rgba(K.warm,0.95):TB.rgba(K.muted,0.38);c.lineWidth=hit?1.5:1;
      c.beginPath();c.moveTo(X(x),B);c.lineTo(X(x),Y(y));c.lineTo(HX0,Y(y));c.stroke();}
    // the preimage of the highlighted interval on the x-axis
    c.strokeStyle=K.warm;c.lineWidth=5;c.beginPath();const M=2000;let on=-1;
    for(let i=0;i<=M;i++){const x=i/M,y=i<M?T(x):-1,inb=y>=a&&y<b;if(inb&&on<0)on=x;if(!inb&&on>=0){const xm=(X(on)+X(x))/2,hw=Math.max(2.5,(X(x)-X(on))/2);c.moveTo(xm-hw,B-2.5);c.lineTo(xm+hw,B-2.5);on=-1;}}
    c.stroke();
    // grid points and their images
    for(let k=0;k<=60;k++){const x=k/60;c.fillStyle=K.muted;c.beginPath();c.arc(X(x),B,1.7,0,7);c.fill();
      c.fillStyle=K.eth;c.beginPath();c.arc(HX0,Y(T(x)),1.7,0,7);c.fill();}
    // the graph
    c.strokeStyle=K.ink;c.lineWidth=2.2;c.beginPath();for(let i=0;i<=300;i++){const x=i/300;i?c.lineTo(X(x),Y(T(x))):c.moveTo(X(x),Y(T(x)));}c.stroke();
    // histogram of T_*λ
    for(let j=0;j<nb;j++){if(m[j]<=0)continue;const y1=Y(j*h),y2=Y((j+1)*h);
      c.fillStyle=j===js?TB.rgba(K.warm,0.7):TB.rgba(K.eth,0.4);c.fillRect(HX0,y2,HX(m[j]/h)-HX0,y1-y2);}
    if(nb<=20){c.strokeStyle=TB.rgba(K.eth,0.8);c.lineWidth=1;for(let j=0;j<nb;j++){if(m[j]<=0)continue;const y1=Y(j*h),y2=Y((j+1)*h);c.strokeRect(HX0,y2,HX(m[j]/h)-HX0,y1-y2);}}
    // bars longer than the scale are cut at the right edge: a dashed edge line, and the length of the longest bar
    if(mx>hm){let jm=0,lo=nb;for(let j=0;j<nb;j++){if(m[j]/h>hm)lo=Math.min(lo,j);if(m[j]>m[jm])jm=j;}
      c.strokeStyle=K.ink;c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(HR+0.5,top);c.lineTo(HR+0.5,B);c.stroke();c.setLineDash([]);
      const lb=[['длина до ','r'],[TB.fmt(mx,2),'r']],lw=TB.richW(c,lb,s-1),ly=Math.min(B-6,Y(lo*h)+s+8);
      c.fillStyle=TB.rgba(K.paper,0.85);c.fillRect(HR-lw-8,ly-s-1,lw+6,s+6);TB.rich(c,lb,HR-4,ly,s-1,K.ink,'right');}
    const fm=(v,d)=>TB.fmt(v,d),tr=v=>TB.fmt(v,5).replace(/0+$/,'').replace(/,$/,'');
    fx.innerHTML=TB.rows([['<i>h</i> = '+String(h).replace('.',',')+',',Ij+' = ['+tr(a)+'; '+tr(b)+'),'],
      [Tl+'('+Ij+') = <i>λ</i><sub>1</sub>(<i>T</i><sup>−1</sup>('+Ij+')) ≈ '+fm(m[js],4)],
      ['∑ '+cj+'<sup>2</sup> '+Tl+'('+Ij+') ≈ '+fm(S,4)+',','∫<sub>0</sub><sup>1</sup> <i>T</i>(<i>x</i>)<sup>2</sup> <i>dx</i> ≈ '+fm(D.I2,4)]]);
    g1.set(D.I2);g2.set(S);g2.mark('l',D.I2,'∫<sub>0</sub><sup>1</sup> <i>T</i><sup>2</sup>');
  }
  sl.addEventListener('input',draw);draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Figure #cantor: the Cantor distribution against a distribution with a density; histograms on triadic intervals and distribution functions. */
  const cv=document.getElementById('cantor');if(!cv||!window.TB||!TB.fit)return;
  const sl=document.getElementById('caK'),so=document.getElementById('caKOut'),fx=document.getElementById('caFx');
  const g1=new TB.Gauge('gCa1'),g2=new TB.Gauge('gCa2');
  const Kf=x=>{let s=0,p=1/3;for(let j=0;j<40;j++){x*=2;const d=x>=1?1:0;x-=d;s+=2*d*p;p/=3;}return s;};
  const FCx=t=>{if(t<=0)return 0;if(t>=1)return 1;let lo=0,hi=1;for(let i=0;i<46;i++){const mid=(lo+hi)/2;if(Kf(mid)<=t)lo=mid;else hi=mid;}return lo;};
  const NG=1200,FCg=[];for(let i=0;i<=NG;i++)FCg.push(FCx(i/NG));
  const FP=t=>t<=0?0:t>=1?1:t*t*(6-8*t+3*t*t),pP=t=>t<0||t>1?0:12*t*(1-t)*(1-t);
  const inC=(j,k)=>{for(let i=0;i<k;i++){if(j%3===1)return false;j=Math.floor(j/3);}return true;};
  let md=TB.segs(cv,k=>{md=k;draw();});
  g1.mark('p',16/9,'max <i>p</i>');
  function draw(){
    const k=+sl.value;so.textContent=k;const n=Math.pow(3,k),w=1/n;
    const ms=new Float64Array(n);for(let j=0;j<n;j++)ms[j]=md==='C'?(inC(j,k)?Math.pow(2,-k):0):FP((j+1)*w)-FP(j*w);
    const F=TB.fit(cv,W=>Math.max(330,Math.min(420,Math.round(W*0.55)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,L=sm?30:40,R=W-(sm?8:14),PR=R-10;
    const items=[{k:'fill',col:K.eth,a:0.45,t:[['мера / длина','r']]}];
    if(md==='P')items.push({k:'line',col:K.warm,t:[['p','i']]});
    items.push({k:'line',col:K.ink,t:[['F','i']]},{k:'dash',col:K.eth,t:[['ломаная','r']]});
    const top=TB.legend(c,items,L,R,4,s)+8;
    const B2=H-(sm?24:28),gap=sm?26:30,mid=top+(B2-top)*0.56,B1=mid-gap/2,T2=mid+gap/2-6;
    const X=x=>L+x*(PR-L),Y1=y=>B1-y/3*(B1-top),Y2=y=>B2-y*(B2-T2);
    // axes
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();
    c.moveTo(L,top);c.lineTo(L,B1);c.lineTo(R,B1);c.moveTo(L,T2);c.lineTo(L,B2);c.lineTo(R,B2);
    for(const v of [1,2,3]){c.moveTo(L-4,Y1(v));c.lineTo(L,Y1(v));}for(const v of [0.5,1]){c.moveTo(L-4,Y2(v));c.lineTo(L,Y2(v));}
    for(const v of [0,1/3,2/3,1]){c.moveTo(X(v),B1);c.lineTo(X(v),B1+4);c.moveTo(X(v),B2);c.lineTo(X(v),B2+4);}c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';
    for(const v of [0,1,2,3])c.fillText(String(v),L-7,Y1(v)+s*0.35);for(const v of [0,0.5,1])c.fillText(TB.tickLabel(v),L-7,Y2(v)+s*0.35);
    c.textAlign='center';const xl=['0','1/3','2/3','1'];[0,1/3,2/3,1].forEach((v,i)=>c.fillText(xl[i],X(v),B2+s+5));c.textAlign='start';
    TB.rich(c,[['t','i']],R-8,B2-5,s,K.muted);
    // bars
    let mh=0,sup=0,clip=false;
    c.fillStyle=TB.rgba(K.eth,0.45);
    for(let j=0;j<n;j++){if(ms[j]<=0)continue;const hgt=ms[j]/w;mh=Math.max(mh,hgt);sup+=w;
      const x1=X(j*w),x2=Math.max(X((j+1)*w),x1+1),yt=Math.max(top,Y1(hgt));if(hgt>3)clip=true;c.fillRect(x1,yt,x2-x1,B1-yt);}
    if(n<=27){c.strokeStyle=TB.rgba(K.eth,0.9);c.lineWidth=1;for(let j=0;j<n;j++){if(ms[j]<=0)continue;const yt=Math.max(top,Y1(ms[j]/w));c.strokeRect(X(j*w),yt,X((j+1)*w)-X(j*w),B1-yt);}}
    if(md==='P'){c.strokeStyle=K.warm;c.lineWidth=2.2;c.beginPath();for(let i=0;i<=300;i++){const t=i/300;i?c.lineTo(X(t),Y1(pP(t))):c.moveTo(X(t),Y1(pP(t)));}c.stroke();}
    if(clip){c.fillStyle=K.paper;const lb=[['высота (3/2)','r'],[TB.sup(k),'r'],[' ≈ '+TB.fmt(Math.pow(1.5,k),2),'r']],lw=TB.richW(c,lb,s);
      c.globalAlpha=0.85;c.fillRect(X(0.5)-lw/2-4,top+2,lw+8,s+8);c.globalAlpha=1;TB.rich(c,lb,X(0.5),top+s+4,s,K.ink,'center');
      c.strokeStyle=K.ink;c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(L,top+0.5);c.lineTo(PR,top+0.5);c.stroke();c.setLineDash([]);}
    // distribution functions
    const Fv=t=>{if(md==='P')return FP(t);const u=t*NG,i=Math.min(NG-1,Math.floor(u));return FCg[i]+(FCg[i+1]-FCg[i])*(u-i);};
    c.strokeStyle=K.ink;c.lineWidth=2;c.beginPath();for(let i=0;i<=NG;i++){const t=i/NG;i?c.lineTo(X(t),Y2(Fv(t))):c.moveTo(X(t),Y2(Fv(t)));}c.stroke();
    c.strokeStyle=K.eth;c.lineWidth=2;c.setLineDash([6,4]);c.beginPath();let acc=0;c.moveTo(X(0),Y2(0));
    for(let j=0;j<n;j++){acc+=ms[j];c.lineTo(X((j+1)*w),Y2(acc));}c.stroke();c.setLineDash([]);
    // readouts
    const two='2<sup>−'+k+'</sup>',r32='(3/2)<sup>'+k+'</sup>',r23='(2/3)<sup>'+k+'</sup>';
    if(md==='C')fx.innerHTML=TB.rows([['<i>μ</i><sub><i>C</i></sub> каждого из 2<sup>'+k+'</sup> отрезков = '+two+' = '+TB.fmt(Math.pow(2,-k),4)+','],
      ['высота = '+two+' · 3<sup>'+k+'</sup> = '+r32+' = '+TB.fmt(Math.pow(1.5,k),3)+',','<i>λ</i><sub>1</sub>(<i>C</i><sub>'+k+'</sub>) = '+r23+' = '+TB.fmt(Math.pow(2/3,k),3)]]);
    else fx.innerHTML=TB.rows([['наибольшая высота = 3<sup>'+k+'</sup> · max<sub><i>j</i></sub> <i>μ</i>(<i>I<sub>j</sub></i>) = '+TB.fmt(mh,3)+',','max <i>p</i> = '+TB.fr(16,9)+' ≈ 1,778'],
      ['длина опоры = 1']]);

<script>

<script>
(function(){
  /* Figure #gauss2: the standard Gaussian density on the plane and its image under a lower-triangular A; circles go to ellipses, the unit square to a parallelogram. */
  const cv=document.getElementById('gauss2');if(!cv||!window.TB||!TB.fit)return;
  const sa=document.getElementById('g2A'),sb=document.getElementById('g2B'),sd=document.getElementById('g2D'),fx=document.getElementById('g2Fx');
  const oa=document.getElementById('g2AOut'),ob=document.getElementById('g2BOut'),od=document.getElementById('g2DOut');
  const g1=new TB.Gauge('gG21'),g2=new TB.Gauge('gG22');
  const P0=1-Math.exp(-0.5);g2.mark('a',P0,'1 − <i>e</i><sup>−1/2</sup>');
  const phi2=(u,v)=>Math.exp(-(u*u+v*v)/2)/(2*Math.PI),R0=4,NP=170;
  const tone=p=>1-Math.exp(-p/0.12);
  let imgL=null,keyL='';
  function draw(){
    const a=+sa.value,b=+sb.value,d=+sd.value;oa.textContent=TB.fmt(a,2);ob.textContent=TB.fmt(b,2);od.textContent=TB.fmt(d,2);
    const det=a*d,inv=(x,y)=>{const u=x/a;return [u,(y-b*u)/d];};
    const F=TB.fit(cv,W=>{const sm=W<520,P=(W-(sm?16:28)-(sm?40:56)-(sm?14:24))/2;return Math.max(220,Math.round(P+(sm?96:82)));}),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,L=sm?20:28,R=W-(sm?8:14),gp=sm?20:28;
    const top=TB.legend(c,[{k:'line',col:K.ink,t:[['|','m'],['z','i'],['| = 1, 2 и эллипсы ','r'],['E','i'],['1','s'],[', ','r'],['E','i'],['2','s']]},{k:'line',col:K.warm,t:[['[0, 1)²','m'],[' и ','r'],['A','i'],['[0, 1)²','m']]}],L,R,4,s)+8;
    const B=H-(sm?24:28),P=Math.min(B-top,(R-L-gp)/2),XA=L,XB=L+P+gp;
    const tr=(X0,x,y)=>[X0+(x+R0)/(2*R0)*P,B-(y+R0)/(2*R0)*P];
    const key=K.paper+K.eth;if(!imgL||keyL!==key){keyL=key;imgL=TB.heat(NP,(i,j)=>{const x=-R0+2*R0*(i+0.5)/NP,y=-R0+2*R0*(j+0.5)/NP;return TB.mixa(K.paper,K.eth,tone(phi2(x,y))*0.92);});}
    const imgR=TB.heat(NP,(i,j)=>{const x=-R0+2*R0*(i+0.5)/NP,y=-R0+2*R0*(j+0.5)/NP,z=inv(x,y);return TB.mixa(K.paper,K.eth,tone(phi2(z[0],z[1])/det)*0.92);});
    c.imageSmoothingEnabled=true;c.drawImage(imgL,XA,B-P,P,P);c.drawImage(imgR,XB,B-P,P,P);
    for(const X0 of [XA,XB]){
      c.strokeStyle=K.rule;c.lineWidth=1;c.strokeRect(X0,B-P,P,P);c.beginPath();
      for(let v=-R0+1;v<R0;v++){const p=tr(X0,v,-R0),q=tr(X0,-R0,v);c.moveTo(p[0],B);c.lineTo(p[0],B+4);c.moveTo(X0-4,q[1]);c.lineTo(X0,q[1]);}
      c.stroke();c.strokeStyle=TB.rgba(K.muted,0.35);c.beginPath();const o=tr(X0,0,0);c.moveTo(X0,o[1]);c.lineTo(X0+P,o[1]);c.moveTo(o[0],B-P);c.lineTo(o[0],B);c.stroke();
      c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='center';for(const v of [-2,0,2])c.fillText(TB.fmt(v,0),tr(X0,v,0)[0],B+s+5);
      if(X0===XA){c.textAlign='right';for(const v of [-2,0,2])c.fillText(TB.fmt(v,0),X0-6,tr(X0,0,v)[1]+s*0.35);}c.textAlign='start';}
    const curve=(X0,map)=>{c.beginPath();for(let i=0;i<=160;i++){const t=2*Math.PI*i/160,p=map(Math.cos(t),Math.sin(t)),q=tr(X0,p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);}c.closePath();c.stroke();};
    const poly=(X0,pts)=>{c.beginPath();pts.forEach((p,i)=>{const q=tr(X0,p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.closePath();};
    const Am=(u,v)=>[a*u,b*u+d*v],sq=[[0,0],[1,0],[1,1],[0,1]];
    c.save();c.beginPath();c.rect(XA,B-P,P,P);c.rect(XB,B-P,P,P);c.clip();
    c.strokeStyle=K.ink;c.lineWidth=1.6;for(const r of [1,2]){curve(XA,(u,v)=>[r*u,r*v]);curve(XB,(u,v)=>Am(r*u,r*v));}
    c.fillStyle=TB.rgba(K.warm,0.3);c.strokeStyle=K.warm;c.lineWidth=2;poly(XA,sq);c.fill();c.stroke();poly(XB,sq.map(p=>Am(p[0],p[1])));c.fill();c.stroke();
    c.restore();
    TB.rich(c,[['ζ','i']],XA+8,B-P+s+6,s,K.ink);TB.rich(c,[['X','i'],[' = ','m'],['A','i'],['ζ','i']],XB+8,B-P+s+6,s,K.ink);
    // area of A[0,1)² by counting grid points, and P(X ∈ E_1) by a grid sum
    const dlt=0.01,xs0=Math.min(0,a),xs1=Math.max(0,a),ys0=Math.min(0,b,b+d,d),ys1=Math.max(0,b,b+d,d);let cnt=0;
    for(let x=xs0+dlt/2;x<xs1;x+=dlt)for(let y=ys0+dlt/2;y<ys1;y+=dlt){const z=inv(x,y);if(z[0]>=0&&z[0]<1&&z[1]>=0&&z[1]<1)cnt++;}
    const area=cnt*dlt*dlt;
    const ex=a,ey=Math.hypot(b,d),M=240,hx=2*ex/M,hy=2*ey/M;let pr=0;
    for(let i=0;i<M;i++)for(let j=0;j<M;j++){const x=-ex+(i+0.5)*hx,y=-ey+(j+0.5)*hy,z=inv(x,y);if(z[0]*z[0]+z[1]*z[1]<=1)pr+=phi2(z[0],z[1])/det*hx*hy;}
    g1.mark('d',det,'|det <i>A</i>|').set(area);g2.set(pr);
    const s11=a*a,s12=a*b,s22=b*b+d*d;
    fx.innerHTML=TB.rows([['det <i>A</i> = <i>a</i><sub>11</sub><i>a</i><sub>22</sub> = '+TB.fmt(det,3)+',','√det <i>Σ</i> = |det <i>A</i>| = '+TB.fmt(det,3)+','],
      ['<i>Σ</i> = <i>AA</i><sup>⊤</sup>: <i>σ</i><sub>11</sub> = '+TB.fmt(s11,3)+',','<i>σ</i><sub>12</sub> = '+TB.fmt(s12,3)+',','<i>σ</i><sub>22</sub> = '+TB.fmt(s22,3)+','],
      ['max <i>p</i><sub><i>X</i></sub> = 1/(2π √det <i>Σ</i>) = '+TB.fmt(1/(2*Math.PI*det),3)]]);
  }
  [sa,sb,sd].forEach(e=>e.addEventListener('input',draw));draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Figure #layer: the area under a graph collected by vertical strips or by horizontal layers; on the right, t ↦ λ{f > t} on the same t-axis. */
  const cv=document.getElementById('layer');if(!cv||!window.TB||!TB.fit)return;
  const sl=document.getElementById('lyN'),so=document.getElementById('lyNOut'),fx=document.getElementById('lyFx'),g=new TB.Gauge('gLy');
  const bump=(x,c,wl,wr)=>{const w=x<c?wl:wr;return Math.exp(-(x-c)*(x-c)/(2*w*w));};
  const f=x=>0.12+0.05*x+0.78*bump(x,0.28,0.09,0.16)+0.42*bump(x,0.76,0.07,0.05);
  const NM=4000,FV=new Float64Array(NM);let If=0;for(let i=0;i<NM;i++){FV[i]=f((i+0.5)/NM);If+=FV[i]/NM;}
  const mt=t=>{let k=0;for(let i=0;i<NM;i++)if(FV[i]>t)k++;return k/NM;};
  const MT=[];for(let i=0;i<=400;i++)MT.push(mt(i/400));
  const segsAbove=t=>{const out=[];let on=-1;for(let i=0;i<=NM;i++){const inb=i<NM&&FV[i]>t;if(inb&&on<0)on=i/NM;if(!inb&&on>=0){out.push([on,i/NM]);on=-1;}}return out;};
  let md=TB.segs(cv,k=>{md=k;draw();});
  g.mark('i',If,'∫<i>f</i> <i>dλ</i><sub>1</sub>');
  function draw(){
    const n=+sl.value;so.textContent=n;const N=Math.pow(2,n);
    const F=TB.fit(cv,W=>Math.max(260,Math.min(400,Math.round(W*0.52)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,L=sm?30:40,R=W-(sm?8:14);
    const top=TB.legend(c,[{k:'line',col:K.ink,t:[['f','i']]},{k:'line',col:K.eth,t:[['t','i'],[' ↦ ','m'],['λ','i'],['1','s'],['({','m'],['f','i'],[' > ','m'],['t','i'],['})','m']]},
      {k:'fill',col:K.warm,a:0.4,t:[[md==='V'?'полоски':'слои','r']]}],L,R,4,s)+8;
    const B=H-(sm?24:28),XL=L+(R-L)*0.56,RX=XL+(sm?22:40),RR=R-8;
    const X=x=>L+x*(XL-L),Y=t=>B-t*(B-top),RXv=m=>RX+m*(RR-RX);
    let sum=0;
    c.fillStyle=TB.rgba(K.warm,0.4);
    if(md==='V'){c.strokeStyle=TB.rgba(K.warm,0.95);c.lineWidth=1;
      for(let k=0;k<N;k++){let mn=Infinity;const a=k/N,b=(k+1)/N;for(let i=0;i<=60;i++)mn=Math.min(mn,f(a+(b-a)*i/60));sum+=mn/N;
        c.fillRect(X(a),Y(mn),X(b)-X(a),B-Y(mn));if(N<=32)c.strokeRect(X(a),Y(mn),X(b)-X(a),B-Y(mn));}
    }else{const dt=1/N,lw=Math.max(0.8,Math.min(2,(Y(0)-Y(dt))/4));
      for(let k=0;k<N;k++){const t0=k*dt,t1=t0+dt,sg=segsAbove(t1);let len=0;
        for(const p of sg){len+=p[1]-p[0];c.fillRect(X(p[0]),Y(t1),X(p[1])-X(p[0]),Y(t0)-Y(t1));}
        sum+=dt*len;if(len>0)c.fillRect(RX,Y(t1),RXv(len)-RX,Y(t0)-Y(t1));
        c.strokeStyle=K.warm;c.lineWidth=lw;c.beginPath();for(const p of sg){c.moveTo(X(p[0]),Y(t0)+lw/2);c.lineTo(X(p[1]),Y(t0)+lw/2);}c.stroke();
        if(N<=32&&len>0){c.strokeStyle=TB.rgba(K.warm,0.95);c.lineWidth=1;c.strokeRect(RX,Y(t1),RXv(len)-RX,Y(t0)-Y(t1));}}
    }
    // axes
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,top);c.lineTo(L,B);c.lineTo(XL,B);c.moveTo(RX,top);c.lineTo(RX,B);c.lineTo(R,B);
    for(const v of [0,0.5,1]){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));c.moveTo(X(v),B);c.lineTo(X(v),B+4);c.moveTo(RXv(v),B);c.lineTo(RXv(v),B+4);c.moveTo(RX-4,Y(v));c.lineTo(RX,Y(v));}c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';for(const v of [0,0.5,1])c.fillText(TB.tickLabel(v),L-7,Y(v)+s*0.35);
    c.textAlign='center';for(const v of [0,0.5,1]){c.fillText(TB.tickLabel(v),X(v),B+s+5);c.fillText(TB.tickLabel(v),RXv(v),B+s+5);}c.textAlign='start';
    TB.rich(c,[['x','i']],X(0.75),B+s+5,s,K.muted,'center');TB.rich(c,[['t','i']],L+6,top+s,s,K.muted);TB.rich(c,[['t','i']],RX-12,top+s,s,K.muted);
    // curves
    c.strokeStyle=K.ink;c.lineWidth=2.2;c.beginPath();for(let i=0;i<=400;i++){const x=i/400;i?c.lineTo(X(x),Y(f(x))):c.moveTo(X(x),Y(f(x)));}c.stroke();
    if(md==='V'){c.fillStyle=TB.rgba(K.eth,0.16);c.beginPath();c.moveTo(RX,Y(0));for(let i=0;i<=400;i++)c.lineTo(RXv(MT[i]),Y(i/400));c.lineTo(RX,Y(1));c.closePath();c.fill();}
    c.strokeStyle=K.eth;c.lineWidth=2.2;c.beginPath();for(let i=0;i<=400;i++){i?c.lineTo(RXv(MT[i]),Y(i/400)):c.moveTo(RXv(MT[i]),Y(i/400));}c.stroke();
    // readouts
    g.set(sum);
    if(md==='V')fx.innerHTML=TB.rows([['2<sup>'+n+'</sup> = '+N+' частей,','∑ <i>λ</i><sub>1</sub>(часть) · min <i>f</i> = '+TB.fmt(sum,3)+','],['∫<sub>0</sub><sup>1</sup> <i>f</i> <i>dλ</i><sub>1</sub> = '+TB.fmt(If,3)]]);
    else fx.innerHTML=TB.rows([['Δ<i>t</i> = 2<sup>−'+n+'</sup>,','∑<sub><i>k</i></sub> Δ<i>t</i> · <i>λ</i><sub>1</sub>({<i>f</i> &gt; <i>t</i><sub><i>k</i>+1</sub>}) = '+TB.fmt(sum,3)+','],['∫<sub>0</sub><sup>∞</sup> <i>λ</i><sub>1</sub>({<i>f</i> &gt; <i>t</i>}) <i>dt</i> = ∫<sub>0</sub><sup>1</sup> <i>f</i> <i>dλ</i><sub>1</sub> = '+TB.fmt(If,3)]]);
  }
  sl.addEventListener('input',draw);draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Small figures inside the exercises of §∅.18: drawn on the exercise background, they show the setting of the statement, not the answer. */
  const TB=window.TB;if(!TB||!TB.fit)return;
  const KX=()=>{const K=TB.cols();K.paper=TB.tok('--warm-soft');return K;};
  const mount=(id,h,draw)=>{const cv=document.getElementById(id);if(!cv)return null;
    const run=()=>{const F=TB.fit(cv,h),c=F.c;c.clearRect(0,0,F.W,F.H);draw(c,F.W,F.H,KX(),F.W<480,cv);};
    run();TB.onTheme(run);TB.onResize(cv,run);return run;};
  const ticks=(c,K,s,list,pos,align)=>{c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign=align;for(const v of list){const p=pos(v);c.fillText(p[2]!==undefined?p[2]:TB.tickLabel(v),p[0],p[1]);}c.textAlign='start';};
  const dot=(c,x,y,r,col,K)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.strokeStyle=K.paper;c.lineWidth=1.2;c.stroke();};
  const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
    return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));};
  const Phi=x=>0.5*(1+erf(x/Math.SQRT2));

  /* exinv: a distribution function F and the construction of F^{-1}(u) */
  (function(){
    const sl=document.getElementById('exInvU'),so=document.getElementById('exInvUOut'),fx=document.getElementById('exInvFx');if(!sl)return;
    const F=t=>0.65*Phi((t+0.6)/0.55)+0.35*Phi((t-1.6)/0.8);
    const Finv=u=>{let lo=-12,hi=12;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(F(m)<u)lo=m;else hi=m;}return (lo+hi)/2;};
    const t0=-2.6,t1=4.4;
    const run=mount('exInv',W=>W<480?260:290,(c,W,H,K,sm)=>{
      const u=+sl.value;so.textContent=TB.fmt(u,2);const ts=Finv(u);
      const s=sm?12:14,L=sm?34:40,R=W-(sm?10:16),top=s+16,B=H-(2*s+22);
      const X=t=>L+(t-t0)/(t1-t0)*(R-L),Y=v=>B-v*(B-top);
      c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,top-8);c.lineTo(L,B);c.lineTo(R,B);
      for(const v of [-2,0,2,4]){c.moveTo(X(v),B);c.lineTo(X(v),B+4);}for(const v of [0.5,1]){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));}c.stroke();
      c.strokeStyle=TB.rgba(K.muted,0.8);c.setLineDash([4,4]);c.beginPath();c.moveTo(L,Y(1));c.lineTo(R,Y(1));c.stroke();c.setLineDash([]);
      ticks(c,K,s,[-2,0,2,4],v=>[X(v),B+s+4],'center');ticks(c,K,s,[0,0.5,1],v=>[L-7,Y(v)+s*0.35],'right');
      TB.rich(c,[['t','i']],R-2,B-6,s,K.muted,'right');TB.rich(c,[['u','i']],L-7,Y(0.75)+s*0.35,s,K.muted,'right');
      c.strokeStyle=K.ink;c.lineWidth=2.2;c.beginPath();for(let i=0;i<=400;i++){const t=t0+(t1-t0)*i/400;i?c.lineTo(X(t),Y(F(t))):c.moveTo(X(t),Y(F(t)));}c.stroke();
      TB.rich(c,[['F','i']],X(3.3)+4,Y(F(3.3))+s+4,s+1,K.ink);
      c.strokeStyle=K.warm;c.lineWidth=1.8;c.setLineDash([5,4]);c.beginPath();c.moveTo(L,Y(u));c.lineTo(X(ts),Y(u));c.lineTo(X(ts),B);c.stroke();c.setLineDash([]);
      dot(c,L,Y(u),4.5,K.warm,K);dot(c,X(ts),Y(u),3.5,K.ink,K);dot(c,X(ts),B,4.5,K.eth,K);
      TB.rich(c,[['u','i']],L+7,Y(u)-7,s,K.warm);
      const lb=[['F','i'],['⁻¹','m'],['(','m'],['u','i'],[')','m']],lw=TB.richW(c,lb,s),lx=Math.max(L+lw/2,Math.min(R-lw/2,X(ts)));
      TB.rich(c,lb,lx,B+2*s+14,s,K.eth,'center');
      fx.innerHTML=TB.rows([['<i>u</i> = '+TB.fmt(u,2)+',','<i>F</i><sup>−1</sup>(<i>u</i>) = '+TB.fmt(ts,2)]]);});
    sl.addEventListener('input',run);
  })();

  /* exstrip: the sign of f(x, y) = e^{-xy} - 2e^{-2xy} on the strip x > 0, 0 < y ≤ 1 */
  (function(){
    const f=(x,y)=>Math.exp(-x*y)-2*Math.exp(-2*x*y),XM=10;let img=null,key='';
    mount('exStrip',W=>W<480?190:220,(c,W,H,K,sm)=>{
      const s=sm?12:14,L=sm?28:34,R=W-(sm?26:34);
      const top=TB.legend(c,[{k:'fill',col:K.warm,a:0.85,t:[['f','i'],[' > 0','m']]},{k:'fill',col:K.eth,a:0.85,t:[['f','i'],[' < 0','m']]}],L,R,2,s)+8;
      const B=H-(sm?22:26),X=x=>L+x/XM*(R-L),Y=y=>B-y*(B-top);
      const k=K.paper+K.eth+K.warm;
      if(!img||key!==k){key=k;const n=420;img=TB.heat(n,(i,j)=>{const v=f(XM*(i+0.5)/n,(j+0.5)/n),a=Math.pow(Math.min(1,Math.abs(v)),0.35);return TB.mixa(K.paper,v>0?K.warm:K.eth,a*0.92);});}
      c.imageSmoothingEnabled=true;c.drawImage(img,L,top,R-L,B-top);
      c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,top);c.lineTo(R,top);c.moveTo(L,top);c.lineTo(L,B);c.lineTo(R,B);
      for(const v of [0,2,4,6,8,10]){c.moveTo(X(v),B);c.lineTo(X(v),B+4);}for(const v of [0.5,1]){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));}c.stroke();
      // the strip goes on to the right: an arrow on the x-axis
      c.strokeStyle=K.muted;c.fillStyle=K.muted;c.lineWidth=1.2;c.beginPath();c.moveTo(R,B);c.lineTo(W-6,B);c.stroke();
      c.beginPath();c.moveTo(W-4,B);c.lineTo(W-10,B-4);c.lineTo(W-10,B+4);c.closePath();c.fill();
      TB.rich(c,[['x','i']],W-6,B-7,s,K.muted,'right');
      ticks(c,K,s,[0,2,4,6,8,10],v=>[X(v),B+s+4],'center');ticks(c,K,s,[0,0.5,1],v=>[L-7,Y(v)+s*0.35],'right');
      TB.rich(c,[['y','i']],L-7,Y(0.76)+s*0.35,s,K.muted,'right');});
  })();

  /* exconv: the product density of an independent pair and the half-plane x + y ≤ t */
  (function(){
    const sl=document.getElementById('exConvT'),so=document.getElementById('exConvTOut');if(!sl)return;
    const p=x=>x>0?x/0.49*Math.exp(-x/0.7):0,q=y=>Math.exp(-(y-1.5)*(y-1.5)/0.72)/(0.6*Math.sqrt(2*Math.PI));
    const x0=-0.5,x1=4.5,y0=-0.5,y1=3.5;let img=null,key='',pm=0,qm=0;
    for(let i=0;i<=500;i++){pm=Math.max(pm,p(x0+(x1-x0)*i/500));qm=Math.max(qm,q(y0+(y1-y0)*i/500));}
    const run=mount('exConv',W=>W<480?300:330,(c,W,H,K,sm)=>{
      const t=+sl.value;so.textContent=TB.fmt(t,2);

  /* expolar: the half-strip of (r, θ), its image under the polar map, and a small rectangle with its image */
  (function(){
    const sr=document.getElementById('exPolR'),st=document.getElementById('exPolT'),sro=document.getElementById('exPolROut'),sto=document.getElementById('exPolTOut'),fx=document.getElementById('exPolFx');if(!sr)return;

      c.strokeStyle=TB.rgba(K.muted,0.55);c.beginPath();for(let k2=1;k2<8;k2++){c.moveTo(XA,ay(k2*Math.PI/4));c.lineTo(XA+P,ay(k2*Math.PI/4));}c.stroke();
      c.strokeStyle=K.ink;c.lineWidth=1.4;c.beginPath();for(const v of [1,2]){c.moveTo(ax(v),B);c.lineTo(ax(v),B-P);}c.stroke();
      c.strokeStyle=K.warm;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.moveTo(XA,B);c.lineTo(XA+P,B);c.moveTo(XA,B-P);c.lineTo(XA+P,B-P);c.stroke();c.setLineDash([]);
      // right panel: circles and rays

      const ia=0.5*((r+dr)*(r+dr)-r*r)*dt;
      fx.innerHTML=TB.rows([['<i>r</i> = '+TB.fmt(r,2)+',','<i>θ</i> = '+TB.fmt(th,2)],['<i>Φ</i>(<i>r</i>, <i>θ</i>) = ('+TB.fmt(r*Math.cos(th),2)+'; '+TB.fmt(r*Math.sin(th),2)+')'],
        ['площадь прямоугольника '+TB.fmt(dr*dt,2)+',','площадь образа '+TB.fmt(ia,3)]]);});
    if(!run)return;

      if(px>=geo.XA-6&&px<=geo.XA+P+6&&py>=geo.B-P-6&&py<=geo.B+6){r=(px-geo.XA)/P*RM;th=(geo.B-py)/P*TP;}
      else if(px>=geo.XB-6&&px<=geo.XB+P+6&&py>=geo.B-P-6&&py<=geo.B+6){const x=(px-geo.XB)/P*2*RM-RM,y=(geo.B-py)/P*2*RM-RM;r=Math.hypot(x,y);th=Math.atan2(y,x);if(th<0)th+=TP;}

  /* excond: a joint density p(u, v), the level v, and the density of Q(v, ·) */
  (function(){
    const sl=document.getElementById('exCondV'),so=document.getElementById('exCondVOut'),fx=document.getElementById('exCondFx');if(!sl)return;
    const w=v=>v>0&&v<1.2?v*(1.2-v)*(1.2-v)/0.1728:0,m=v=>-0.3+1.4*v+0.25*Math.sin(4*v),sd=v=>0.18+0.25*v;
    const nd=(u,v)=>Math.exp(-(u-m(v))*(u-m(v))/(2*sd(v)*sd(v)))/(sd(v)*Math.sqrt(2*Math.PI)),p=(u,v)=>w(v)>0?w(v)*nd(u,v):0;
    const u0=-1,u1=2.5,v0=-0.2,v1=1.5,QM=2.4;let img=null,key='',pm=0;
    for(let i=0;i<=200;i++)for(let j=0;j<=200;j++)pm=Math.max(pm,p(u0+(u1-u0)*i/200,v0+(v1-v0)*j/200));
    const run=mount('exCond',W=>W<480?330:370,(c,W,H,K,sm)=>{
      const v=+sl.value;so.textContent=TB.fmt(v,2);const py=w(v);
      const s=sm?12:14,L=sm?32:40,R=W-(sm?10:16),T1=8,gp=sm?40:44,B1=T1+(H-T1-gp-(sm?22:26))*0.6,T2=B1+gp,B2=H-(sm?22:26);
      const X=u=>L+(u-u0)/(u1-u0)*(R-L),Y1=y=>B1-(y-v0)/(v1-v0)*(B1-T1),Y2=q=>B2-q/QM*(B2-T2);
      const k=K.paper+K.eth;
      if(!img||key!==k){key=k;const n=220;img=TB.heat(n,(i,j)=>TB.mixa(K.paper,K.eth,Math.pow(p(u0+(u1-u0)*(i+0.5)/n,v0+(v1-v0)*(j+0.5)/n)/pm,0.8)*0.9));}
      c.imageSmoothingEnabled=true;c.drawImage(img,L,T1,R-L,B1-T1);
      c.strokeStyle=K.rule;c.lineWidth=1;c.strokeRect(L,T1,R-L,B1-T1);
      c.strokeStyle=TB.rgba(K.muted,0.8);c.setLineDash([4,4]);c.beginPath();for(const b of [0,1.2]){c.moveTo(L,Y1(b));c.lineTo(R,Y1(b));}c.stroke();c.setLineDash([]);
      c.strokeStyle=K.warm;c.lineWidth=2.2;c.beginPath();c.moveTo(L,Y1(v));c.lineTo(R,Y1(v));c.stroke();dot(c,R,Y1(v),4.5,K.warm,K);
      c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();for(const t of [-1,0,1,2]){c.moveTo(X(t),B1);c.lineTo(X(t),B1+4);c.moveTo(X(t),B2);c.lineTo(X(t),B2+4);}
      for(const t of [0,0.5,1]){c.moveTo(L-4,Y1(t));c.lineTo(L,Y1(t));}for(const t of [1,2]){c.moveTo(L-4,Y2(t));c.lineTo(L,Y2(t));}

      ticks(c,K,s,[-1,0,1,2],t=>[X(t),B1+s+4],'center');ticks(c,K,s,[-1,0,1,2],t=>[X(t),B2+s+4],'center');
      ticks(c,K,s,[0,0.5,1],t=>[L-7,Y1(t)+s*0.35],'right');ticks(c,K,s,[0,1,2],t=>[L-7,Y2(t)+s*0.35],'right');

      const ql=[['Q','i'],['(','m'],['v','i'],[', ·)','m']];
      if(py>0){c.fillStyle=TB.rgba(K.warm,0.3);c.beginPath();c.moveTo(X(u0),B2);for(let i=0;i<=300;i++){const u=u0+(u1-u0)*i/300;c.lineTo(X(u),Y2(Math.min(QM,nd(u,v))));}c.lineTo(X(u1),B2);c.closePath();c.fill();
        c.strokeStyle=K.warm;c.lineWidth=2;c.beginPath();for(let i=0;i<=300;i++){const u=u0+(u1-u0)*i/300;i?c.lineTo(X(u),Y2(nd(u,v))):c.moveTo(X(u),Y2(nd(u,v)));}c.stroke();
        TB.rich(c,[['плотность ','r']].concat(ql),R-4,T2+s,s,K.warm,'right');
        fx.innerHTML=TB.rows([['<i>v</i> = '+TB.fmt(v,2)+',','<i>p</i><sub><i>y</i></sub>(<i>v</i>) = '+TB.fmt(py,3)]]);}
      else{const x=X(0);c.strokeStyle=K.warm;c.fillStyle=K.warm;c.lineWidth=2.2;c.beginPath();c.moveTo(x,B2);c.lineTo(x,T2+8);c.stroke();
        c.beginPath();c.moveTo(x,T2+2);c.lineTo(x-5,T2+11);c.lineTo(x+5,T2+11);c.closePath();c.fill();
        TB.rich(c,ql.concat([[' = ','m'],['δ','i'],['0','s']]),x+10,T2+s+4,s,K.warm);
        fx.innerHTML=TB.rows([['<i>v</i> = '+TB.fmt(v,2)+',','<i>p</i><sub><i>y</i></sub>(<i>v</i>) = 0']]);}});
    sl.addEventListener('input',run);
  })();
})();

<script>
(function(){
  /* Figure #dhist (§∅.14): observations fall into a strip, a histogram with bar height (share in the bin)/h grows under it, and its outline approaches the density. */
  const cv=document.getElementById('dhist');if(!cv||!window.TB||!TB.fit)return;
  const sl=document.getElementById('dhH'),so=document.getElementById('dhHOut'),fx=document.getElementById('dhFx'),b0=document.getElementById('dh0');
  const g1=new TB.Gauge('gDh1'),g2=new TB.Gauge('gDh2');
  const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
  const erf=x=>{const t=1/(1+0.3275911*Math.abs(x)),y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x<0?-y:y;};
  const Phi=z=>0.5*(1+erf(z/Math.SQRT2)),nd=(x,m,s)=>Math.exp(-(x-m)*(x-m)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
  const U=()=>1-Math.random(),gau=()=>Math.sqrt(-2*Math.log(U()))*Math.cos(2*Math.PI*Math.random());
  const LAW={
    G:{p:x=>x<0?0:x*x*Math.exp(-1.25*x)/1.024,F:x=>{if(x<=0)return 0;const u=1.25*x;return 1-Math.exp(-u)*(1+u+u*u/2);},draw:()=>-0.8*Math.log(U()*U()*U()),ym:0.5},
    E:{p:x=>x<0?0:0.7*Math.exp(-0.7*x),F:x=>x<=0?0:1-Math.exp(-0.7*x),draw:()=>-Math.log(U())/0.7,ym:0.9},
    M:{p:x=>0.4*nd(x,1.6,0.5)+0.6*nd(x,4.6,0.9),F:x=>0.4*Phi((x-1.6)/0.5)+0.6*Phi((x-4.6)/0.9),draw:()=>Math.random()<0.4?1.6+0.5*gau():4.6+0.9*gau(),ym:0.5}};
  /* Counts live in cells of width 0.05 on [0, 10): every bin [kh, (k+1)h) with h a multiple of 0.05 is a union of cells, and so is [a, b). */
  const XM=8,CW=0.05,NC=200,RING=2000,FALL=420,GLOW=900,CAP=100000;
  let cells,n,ring,ri,fly,pend,rate,acc,last=0,raf=0,a=1.5,b=3.5,geo=null;
  function reset(){cells=new Uint32Array(NC);n=0;ring=[];ri=0;fly=[];pend=0;rate=0;acc=0;}
  reset();
  let md=TB.segs(cv,k=>{md=k;reset();if(raf){cancelAnimationFrame(raf);raf=0;}draw();start(100);});
  function land(v,t){if(v>=0&&v<NC*CW)cells[Math.min(NC-1,Math.floor(v/CW))]++;n++;
    const it={x:v,j:Math.random(),t:t};if(ring.length<RING)ring.push(it);else{ring[ri]=it;ri=(ri+1)%RING;}}
  function start(k){k=Math.min(k,CAP-n-pend-fly.length);if(k<=0)return;b0.hidden=false;
    if(reduced()){for(let i=0;i<k;i++)land(LAW[md].draw(),-1e9);draw();return;}
    pend+=k;const T=k===1?1:k===10?700:k===100?1700:2800;rate=Math.max(rate,pend/T);
    if(!raf){last=performance.now();acc=1;raf=requestAnimationFrame(tick);}}
  function tick(t){raf=0;const dt=Math.min(64,Math.max(0,t-last));last=t;
    if(pend>0){acc+=rate*dt;const m=Math.min(pend,Math.max(1,Math.floor(acc)));if(acc>=1){acc-=m;pend-=m;
      for(let i=0;i<m;i++)fly.push({x:LAW[md].draw(),j:Math.random(),t:t-Math.random()*dt});}if(!pend)rate=0;}
    const keep=[];for(const f of fly){if(t-f.t>=FALL){if(f.x>=0&&f.x<NC*CW)cells[Math.min(NC-1,Math.floor(f.x/CW))]++;n++;
      if(ring.length<RING)ring.push(f);else{ring[ri]=f;ri=(ri+1)%RING;}}else keep.push(f);}fly=keep;
    draw(t);
    let glow=false;for(const it of ring)if(t-it.t<FALL+GLOW){glow=true;break;}
    if(pend>0||fly.length||glow)raf=requestAnimationFrame(tick);}
  function draw(t){
    t=t||performance.now();const LW=LAW[md],h=+sl.value;so.textContent=TB.fmt(h,2);
    const F=TB.fit(cv,W=>W<520?Math.max(340,Math.round(W*1.0)):Math.max(370,Math.min(470,Math.round(W*0.6)))),c=F.c,W=F.W,H=F.H,K=TB.cols();

    const tk=[[-1,[['x','i'],[' − ','r'],['h','i']]],[0,[['x','i']]],[1,[['x','i'],[' + ','r'],['h','i']]]];
    for(const [k,lb_] of tk)TB.rich(c,lb_,XL(x+k*h),LP.b+s+5,s,K.muted,'center');
    TB.rich(c,[['лупа: [','r'],['x','i'],[' − 2','r'],['h','i'],[', ','r'],['x','i'],[' + 2','r'],['h','i'],[']','r']],LP.l+2,LP.t+s,s-1,K.muted);
    const over=(r,u0,u1,col)=>{if(r<=ym)return;const tx='↑ '+TB.fmt(r,1),xm=XL((u0+u1)/2),y=LT+2*s+16;c.font=(s-1)+'px '+TB.ui;const tw=c.measureText(tx).width;
      c.fillStyle=K.paper;c.globalAlpha=0.85;c.fillRect(xm-tw/2-3,y-s,tw+6,s+5);c.globalAlpha=1;TB.rich(c,[[tx,'r']],xm,y,s-1,col,'center');};
    over(rL,x-h,x,K.eth);over(rR,x,x+h,K.warm);
    if(md==='T'&&A>la&&A<lb)TB.rich(c,[['0,3','r']],Math.min(XL(A)+7,LP.r-26),LT+s+6,s,K.warm);
    // gauges and numbers
    gR.set(rR);gL.set(rL);
    for(const [g,l] of [[gR,lR],[gL,lL]]){if(isFinite(l)){g.mark('l',l,'предел');g.m.l.style.display='';}else if(g.m.l)g.m.l.style.display='none';}
    const xs='<i>x</i>',hs='<i>h</i>',P=(u,v)=>'<i>P</i>(<i>ξ</i> ∈ ['+u+', '+v+']) / '+hs;
    const rows=[[xs+' = '+TB.fmt(x,2)+',',hs+' = '+TB.fmt(h,h<0.01?4:3)],[P(xs,xs+' + '+hs)+' = '+TB.fmt(rR,3)+',',P(xs+' − '+hs,xs)+' = '+TB.fmt(rL,3)]];
    if(atom)rows.push(['оба отрезка содержат атом:','отношения ≥ 0,3 / '+hs+' = '+TB.fmt(0.3/h,1)]);
    else if(Math.abs(lL-lR)<1e-12)rows.push(['предел при '+hs+' → 0: '+TB.fmt(lR,3)]);
    else rows.push(['пределы при '+hs+' → 0:','слева '+TB.fmt(lL,3)+',','справа '+TB.fmt(lR,3)]);
    fx.innerHTML=TB.rows(rows);
  }
  [sx,sh].forEach(e=>e.addEventListener('input',draw));
  // dragging over the left panels moves x; it sticks to the jump 2 and to the atom 2.5
  cv.style.touchAction='pan-y';let drag=false;
  function pick(e){if(!geo)return false;const b=cv.getBoundingClientRect(),px=e.clientX-b.left,py=e.clientY-b.top;
    if(px<geo.l-8||px>geo.r+8||py<geo.t-6||py>geo.b)return false;
    let v=xa+(px-geo.l)/(geo.r-geo.l)*(xb-xa);for(const q of [2,2.5])if(Math.abs(v-q)<0.035)v=q;
    sx.value=Math.max(+sx.min,Math.min(+sx.max,v)).toFixed(2);draw();return true;}
  cv.addEventListener('pointerdown',e=>{if(pick(e)){drag=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
  cv.addEventListener('pointermove',e=>{if(drag)pick(e);});
  ['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{drag=false;}));
  draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Figure #pushd (§∅.13): the image of a measure on the four outcomes of two coin tosses. Copies of the tiles fly along the arrows of T and pile up on the line; B=[a,b] picks out the preimage. */
  const cv=document.getElementById('pushd');if(!cv||!window.TB||!TB.fit)return;
  const fx=document.getElementById('pdFx'),b0=document.getElementById('pd0'),g=new TB.Gauge('gPd');
  const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
  const NM=['ГГ','ГР','РГ','РР'],HEADS=[2,1,1,0],V0=-1,V1=3,LO=V0-0.5,HI=V1+0.5,FR=['0','¼','½','¾','1'];
  let T=HEADS.slice(),a=0.5,b=2.5,geo=null,drag=null,raf=0,started=false;
  /* A copy moves from one place to another; a place is the tile on the left ('L'), a slot j in the pile at the value v ('S') or a point ('P'). */
  const cp=NM.map((_,i)=>({from:{k:'L',i:i},to:{k:'L',i:i},t0:0,dur:0}));
  const ease=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
  function slots(){const r=[],n={};for(let i=0;i<4;i++){const v=T[i];n[v]=(n[v]||0);r.push({k:'S',v:v,j:n[v]});n[v]++;}return r;}
  function place(d){const G=geo;if(d.k==='L')return {x:G.BX+G.bw/2,y:G.ly[d.i]};if(d.k==='S')return {x:G.AX+(d.j+0.5)*G.bw,y:G.Y(d.v)};return {x:d.x,y:d.y};}
  function at(i,t){const q=cp[i],u=q.dur?ease((t-q.t0)/q.dur):1,A=place(q.from),B=place(q.to);
    if(u>=1)return B;if(u<=0)return A;
    if(q.from.k==='L'){const G=geo,d=G.AX-G.BX-G.bw,P1={x:A.x+G.bw/2+d*0.55,y:A.y},P2={x:G.AX-d*0.25,y:B.y},w=1-u;
      return {x:w*w*w*A.x+3*w*w*u*P1.x+3*w*u*u*P2.x+u*u*u*B.x,y:w*w*w*A.y+3*w*w*u*P1.y+3*w*u*u*P2.y+u*u*u*B.y};}
    return {x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u};}
  const moving=t=>cp.some(q=>q.dur&&t<q.t0+q.dur);
  function relayout(){const t=performance.now(),S=slots();
    cp.forEach((q,i)=>{const n=S[i];if(q.to.k==='S'&&q.to.v===n.v&&q.to.j===n.j)return;
      if(!started){q.to=n;return;}
      const p=geo?at(i,t):null;q.from=p?{k:'P',x:p.x,y:p.y}:q.to;q.to=n;q.t0=t;q.dur=reduced()?0:420;});
    loop();}
  function start(){if(started)return;started=true;const t=performance.now(),S=slots();
    cp.forEach((q,i)=>{q.from={k:'L',i:i};q.to=S[i];q.t0=t+i*280;q.dur=reduced()?0:950;});loop();}
  function loop(){if(!raf)raf=requestAnimationFrame(tick);}
  function tick(t){raf=0;draw(t);if(moving(t))raf=requestAnimationFrame(tick);}
  function draw(t){
    t=t||performance.now();
    const F=TB.fit(cv,W=>W<520?300:330),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,R=W-(sm?6:16),BX=sm?4:16;
    const MW=Math.min(sm?180:300,(R-30-BX-70)/1.25),bw=MW/4,AX=R-30-MW;
    const Yt=s+22,Yb=H-10,Y=v=>Yb-(v-LO)/(HI-LO)*(Yb-Yt),Yi=y=>LO+(Yb-y)/(Yb-Yt)*(HI-LO),bh=Math.min(34,(Yb-Yt)/(HI-LO)*0.62);
    const ly=[0,1,2,3].map(i=>Yt+(i+0.5)*(Yb-Yt)/4);
    geo={BX:BX,bw:bw,bh:bh,AX:AX,R:R,Y:Y,Yi:Yi,ly:ly,Yt:Yt,Yb:Yb};
    const inB=v=>v>=a&&v<=b,pre=[0,1,2,3].filter(i=>inB(T[i]));
    // titles
    TB.rich(c,[['X','i'],[sm?', ':', мера ','r'],['μ','i'],[' (по ¼)','r']],BX,s+4,s,K.muted);
    TB.rich(c,[['T','i']],(BX+bw+AX)/2,s+4,s,K.muted,'center');
    TB.rich(c,[['ℝ','m'],[', мера ','r'],['T','i'],['*','s'],['μ','i']],AX-6,s+4,s,K.muted);
    // the set B: a band over the right part and a thick piece of the axis
    c.fillStyle=TB.rgba(K.warm,0.11);c.fillRect(AX,Y(b),R-AX,Y(a)-Y(b));
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(AX+0.5,Yt-4);c.lineTo(AX+0.5,Yb);c.stroke();
    c.strokeStyle=K.warm;c.lineWidth=4;c.beginPath();c.moveTo(AX+0.5,Y(a));c.lineTo(AX+0.5,Y(b));c.stroke();
    for(const v of [a,b]){c.fillStyle=K.warm;c.beginPath();c.arc(AX+0.5,Y(v),5,0,7);c.fill();}
    // integer points of the line
    c.font=s+'px '+TB.ui;c.textAlign='right';
    for(let v=V0;v<=V1;v++){c.fillStyle=K.ink;c.beginPath();c.arc(AX+0.5,Y(v),2.6,0,7);c.fill();
      c.fillStyle=K.muted;c.fillText(TB.fmt(v,0),AX-8,Y(v)-7);}
    c.textAlign='start';
    // arrows of T
    for(let i=0;i<4;i++){const x0=BX+bw+3,y0=ly[i],x1=AX-3,y1=Y(T[i]),d=x1-x0,hot=inB(T[i]);
      c.strokeStyle=hot?TB.rgba(K.warm,0.9):TB.rgba(K.muted,0.55);c.lineWidth=hot?1.8:1.3;
      c.beginPath();c.moveTo(x0,y0);c.bezierCurveTo(x0+d*0.55,y0,x1-d*0.25,y1,x1,y1);c.stroke();
      c.fillStyle=c.strokeStyle;c.beginPath();c.moveTo(x1+1,y1);c.lineTo(x1-8,y1-4);c.lineTo(x1-8,y1+4);c.closePath();c.fill();}
    // tiles: the measure μ on X
    const tile=(x,y,i,hot,al)=>{c.fillStyle=hot?TB.rgba(K.warm,0.55*al):TB.rgba(K.eth,0.32*al);c.fillRect(x-bw/2+1,y-bh/2,bw-2,bh);
      c.strokeStyle=hot?TB.rgba(K.warm,al):TB.rgba(K.eth,0.85*al);c.lineWidth=1.2;c.strokeRect(x-bw/2+1.5,y-bh/2+0.5,bw-3,bh-1);
      c.fillStyle=TB.rgba(K.ink,al);c.font=s+'px '+TB.ui;c.textAlign='center';c.fillText(NM[i],x,y+s*0.36);c.textAlign='start';};
    for(let i=0;i<4;i++)tile(BX+bw/2,ly[i],i,inB(T[i]),drag&&drag.k==='t'&&drag.i===i?0.75:1);
    // the copies: the image measure T_*μ on the line
    if(started)for(let i=0;i<4;i++){const q=cp[i];if(q.dur&&t<q.t0)continue;const p=at(i,t);tile(p.x,p.y,i,inB(T[i]),1);}
    // masses of the piles once they have settled
    if(started){c.font=(s+2)+'px '+TB.serif;c.fillStyle=K.ink;
      for(let v=V0;v<=V1;v++){const n=T.filter(x=>x===v).length;if(!n)continue;
        if(cp.some((q,i)=>(T[i]===v||(q.from.k==='S'&&q.from.v===v))&&q.dur&&t<q.t0+q.dur))continue;
        c.fillText(FR[n],AX+n*bw+6,Y(v)+s*0.38);}}
    // readout
    const fr=n=>n===0?'0':n===4?'1':n===2?TB.fr('1','2'):TB.fr(n,'4'),q4=TB.fr('1','4');
    const Tm='<i>T</i><sup>−1</sup>(<i>B</i>)',Ts='<i>T</i><sub>*</sub><i>μ</i>(<i>B</i>)';
    const sum=pre.length?(pre.length>1?pre.map(()=>q4).join(' + ')+' = ':'')+fr(pre.length):'<i>μ</i>(∅) = 0';
    fx.innerHTML=TB.rows([['<i>B</i> = ['+TB.fmt(a,2)+'; '+TB.fmt(b,2)+'],',Tm+' = '+(pre.length?'{'+pre.map(i=>NM[i]).join(', ')+'}':'∅')],
      [Ts+' = <i>μ</i>('+Tm+') = '+sum]]);
    g.set(pre.length/4,K.warm);
  }
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  function hitTile(p){if(!geo)return -1;const G=geo;for(let i=0;i<4;i++)if(p.x>=G.BX-6&&p.x<=G.BX+G.bw+6&&Math.abs(p.y-G.ly[i])<=G.bh/2+6)return i;return -1;}
  function setEnd(y){const v=Math.max(LO,Math.min(HI,geo.Yi(y)));if(drag.e==='a')a=v;else b=v;if(a>b){const u=a;a=b;b=u;drag.e=drag.e==='a'?'b':'a';}}
  cv.addEventListener('pointerdown',e=>{if(!geo)return;const p=pt(e),i=hitTile(p);
    if(i>=0)drag={k:'t',i:i};else if(p.x>=geo.AX-40){const v=geo.Yi(p.y);drag={k:'b',e:Math.abs(v-a)<=Math.abs(v-b)?'a':'b'};setEnd(p.y);}else return;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();move(p);});
  function move(p){if(!drag)return;
    if(drag.k==='t'){const v=Math.max(V0,Math.min(V1,Math.round(geo.Yi(p.y))));if(!started)start();if(v!==T[drag.i]){T[drag.i]=v;relayout();}}
    else setEnd(p.y);
    draw();}
  cv.addEventListener('pointermove',e=>{const p=pt(e);if(drag){move(p);return;}
    cv.style.cursor=geo&&(hitTile(p)>=0||p.x>=geo.AX-40)?'ns-resize':'';});
  ['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>{if(drag){drag=null;draw();}}));
  b0.addEventListener('click',()=>{T=HEADS.slice();a=0.5;b=2.5;if(started)relayout();draw();});
  draw();TB.onTheme(()=>draw());TB.onResize(cv,()=>draw());
  if(reduced()||!window.IntersectionObserver)start();
  else{const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){io.disconnect();setTimeout(start,250);}},{threshold:0.45});io.observe(cv);}
})();
</script>
