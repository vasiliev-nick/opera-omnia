<script>
(function(){
  /* §∅.10, canvas rvp: random variables on three outcomes, seen along the line of constants. The disc is the plane of zero mean with the true lengths and angles of L²(P);

  const PI=Math.PI,RS=1.6,RIN=RS*0.97,RMIN=0.12,MM=3,PMIN=0.05,SNAP=2.5*PI/180;

  let XB=[1,2,3],YB=[3,2,1],p=[1/3,1/3,1/3];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const E=v=>dot(p,v),mul=(a,b)=>a.map((v,i)=>v*b[i]);

  const fromZ=(z,f)=>[0,1,2].map(i=>(z[0]*f.F0[i]+z[1]*f.F1[i])/f.q[i]);
  /* The shown variable: the stored values; if a change of probabilities pushed the deviation out of the disc or the mean off its scale, they are brought back to the edge. */

    return {m:mc,d:d.map(v=>v*l),v:d.map(v=>mc+v*l)};}
  /* layout: the disc, the two scales of means and the triangle of probabilities; side by side on a wide column, the scales and the triangle under the disc on a narrow one */
  function lay(W){const sm=W<520,yb=26;let o;
    if(!sm){const hm=Math.round(Math.min(W*0.56,430)),Wp=Math.round(W*0.58),x0=Wp+4,tl=x0+84,tr=W-6,side=Math.min(tr-tl-44,190),h=side*Math.sqrt(3)/2,tx=(tl+tr)/2,cy=yb+hm/2,ty=cy-h/2+10;
      o={H:yb+hm+6,cx:Wp/2,cy:cy,R:Math.min(Wp,hm)/2-34,sc:{xa:x0+16,xn:x0+34,xb:x0+52,top:yb+50,bot:yb+hm-24},A:[tx,ty],B:[tx-side/2,ty+h],C:[tx+side/2,ty+h]};}
    else{const R=W/2-40,cy=yb+R+36,rt=cy+R+16,side=Math.min(W*0.58-40,160),h=side*Math.sqrt(3)/2,rh=Math.round(h+84),tx=W*0.31,ty=rt+52,xc=W*0.81;
      o={H:rt+rh,cx:W/2,cy:cy,R:R,sc:{xa:xc-18,xn:xc,xb:xc+18,top:rt+52,bot:rt+rh-14},A:[tx,ty],B:[tx-side/2,ty+h],C:[tx+side/2,ty+h]};}
    o.sm=sm;o.k=o.R/RS;return o;}
  let G=null,drag=null,tap=null;
  const bary=(x,y)=>{const A=G.A,B=G.B,C=G.C,d=(B[1]-C[1])*(A[0]-C[0])+(C[0]-B[0])*(A[1]-C[1]),
    a=((B[1]-C[1])*(x-C[0])+(C[0]-B[0])*(y-C[1]))/d,b=((C[1]-A[1])*(x-C[0])+(A[0]-C[0])*(y-C[1]))/d;return [a,b,1-a-b];};
  const atB=b=>[b[0]*G.A[0]+b[1]*G.B[0]+b[2]*G.C[0],b[0]*G.A[1]+b[1]*G.B[1]+b[2]*G.C[1]];
  const segNear=(P,U,V)=>{const dx=V[0]-U[0],dy=V[1]-U[1],t=Math.max(0,Math.min(1,((P[0]-U[0])*dx+(P[1]-U[1])*dy)/(dx*dx+dy*dy)));return [U[0]+t*dx,U[1]+t*dy];};
  function triDist(x,y){const b=bary(x,y);if(Math.min(b[0],b[1],b[2])>=0)return 0;
    return Math.min(...[[G.A,G.B],[G.B,G.C],[G.C,G.A]].map(s=>{const q=segNear([x,y],s[0],s[1]);return Math.hypot(q[0]-x,q[1]-y);}));}
  /* a point of the triangle gives the probabilities: its barycentric coordinates, kept inside {P(ω) ≥ PMIN}, rounded to hundredths; near the centre they snap to 1/3 */
  function setP(x,y){const ctr=atB([1/3,1/3,1/3]);if(Math.hypot(x-ctr[0],y-ctr[1])<9){p=[1/3,1/3,1/3];return;}

      for(const s of [[I[0],I[1]],[I[1],I[2]],[I[2],I[0]]]){const q=segNear([x,y],s[0],s[1]),dd=Math.hypot(q[0]-x,q[1]-y);if(dd<bd){bd=dd;best=q;}}
      b=bary(best[0],best[1]);}

    const ord=[0,1,2].sort((i,j)=>(c[j]-fl[j])-(c[i]-fl[i]));for(let t=0;r>0&&t<3;t++,r--)fl[ord[t]]++;

  /* a tip pulled to the model point z: the length stays in [RMIN, RIN], and the angle ψ snaps to 0°, 90°, 180° when it is close */
  function setTip(i,z){const fr=frame(),S=[shown(XB),shown(YB)],o=toZ(S[1-i].d,fr);let r=Math.hypot(z[0],z[1]);

    th=to+dl;const d=fromZ([r*Math.cos(th),r*Math.sin(th)],fr),v=d.map(u=>S[i].m+u);if(i)YB=v;else XB=v;}
  function setMean(i,y){const s=G.sc;let m=MM-(y-s.top)/(s.bot-s.top)*2*MM;m=Math.max(-MM,Math.min(MM,Math.round(m*20)/20));
    const S=shown(i?YB:XB),v=S.d.map(u=>m+u);if(i)YB=v;else XB=v;}
  const f2=v=>TB.fmt(v,2),f3=v=>TB.fmt(v,3),tr=v=>'('+v.map(f2).join('; ')+')';
  function draw(){

    c.clearRect(0,0,W,H);

    const fr=frame(),SX=shown(XB),SY=shown(YB),zX=toZ(SX.d,fr),zY=toZ(SY.d,fr),k=L.k,cx=L.cx,cy=L.cy,R=L.R;

    const arrow=(x0,y0,x1,y1,cl,lw,hs)=>{const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);if(l<1)return;const ux=dx/l,uy=dy/l,h=Math.min(hs,l*0.6);
      c.strokeStyle=cl;c.lineWidth=lw;c.lineCap='round';c.setLineDash([]);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1-ux*h*0.7,y1-uy*h*0.7);c.stroke();
      c.fillStyle=cl;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-ux*h-uy*h*0.42,y1-uy*h+ux*h*0.42);c.lineTo(x1-ux*h+uy*h*0.42,y1-uy*h-ux*h*0.42);c.closePath();c.fill();c.lineCap='butt';};

    for(const A of ax){const n=[-A.a[1],A.a[0]];for(let j=-Math.floor(RS/A.h);j*A.h<RS;j++){const o=j*A.h,hw=Math.sqrt(Math.max(0,RS*RS-o*o));
      const U=P([o*A.a[0]+hw*n[0],o*A.a[1]+hw*n[1]]),V=P([o*A.a[0]-hw*n[0],o*A.a[1]-hw*n[1]]);c.moveTo(U[0],U[1]);c.lineTo(V[0],V[1]);}}
    c.stroke();c.restore();
    /* the angle ψ between the deviations, and where the labels near the centre go: ψ, the names of the arrows, «постоянные»; the numbers on the axes keep clear of them */
    const sX=[zX[0],-zX[1]],sY=[zY[0],-zY[1]],lX=Math.hypot(sX[0],sX[1]),lY=Math.hypot(sY[0],sY[1]);
    const tX=Math.atan2(sX[1],sX[0]);let dl=Math.atan2(sY[1],sY[0])-tX;while(dl>PI)dl-=2*PI;while(dl<=-PI)dl+=2*PI;
    const psi=Math.abs(dl),rA=Math.max(14,Math.min(30,0.45*Math.min(lX,lY)*k)),dirs=[sX,sY,...ax.map(A=>[A.a[0],-A.a[1]])];
    const cosPsi=(zX[0]*zY[0]+zX[1]*zY[1])/(Math.hypot(zX[0],zX[1])*Math.hypot(zY[0],zY[1])),right=Math.abs(cosPsi)<1e-9;
    const TX=P(zX),TY=P(zY),keep=[[TX[0],TX[1],15],[TY[0],TY[1],15]];let psiL=null;
    if(psi>0.06){const mid=tX+dl/2,mu=[Math.cos(mid),Math.sin(mid)],rr=right?31:rA+11;dirs.push(mu);psiL=[cx+mu[0]*rr,cy+mu[1]*rr];keep.push([psiL[0],psiL[1],12]);}
    const nameAt=(T,s,o)=>{const l=Math.hypot(s[0],s[1])||1,u=[s[0]/l,s[1]/l];let n=[-u[1],u[0]];if(n[0]*o[0]+n[1]*o[1]>0)n=[-n[0],-n[1]];return [T[0]+u[0]*17+n[0]*7,T[1]+u[1]*17+n[1]*7];};
    const nX=nameAt(TX,sX,sY),nY=nameAt(TY,sY,sX);keep.push([nX[0],nX[1],11],[nY[0],nY[1],11]);
    c.font=(fs-1)+'px '+TB.ui;const cw=c.measureText('постоянные').width,ch=fs-1;let best=null,bs=-1;
    for(let j=0;j<12;j++){const t=j*PI/6,u=[Math.cos(t),Math.sin(t)];let sc=PI;for(const d of dirs){const l=Math.hypot(d[0],d[1]);if(l<1e-9)continue;sc=Math.min(sc,Math.acos(Math.max(-1,Math.min(1,(u[0]*d[0]+u[1]*d[1])/l))));}
      if(sc>bs+1e-6){bs=sc;best=u;}}
    const dd=14+Math.abs(best[0])*cw/2+Math.abs(best[1])*ch/2,lc=[cx+best[0]*dd,cy+best[1]*dd];
    const clear=(x,y)=>keep.every(q=>Math.hypot(x-q[0],y-q[1])>q[2]+5)&&!(Math.abs(x-lc[0])<cw/2+7&&Math.abs(y-lc[1])<ch/2+7);
    /* the axes with marks at the integer deviations; the label of an axis that would leave the canvas goes beside its arrowhead */
    ax.forEach((A,i)=>{const u=[A.a[0],-A.a[1]],e=[cx+u[0]*(R+9),cy+u[1]*(R+9)];arrow(cx,cy,e[0],e[1],TB.rgba(col.ink,0.5),1.1,8);
      c.strokeStyle=TB.rgba(col.ink,0.5);c.lineWidth=1;c.beginPath();const sp=A.h*k,nt=[-u[1],u[0]];
      for(let j=1;j*A.h<RS-0.04;j++){const t=[cx+u[0]*j*sp,cy+u[1]*j*sp];c.moveTo(t[0]-nt[0]*4,t[1]-nt[1]*4);c.lineTo(t[0]+nt[0]*4,t[1]+nt[1]*4);}c.stroke();
      if(sp>=16){c.font=(fs-3)+'px '+TB.ui;c.fillStyle=col.muted;c.textAlign='center';
        for(let j=1;j*A.h<RS-0.04;j++){const t=[cx+u[0]*j*sp+nt[0]*10,cy+u[1]*j*sp+nt[1]*10];if(clear(t[0],t[1]))c.fillText(String(j),t[0],t[1]+(fs-3)*0.35);}c.textAlign='start';}
      const segs=[['ω','i'],[' = '+(i+1),'m']],w=TB.richW(c,segs,fs),lp=[cx+u[0]*(R+18)+u[0]*w/2,cy+u[1]*(R+18)+u[1]*fs*0.5+fs*0.35];
      const xl=Math.max(w/2+3,Math.min((sm?W:L.sc.xa-22)-w/2-3,lp[0])),yl=Math.abs(xl-lp[0])>2?e[1]+(u[1]>=0?fs+7:-8):lp[1];
      rl(segs,xl,yl,fs,col.muted,'center');});

      if(right){const a=[sX[0]/lX*14,sX[1]/lX*14],b=[sY[0]/lY*14,sY[1]/lY*14];c.moveTo(cx+a[0],cy+a[1]);c.lineTo(cx+a[0]+b[0],cy+a[1]+b[1]);c.lineTo(cx+b[0],cy+b[1]);}
      else c.arc(cx,cy,rA,tX,tX+dl,dl<0);

    arrow(cx,cy,TY[0],TY[1],col.warm,2.6,12);arrow(cx,cy,TX[0],TX[1],col.eth,2.6,12);

    c.strokeStyle=TB.rgba(col.ink,0.5);c.lineWidth=1;c.beginPath();

    c.font=(fs-2)+'px '+TB.ui;c.fillStyle=col.muted;c.textAlign='center';for(let m=-MM;m<=MM;m++)c.fillText(TB.fmt(m,0),S.xn,Ym(m)+(fs-2)*0.36);c.textAlign='start';

    /* the triangle of probabilities: the distance from the point to the side opposite the corner ω is proportional to P(ω) */

    TB.rich(c,[['ω','i'],[' = 1','m']],A[0],A[1]-9,fs,col.muted,'center');
    TB.rich(c,[['ω','i'],[' = 2','m']],B[0]+6,B[1]+fs+7,fs,col.muted,'center');TB.rich(c,[['ω','i'],[' = 3','m']],C[0]-6,C[1]+fs+7,fs,col.muted,'center');
    c.strokeStyle=TB.rgba(col.ink,0.4);c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();
    for(const s of [[B,C],[C,A],[A,B]]){const f=segNear(Q,s[0],s[1]);c.moveTo(Q[0],Q[1]);c.lineTo(f[0],f[1]);}c.stroke();c.setLineDash([]);
    c.fillStyle=col.muted;c.beginPath();c.arc(ctr[0],ctr[1],2.2,0,2*PI);c.fill();

    c.fillStyle=col.ink;c.strokeStyle=col.paper;c.lineWidth=1.5;c.beginPath();c.arc(Q[0],Q[1],5.5,0,2*PI);c.fill();c.stroke();

  /* pointer: a tip, a mean marker or the triangle point is dragged; a click on the disc brings the nearest tip there (with a finger: a tap, so that the page still scrolls over the disc) */

    if(triDist(x,y)<16)return {k:'tri'};return null;}
  function apply(x,y){if(!drag)return;
    if(drag.k==='tip')setTip(drag.i,[(x+drag.dx-G.cx)/G.k,-(y+drag.dy-G.cy)/G.k]);
    else if(drag.k==='mean')setMean(drag.i,y);else if(drag.k==='tri')setP(x,y);draw();}
  cv.addEventListener('pointerdown',e=>{const q=loc(e),z=zone(q[0],q[1],e.pointerType!=='mouse');if(!z)return;
    if(z.k==='disc'){if(e.pointerType!=='mouse'){tap={x:q[0],y:q[1],i:z.i};return;}drag={k:'tip',i:z.i,dx:0,dy:0};}else drag=z;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}cv.style.cursor='grabbing';apply(q[0],q[1]);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{const q=loc(e);if(drag){apply(q[0],q[1]);return;}
    if(tap){if(Math.hypot(q[0]-tap.x,q[1]-tap.y)>10)tap=null;return;}
    if(e.pointerType==='mouse'){const z=zone(q[0],q[1],false);cv.style.cursor=!z?'default':z.k==='disc'?'pointer':'grab';}});
  cv.addEventListener('pointerup',e=>{if(tap){const t=tap;tap=null;drag={k:'tip',i:t.i,dx:0,dy:0};apply(t.x,t.y);}
    drag=null;const q=loc(e),z=e.pointerType==='mouse'?zone(q[0],q[1],false):null;cv.style.cursor=!z?'default':z.k==='disc'?'pointer':'grab';});
  cv.addEventListener('pointercancel',()=>{drag=null;tap=null;});
  /* a finger on a handle, a scale or the triangle must not scroll the page */
  cv.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const b=cv.getBoundingClientRect(),t=e.touches[0],z=zone(t.clientX-b.left,t.clientY-b.top,true);
    if(z&&z.k!=='disc')e.preventDefault();},{passive:false});
  cv.style.touchAction='pan-y';
  TB.onTheme(draw);TB.onResize(cv,draw);draw();
})();
</script>
