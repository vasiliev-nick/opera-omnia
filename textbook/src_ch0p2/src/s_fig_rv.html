<script>
(function(){
  /* §∅.10, canvas rv3: random variables on three equally likely outcomes as vectors of ℝ³ in the usual axes. The constants lie on the diagonal (c,c,c); the means slide the arrows along it, and the deviations lie in the plane of zero mean perpendicular to it. */
  const TB=window.TB,cv=document.getElementById('rv3');if(!TB||!cv||!TB.V3||!TB.fit)return;
  const V=TB.V3,$=id=>document.getElementById(id),fx=$('rvFx'),sA=$('rvA'),sB=$('rvB'),sP=$('rvP'),oA=$('rvAOut'),oB=$('rvBOut'),oP=$('rvPOut');
  const gC=new TB.Gauge('gRvC'),gR=new TB.Gauge('gRvR'),PI=Math.PI,S2=Math.SQRT2,S3=Math.sqrt(3),S6=Math.sqrt(6),AX=3.4,DG=2.55;
  /* unit vectors of the plane of zero mean: u = (−1,0,1)/√2, w = (1,−2,1)/√6; the diagonal direction is (1,1,1) */
  const U=[-1/S2,0,1/S2],Wv=[1/S6,-2/S6,1/S6],ONE=[1,1,1],D1=[1/S3,1/S3,1/S3];
  const st={yaw:-1.0,pitch:0.52,dist:18};
  /* radius of the disc drawn in the plane of zero mean */
  const RD=1.85;
  let cam=null,tips=null;
  function vals(){const a=+sA.value,b=+sB.value,p=+sP.value*PI/180,du=V.mul(U,S2),dv=V.add(V.mul(U,S2*Math.cos(p)),V.mul(Wv,S2*Math.sin(p)));
    return {a:a,b:b,p:p,du:du,dv:dv,x:V.add(V.mul(ONE,a),du),y:V.add(V.mul(ONE,b),dv)};}
  const E=v=>(v[0]+v[1]+v[2])/3,ip=(u,v)=>V.dot(u,v)/3;
  function draw(){
    const f=TB.fit(cv,W=>Math.round(W*(W<520?1.1:0.64))),c=f.c,W=f.W,H=f.H,col=TB.cols(),sm=W<520,fs=sm?12:13;
    c.clearRect(0,0,W,H);
    const yb=TB.legend(c,[{k:'line',col:col.eth,t:[['ξ','i']]},{k:'line',col:col.warm,t:[['η','i']]},
      {k:'dash',col:col.ink,t:[['перпендикуляр на прямую постоянных','r']]}],sm?8:14,W-8,4,fs);
    const s0=Math.min(W*(sm?0.132:0.1),(H-yb)/7.3);
    cam=V.camera(st,W,H,W*(sm?0.43:0.44),yb+(H-yb)*0.56,s0);
    const q=vals(),X=q.x,Y=q.y,fX=V.mul(ONE,q.a),fY=V.mul(ONE,q.b);
    oA.textContent=TB.fmt(q.a,2);oB.textContent=TB.fmt(q.b,2);oP.textContent=Math.round(+sP.value)+'°';
    const items=[];
    /* the coordinate axes: the value at outcome 1, 2, 3, with marks at the integers */
    for(let i=0;i<3;i++){const e=[0,0,0];e[i]=1;const neg=V.mul(e,-AX*0.75),pos=V.mul(e,AX);
      items.push({t:'line',pts:[neg,[0,0,0]],col:TB.rgba(col.ink,0.32),w:1,dash:[3,4]},{t:'arrow',p:[0,0,0],v:pos,col:TB.rgba(col.ink,0.55),w:1.1});
      const o=[0,0,0];o[(i+1)%3]=0.07;const o2=[0,0,0];o2[(i+2)%3]=0.07;
      for(let k=-2;k<=3;k++)if(k)items.push({t:'segs',s:[[V.add(V.mul(e,k),o),V.sub(V.mul(e,k),o)],[V.add(V.mul(e,k),o2),V.sub(V.mul(e,k),o2)]],col:TB.rgba(col.ink,0.55),w:1});
      items.push({t:'label',p:V.mul(e,AX+0.25),segs:[['ω','i'],[' = '+(i+1),'m']],dx:i===1?2:8,dy:i===1?19:5,size:fs,col:col.muted});}
    /* the plane of zero mean */
    const rim=[];for(let i=0;i<=72;i++){const t=2*PI*i/72;rim.push(V.add(V.mul(U,RD*Math.cos(t)),V.mul(Wv,RD*Math.sin(t))));}
    items.push({t:'line',pts:rim,col:TB.rgba(col.eth,0.45),w:1,bias:0.01});
    /* the line of constants with its marks c = −2…2 */
    items.push({t:'line',pts:[V.mul(ONE,-DG),V.mul(ONE,DG)],col:TB.rgba(col.ink,0.8),w:1.4,ghost:0.35});
    for(let k=-2;k<=2;k++){if(!k)continue;const p=V.mul(ONE,k),o=V.mul(U,0.09);
      items.push({t:'segs',s:[[V.add(p,o),V.sub(p,o)]],col:TB.rgba(col.ink,0.8),w:1.3},{t:'label',p:p,segs:[['c','i'],[' = '+TB.fmt(k,0),'m']],dx:5,dy:16,size:fs-2,col:col.muted});}
    items.push({t:'label',p:V.mul(ONE,DG),segs:[['постоянные','r']],dx:-4,dy:-10,size:fs-1,col:col.muted,al:'right'});
    /* perpendiculars from the tips to the constants, with right-angle marks */
    const corner=(foot,d,m,cl)=>{const n=V.norm(d);if(n<1e-6)return;const h=V.mul(d,0.2/n),v=V.mul(D1,m>0.03?-0.2:0.2);
      items.push({t:'line',pts:[V.add(foot,h),V.add(V.add(foot,h),v),V.add(foot,v)],col:cl,w:1,alpha:0.85,bias:0.02});};
    items.push({t:'line',pts:[fX,X],col:col.eth,w:1.5,dash:[5,4],bias:0.02},{t:'line',pts:[fY,Y],col:col.warm,w:1.5,dash:[5,4],bias:0.02});
    corner(fX,q.du,q.a,col.eth);corner(fY,q.dv,q.b,col.warm);
    items.push({t:'pt',p:fX,r:3.6,fill:col.eth,stroke:col.paper,w:1.2},{t:'pt',p:fY,r:3.6,fill:col.warm,stroke:col.paper,w:1.2});
    /* deviations in the plane and the angle ψ between them */
    items.push({t:'arrow',p:[0,0,0],v:q.du,col:TB.rgba(col.eth,0.75),w:1.4},{t:'arrow',p:[0,0,0],v:q.dv,col:TB.rgba(col.warm,0.8),w:1.4});
    const arcPs=[];for(let i=0;i<=40;i++){const t=q.p*i/40;arcPs.push(V.add(V.mul(U,0.5*Math.cos(t)),V.mul(Wv,0.5*Math.sin(t))));}
    if(q.p>0.02)items.push({t:'line',pts:arcPs,col:col.ink,w:1.2,alpha:0.8,bias:0.03});
    items.push({t:'label',p:V.add(V.mul(U,0.75*Math.cos(q.p/2)),V.mul(Wv,0.75*Math.sin(q.p/2))),segs:[['ψ','i']],dx:-4,dy:5,size:fs+1,col:col.ink});
    /* the vectors ξ, η and the angle φ between them */
    items.push({t:'arrow',p:[0,0,0],v:X,col:col.eth,w:2.6},{t:'arrow',p:[0,0,0],v:Y,col:col.warm,w:2.6});
    const xh=V.unit(X),yp=V.sub(Y,V.mul(xh,V.dot(Y,xh))),phi=Math.acos(Math.max(-1,Math.min(1,V.dot(xh,V.unit(Y)))));
    if(V.norm(yp)>1e-6&&phi>0.02){const e2=V.unit(yp),R=0.95,ps=[];for(let i=0;i<=40;i++){const t=phi*i/40;ps.push(V.add(V.mul(xh,R*Math.cos(t)),V.mul(e2,R*Math.sin(t))));}
      items.push({t:'line',pts:ps,col:col.ink,w:1.2,alpha:0.55,dash:[3,3],bias:0.03});
      items.push({t:'label',p:V.add(V.mul(xh,1.25*Math.cos(phi/2)),V.mul(e2,1.25*Math.sin(phi/2))),segs:[['φ','i']],dx:-4,dy:5,size:fs+1,col:col.ink});}
    const lab=(P,t,cl)=>{const n=V.norm(P)||1;items.push({t:'label',p:V.add(P,V.mul(P,0.22/n)),segs:t,dx:-4,dy:5,size:fs+2,col:cl});};
    lab(X,[['ξ','i']],col.eth);lab(Y,[['η','i']],col.warm);
    c.save();c.beginPath();c.rect(0,yb,W,H-yb);c.clip();
    /* the disc is a single translucent fill under the scene: everything stays visible through it */
    c.globalAlpha=0.13;c.fillStyle=col.eth;c.beginPath();rim.forEach((p,i)=>{const P=cam.P(p);i?c.lineTo(P[0],P[1]):c.moveTo(P[0],P[1]);});c.closePath();c.fill();c.globalAlpha=1;
    V.render(c,cam,items,col);c.restore();
    tips=[cam.P(X),cam.P(Y)];
    /* readouts */
    const exy=ip(X,Y),cov=exy-E(X)*E(Y),dx=ip(q.du,q.du),dy=ip(q.dv,q.dv),cphi=exy/Math.sqrt(ip(X,X)*ip(Y,Y)),rho=cov/Math.sqrt(dx*dy);
    gC.set(cphi);gR.set(rho);
    const tr=v=>'('+v.map(z=>TB.fmt(z,2)).join('; ')+')';
    fx.innerHTML=TB.rows([['<i>ξ</i> = '+tr(X)+',','<i>η</i> = '+tr(Y)],
      ['𝔼<i>ξη</i> = '+TB.fmt(exy,3)+',','𝔼<i>ξ</i>·𝔼<i>η</i> = '+TB.fmt(E(X)*E(Y),3)],
      ['Cov(<i>ξ</i>, <i>η</i>) = 𝔼<i>ξη</i> − 𝔼<i>ξ</i>·𝔼<i>η</i> = '+TB.fmt(cov,3)]]);
  }
  /* a tip of an arrow can be pulled along the diagonal: that changes the mean of its variable */
  let drag=null;
  V.interact(cv,st,{active:()=>true,state:()=>st,
    grab(x,y){if(!tips)return false;for(let i=0;i<2;i++)if(Math.hypot(tips[i][0]-x,tips[i][1]-y)<24){const sl=i?sB:sA;drag={sl:sl,x0:x,y0:y,m0:+sl.value};return true;}drag=null;return false;},
    move(x,y){if(!drag)return;const A=cam.P([0,0,0]),B=cam.P(ONE),dx=B[0]-A[0],dy=B[1]-A[1],n2=dx*dx+dy*dy;if(n2<1)return;
      const m=drag.m0+((x-drag.x0)*dx+(y-drag.y0)*dy)/n2,sl=drag.sl;
      sl.value=String(Math.max(+sl.min,Math.min(+sl.max,Math.round(m/0.05)*0.05)));draw();},
    redraw:draw});
  cv.style.touchAction='none';cv.style.cursor='grab';
  [sA,sB,sP].forEach(s=>s.addEventListener('input',draw));TB.onTheme(draw);TB.onResize(cv,draw);draw();
  if(window.IntersectionObserver){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();V.intro(st,draw);}},{threshold:0.4});io.observe(cv);}
})();
</script>
