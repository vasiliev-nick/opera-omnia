<script>
(function(){
  /* Fig. ∇.comb: the curvature comb of a smooth shape and a draggable boundary point with its tangent, centre of curvature and osculating circle. */
  const TB=window.TB,cv=document.getElementById('comb');if(!TB||!cv||!TB.fit)return;
  const fx=document.getElementById('cbFx'),g=TB.G('gCb');
  const N=1440,C=0.25,PI2=2*Math.PI;
  /* each shape: position, first and second derivatives in its own parameter; the boundary is traversed counterclockwise */
  const SH={
    blob:{f:p=>{const co=Math.cos(p),si=Math.sin(p),
        r=1+0.15*co+0.18*Math.cos(2*p)+0.06*Math.sin(3*p),
        r1=-0.15*si-0.36*Math.sin(2*p)+0.18*Math.cos(3*p),
        r2=-0.15*co-0.72*Math.cos(2*p)-0.54*Math.sin(3*p);
      /* γ = r e, γ' = r' e + r Je, γ'' = (r'' − r) e + 2r' Je with e = (cos φ, sin φ) */
      return [r*co,r*si,r1*co-r*si,r1*si+r*co,(r2-r)*co-2*r1*si,(r2-r)*si+2*r1*co];},i0:Math.round(N*40/360)},
    ell:{f:t=>[2*Math.cos(t),Math.sin(t),-2*Math.sin(t),Math.cos(t),-2*Math.cos(t),-Math.sin(t)],i0:Math.round(N*0.09)}
  };
  const cache={};
  function data(k){if(cache[k])return cache[k];
    const P=[];let kmin=1e9,kmax=-1e9,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let i=0;i<N;i++){const q=SH[k].f(i/N*PI2),v=Math.hypot(q[2],q[3]),tx=q[2]/v,ty=q[3]/v,kk=(q[2]*q[5]-q[3]*q[4])/(v*v*v);
      /* outward normal n = −Jt = (t_y, −t_x); the tooth ends at γ + Cκn */
      const ex=q[0]+C*kk*ty,ey=q[1]-C*kk*tx;
      P.push({x:q[0],y:q[1],tx:tx,ty:ty,k:kk,ex:ex,ey:ey});
      kmin=Math.min(kmin,kk);kmax=Math.max(kmax,kk);
      x0=Math.min(x0,q[0],ex);x1=Math.max(x1,q[0],ex);y0=Math.min(y0,q[1],ey);y1=Math.max(y1,q[1],ey);}
    /* runs of constant sign of κ, cyclically */
    let s0=0;for(let i=0;i<N;i++){if((P[i].k<0)!==(P[(i+N-1)%N].k<0)){s0=i;break;}}
    const runs=[];let a=s0,len=0;
    for(let j=0;j<N;j++){const i=(s0+j)%N,nx=(i+1)%N;len++;if(j===N-1||(P[nx].k<0)!==(P[i].k<0)){runs.push([a,len,P[i].k<0]);a=nx;len=0;}}
    return cache[k]={P:P,kmin:kmin,kmax:kmax,box:[x0,x1,y0,y1],runs:runs};}
  let shape='blob',sel=SH.blob.i0,geo=null,drag=false;
  shape=TB.segs(cv,k=>{if(!SH[k])return;shape=k;sel=SH[k].i0;if(TB.V3)TB.V3.dim(cv,false);draw();});sel=SH[shape].i0;
  const L=v=>[[v,'r']];
  function draw(){
    if(cv.dataset.dim==='3')return;
    const D=data(shape),f=TB.fit(cv,W=>Math.round(W*(W<520?0.84:0.58))),c=f.c,W=f.W,H=f.H,col=TB.cols(),sm=W<520;
    c.clearRect(0,0,W,H);
    const fs=sm?12:13,eth=col.eth,wrm=col.warm;
    const yb=TB.legend(c,[{k:'fill',col:eth,a:0.3,t:[['κ','i'],[' > 0','r']]},{k:'fill',col:wrm,a:0.3,t:[['κ','i'],[' < 0','r']]},
      {k:'thin',col:col.ink,t:L('соприкасающаяся окружность')}],sm?8:14,W-8,4,fs);
    const pad=sm?10:18,b=D.box,bw=b[1]-b[0],bh=b[3]-b[2],sc=Math.min((W-2*pad)/bw,(H-yb-2*pad)/bh);
    const cx=W/2-sc*(b[0]+b[1])/2,cy=yb+(H-yb)/2+sc*(b[2]+b[3])/2,X=x=>cx+sc*x,Y=y=>cy-sc*y;
    geo={X:X,Y:Y,sc:sc};
    const P=D.P;
    /* the shape itself, lightly tinted */
    c.beginPath();for(let i=0;i<N;i++){const q=P[i];if(i)c.lineTo(X(q.x),Y(q.y));else c.moveTo(X(q.x),Y(q.y));}c.closePath();
    c.fillStyle=TB.rgba(col.ink,0.045);c.fill();
    /* comb: filled band between the boundary and the line through the tooth ends, then the teeth */
    for(const r of D.runs){const cl=r[2]?wrm:eth;
      c.beginPath();for(let j=0;j<=r[1];j++){const q=P[(r[0]+j)%N];if(j)c.lineTo(X(q.x),Y(q.y));else c.moveTo(X(q.x),Y(q.y));}
      for(let j=r[1];j>=0;j--){const q=P[(r[0]+j)%N];c.lineTo(X(q.ex),Y(q.ey));}c.closePath();
      c.fillStyle=TB.rgba(cl,0.17);c.fill();}
    c.lineWidth=1;
    for(let i=0;i<N;i+=12){const q=P[i];c.strokeStyle=TB.rgba(q.k<0?wrm:eth,0.55);TB.ln(c,X(q.x),Y(q.y),X(q.ex),Y(q.ey));}
    c.lineWidth=1.4;
    for(const r of D.runs){c.strokeStyle=r[2]?wrm:eth;c.beginPath();
      for(let j=0;j<=r[1];j++){const q=P[(r[0]+j)%N];if(j)c.lineTo(X(q.ex),Y(q.ey));else c.moveTo(X(q.ex),Y(q.ey));}c.stroke();}
    /* boundary and the direction of traversal */
    c.strokeStyle=col.ink;c.lineWidth=2.2;c.beginPath();
    for(let i=0;i<N;i++){const q=P[i];if(i)c.lineTo(X(q.x),Y(q.y));else c.moveTo(X(q.x),Y(q.y));}c.closePath();c.stroke();
    {const q=P[Math.round(N*0.62)],ax=X(q.x),ay=Y(q.y),ux=q.tx,uy=-q.ty,s=8;
      c.fillStyle=col.ink;c.beginPath();c.moveTo(ax+ux*s,ay+uy*s);c.lineTo(ax-ux*s*0.6-uy*s*0.6,ay-uy*s*0.6+ux*s*0.6);
      c.lineTo(ax-ux*s*0.6+uy*s*0.6,ay-uy*s*0.6-ux*s*0.6);c.closePath();c.fill();}
    /* the chosen point: tangent, osculating circle, centre of curvature */
    const q=P[sel],k=q.k,px=X(q.x),py=Y(q.y),sg=k<0?wrm:eth;
    c.save();c.beginPath();c.rect(0,yb,W,H-yb);c.clip();
    c.strokeStyle=TB.rgba(col.ink,0.6);c.lineWidth=1.3;c.setLineDash([6,5]);
    const tl=Math.max(W,H);TB.ln(c,px-q.tx*tl,py+q.ty*tl,px+q.tx*tl,py-q.ty*tl);c.setLineDash([]);
    if(Math.abs(k)>0.004){const zx=q.x-q.ty/k,zy=q.y+q.tx/k,R=sc/Math.abs(k),Zx=X(zx),Zy=Y(zy);
      c.strokeStyle=col.ink;c.lineWidth=1.5;c.beginPath();c.arc(Zx,Zy,R,0,PI2);c.stroke();
      c.strokeStyle=TB.rgba(col.ink,0.4);c.lineWidth=1;TB.ln(c,px,py,Zx,Zy);
      c.fillStyle=col.paper;c.strokeStyle=sg;c.lineWidth=2;c.beginPath();c.arc(Zx,Zy,4.5,0,PI2);c.fill();c.stroke();
      /* label z on the far side of the centre, away from the point */
      const dx=Zx-px,dy=Zy-py,dl=Math.hypot(dx,dy)||1,lx=Zx+dx/dl*14,ly=Zy+dy/dl*14+5;
      if(lx>8&&lx<W-8&&ly>yb+8&&ly<H-4)TB.rich(c,[['z','i']],lx,ly,fs+1,col.ink,'center');}
    c.restore();
    c.fillStyle=col.paper;c.beginPath();c.arc(px,py,7,0,PI2);c.fill();
    c.fillStyle=col.ink;c.beginPath();c.arc(px,py,5,0,PI2);c.fill();
    /* readouts */
    g.set(k,sg);g.mark('lo',D.kmin,'<i>κ</i><sub>min</sub>',true);g.mark('hi',D.kmax,'<i>κ</i><sub>max</sub>',true);
    const ar=Math.abs(k),rs=ar<0.01?'больше 100':TB.fmt(1/ar,2);
    fx.innerHTML=TB.rows([['<i>κ</i> = '+TB.fmt(k,2)+',','радиус кривизны 1/|<i>κ</i>| '+(ar<0.01?'':'= ')+rs]]);
  }
  function nearest(e){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,P=data(shape).P;let b=0,bd=1e18;
    for(let i=0;i<N;i++){const dx=geo.X(P[i].x)-px,dy=geo.Y(P[i].y)-py,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i;}}return [b,Math.sqrt(bd)];}
  cv.style.touchAction='pan-y';
  cv.addEventListener('pointerdown',e=>{if(!geo)return;const q=nearest(e);if(q[1]>32)return;drag=true;cv.style.cursor='grabbing';
    try{cv.setPointerCapture(e.pointerId);}catch(_){}sel=q[0];draw();});
  cv.addEventListener('pointermove',e=>{if(!geo)return;const q=nearest(e);if(drag){sel=q[0];draw();}else cv.style.cursor=q[1]<=32?'grab':'';});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=false;cv.style.cursor='';}));
  TB.onTheme(draw);TB.onResize(cv,draw);draw();
})();
</script>
