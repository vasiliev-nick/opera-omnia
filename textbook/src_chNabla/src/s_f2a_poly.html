<script>
(function(){
  /* Fig. ∇.@poly: a polyline inscribed in an arc, for a plane wave and for two space curves (helix, trefoil); its length Λ against the arc length ∫|γ′|, for uniform partitions with N links and for partitions refined by clicks on the curve. */
  const TB=window.TB,cv=document.getElementById('poly');if(!TB||!cv)return;
  const V=TB.V3,sl=document.getElementById('plN'),so=document.getElementById('plNOut'),fx=document.getElementById('plFx'),gauge=TB.G?TB.G('gPl'):new TB.Gauge('gPl'),bU=document.getElementById('plUni');
  const TP=2*Math.PI;
  const C={
    wave:{d:2,a:0,b:1,g:t=>[-2+4*t+0.25*Math.sin(3*Math.PI*t),0.75*Math.sin(2.5*Math.PI*t+0.35)*(0.55+0.7*t)-0.1]},
    helix:{d:3,a:0,b:4*Math.PI,g:t=>[Math.cos(t),Math.sin(t),0.18*t-0.18*2*Math.PI],st:{yaw:0.5,pitch:0.32}},
    knot:{d:3,a:0,b:TP,closed:true,g:t=>[0.42*(Math.sin(t)+2*Math.sin(2*t)),0.42*(Math.cos(t)-2*Math.cos(2*t)),-0.42*Math.sin(3*t)],st:{yaw:0.35,pitch:0.5}}};
  /* arc length ℓ = ∫|γ′| by Simpson's rule, γ′ by central differences */
  const speed=(k,t)=>{const h=1e-5,p=C[k].g(t+h),q=C[k].g(t-h);let s=0;for(let i=0;i<p.length;i++)s+=(p[i]-q[i])*(p[i]-q[i]);return Math.sqrt(s)/(2*h);};
  for(const k in C){const c=C[k],M=4000,h=(c.b-c.a)/M;let s=speed(k,c.a)+speed(k,c.b);
    for(let i=1;i<M;i++)s+=(i%2?4:2)*speed(k,c.a+i*h);c.len=s*h/3;
    c.smp=[];for(let i=0;i<=900;i++)c.smp.push(c.g(c.a+(c.b-c.a)*i/900));}
  const dist=(p,q)=>{let s=0;for(let i=0;i<p.length;i++)s+=(p[i]-q[i])*(p[i]-q[i]);return Math.sqrt(s);};
  const plen=(k,ts)=>{let s=0;for(let j=1;j<ts.length;j++)s+=dist(C[k].g(ts[j-1]),C[k].g(ts[j]));return s;};
  const uni=(k,n)=>{const c=C[k],ts=[];for(let j=0;j<=n;j++)ts.push(c.a+(c.b-c.a)*j/n);return ts;};
  /* Λ_N / ℓ for the uniform partitions N = 1, …, 64 */
  for(const k in C){C[k].ser=[];for(let n=1;n<=64;n++)C[k].ser.push(plen(k,uni(k,n))/C[k].len);}
  let shape=TB.segs(cv,k=>{if(!C[k])return;shape=k;if(V)V.dim(cv,C[k].d===3);draw();if(C[k].d===3&&V)V.intro(C[k].st,draw);});
  const ts={},added={};
  const reset=()=>{for(const k in C){ts[k]=uni(k,+sl.value);added[k]=0;}};reset();
  let cam=null,map=null;
  function arrowHead(c,x,y,a,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y);c.lineTo(x-8*Math.cos(a-0.4),y-8*Math.sin(a-0.4));c.lineTo(x-8*Math.cos(a+0.4),y-8*Math.sin(a+0.4));c.closePath();c.fill();}
  function draw(){
    const c0=C[shape],col=TB.cols(),f=TB.fit(cv,W=>Math.round(W*(W<520?1.12:0.5))),c=f.c,W=f.W,H=f.H,sm=W<520,fs=sm?12:13;
    c.clearRect(0,0,W,H);so.textContent=sl.value;
    const yb=TB.legend(c,[{k:'line',col:col.eth,t:[['дуга кривой','r']]},{k:'line',col:col.warm,t:[['вписанная ломаная','r']]}],sm?8:14,sm?W-8:W*0.66,4,fs);
    const A=sm?{x0:0,x1:W,y0:yb,y1:H*0.67}:{x0:0,x1:W*0.66,y0:yb,y1:H-6};
    const I=sm?{x0:40,x1:W-14,y0:H*0.73,y1:H-26}:{x0:W*0.72,x1:W-16,y0:H*0.2,y1:H*0.78};
    const T=ts[shape],pts=T.map(c0.g);
    c.save();c.beginPath();c.rect(A.x0,A.y0,A.x1-A.x0,A.y1-A.y0);c.clip();
    if(c0.d===2){
      const sc=Math.min((A.x1-A.x0)/4.6,(A.y1-A.y0)/2.6),ox=(A.x0+A.x1)/2,oy=(A.y0+A.y1)/2,P=p=>[ox+p[0]*sc,oy-p[1]*sc];
      map={P:P,sc:sc};
      /* the regions between each link and its arc */
      c.fillStyle=TB.rgba(col.warm,0.16);
      for(let j=1;j<T.length;j++){c.beginPath();const n=Math.max(2,Math.ceil((T[j]-T[j-1])/(c0.b-c0.a)*400));
        for(let i=0;i<=n;i++){const Q=P(c0.g(T[j-1]+(T[j]-T[j-1])*i/n));if(i)c.lineTo(Q[0],Q[1]);else c.moveTo(Q[0],Q[1]);}c.closePath();c.fill();}
      /* unit bar */
      const ux=A.x0+14,uy=A.y1-12;c.strokeStyle=col.ink;c.lineWidth=1.5;TB.ln(c,ux,uy,ux+sc,uy);TB.ln(c,ux,uy-4,ux,uy+4);TB.ln(c,ux+sc,uy-4,ux+sc,uy+4);
      TB.rich(c,[['1','m']],ux+sc/2,uy-7,13,col.ink,'center');
      c.strokeStyle=col.eth;c.lineWidth=3;c.lineCap='round';c.beginPath();c0.smp.forEach((p,i)=>{const Q=P(p);if(i)c.lineTo(Q[0],Q[1]);else c.moveTo(Q[0],Q[1]);});c.stroke();
      /* direction of travel: an arrowhead on the curve at τ = 0.68 */
      const e=P(c0.smp[612]),e2=P(c0.smp[604]),ea=Math.atan2(e[1]-e2[1],e[0]-e2[0]);arrowHead(c,e[0]+5*Math.cos(ea),e[1]+5*Math.sin(ea),ea,col.eth);
      c.lineCap='butt';c.strokeStyle=col.warm;c.lineWidth=2;c.beginPath();pts.forEach((p,i)=>{const Q=P(p);if(i)c.lineTo(Q[0],Q[1]);else c.moveTo(Q[0],Q[1]);});c.stroke();
      for(const p of pts){const Q=P(p);c.fillStyle=col.warm;c.strokeStyle=col.paper;c.lineWidth=1.4;c.beginPath();c.arc(Q[0],Q[1],3.4,0,TP);c.fill();c.stroke();}
      const s0=P(c0.smp[0]);TB.rich(c,[['γ','i'],['(0)','m']],s0[0]+6,s0[1]+18,fs+1,col.ink,'start');
      const s1=P(c0.smp[900]);TB.rich(c,[['γ','i'],['(1)','m']],s1[0]-4,s1[1]-12,fs+1,col.ink,'right');
    }else{
      const st=c0.st,s=Math.min(A.x1-A.x0,A.y1-A.y0)/(shape==='helix'?3.9:3.7);cam=V.camera(st,W,H,(A.x0+A.x1)/2,(A.y0+A.y1)/2-(shape==='helix'?0.1*(A.y1-A.y0):0),s);
      const z0=shape==='helix'?-1.45:-0.75,items=[],R=1.5;
      for(let i=-3;i<=3;i++){const u=i/3*R;items.push({t:'line',pts:[[u,-R,z0],[u,R,z0]],col:TB.rgba(col.ink,0.12),w:1,bias:-0.2},{t:'line',pts:[[-R,u,z0],[R,u,z0]],col:TB.rgba(col.ink,0.12),w:1,bias:-0.2});}
      items.push({t:'line',pts:c0.smp.map(p=>[p[0],p[1],z0]),col:TB.rgba(col.ink,0.14),w:1.6,bias:-0.1},
        {t:'line',pts:pts.map(p=>[p[0],p[1],z0]),col:TB.rgba(col.warm,0.35),w:1.4,bias:-0.05},
        {t:'line',pts:pts,col:col.warm,w:2,bias:0.08});
      /* depth cue: nearer pieces of the curve are wider and more opaque */
      for(let i=0;i<900;i+=10){const piece=c0.smp.slice(i,i+11),q=cam.rot(piece[5]||piece[0])[2],a=Math.max(0,Math.min(1,(q+1.6)/3.2));
        items.push({t:'line',pts:piece,col:col.eth,w:1.8+2*a,alpha:0.45+0.55*a,bias:0});}
      for(const p of pts)items.push({t:'pt',p:p,r:3.4,fill:col.warm,stroke:col.paper,w:1.4,bias:0.1});
      if(!c0.closed)items.push({t:'label',p:c0.smp[0],segs:[['γ','i'],['(0)','m']],col:col.ink,dx:8,dy:14,size:fs+1});
      V.render(c,cam,items,col);
    }
    c.restore();
    /* inset: Λ_N / ℓ against N on a logarithmic axis */
    const lx=n=>I.x0+Math.log2(n)/6*(I.x1-I.x0),ly=v=>I.y1-Math.max(0,Math.min(1.04,v))*(I.y1-I.y0);
    c.strokeStyle=TB.rgba(col.ink,0.4);c.lineWidth=1;TB.ln(c,I.x0,I.y1,I.x1,I.y1);TB.ln(c,I.x0,I.y1,I.x0,I.y0-6);
    c.setLineDash([4,3]);c.strokeStyle=col.eth;TB.ln(c,I.x0,ly(1),I.x1,ly(1));c.setLineDash([]);
    TB.rich(c,[['ℓ','i']],I.x1+3,ly(1)+4,fs,col.eth,'start');
    for(const n of [1,2,4,8,16,32,64]){c.strokeStyle=TB.rgba(col.ink,0.4);TB.ln(c,lx(n),I.y1,lx(n),I.y1+4);TB.rich(c,[[String(n),'m']],lx(n),I.y1+16,11,col.muted,'center');}
    for(const v of [0,0.5,1]){TB.ln(c,I.x0-4,ly(v),I.x0,ly(v));TB.rich(c,[[TB.fmt(v,v%1?1:0),'m']],I.x0-6,ly(v)+4,11,col.muted,'right');}
    TB.rich(c,[['Λ','m'],['/','m'],['ℓ','i']],I.x0+5,I.y0-8,fs,col.ink,'start');TB.rich(c,[['N','i']],I.x1,I.y1-6,fs,col.ink,'right');
    c0.ser.forEach((v,i)=>{const n=i+1,p2=(n&(n-1))===0;c.fillStyle=p2?col.ink:TB.rgba(col.ink,0.45);c.beginPath();c.arc(lx(n),ly(v),p2?2.8:1.5,0,TP);c.fill();});
    const L=plen(shape,T),r=L/c0.len,n=T.length-1;
    c.fillStyle=col.warm;c.strokeStyle=col.paper;c.lineWidth=1.5;c.beginPath();
    if(added[shape]){const X=lx(Math.min(64,n)),Y=ly(r);c.moveTo(X,Y-6);c.lineTo(X+6,Y);c.lineTo(X,Y+6);c.lineTo(X-6,Y);c.closePath();}else c.arc(lx(n),ly(r),5,0,TP);
    c.fill();c.stroke();
    gauge.set(r,col.warm);
    fx.innerHTML=TB.rows([['<i>N</i> = '+n+' '+(n%10===1&&n%100!==11?'звено':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'звена':'звеньев')+':','длина ломаной Λ = '+TB.fmt(L,3)+',','длина дуги <i>ℓ</i> = '+TB.fmt(c0.len,3)],
      [added[shape]?'разбиение измельчено щелчками: добавлено вершин '+added[shape]:'разбиение равномерное по параметру','(<i>ℓ</i> − Λ = '+TB.fmt(c0.len-L,3)+')']]);
  }
  /* a click on the curve adds a vertex there */
  function addAt(x,y){const c0=C[shape];let best=-1,bd=16*16;
    for(let i=0;i<=900;i++){const Q=c0.d===2?map.P(c0.smp[i]):cam.P(c0.smp[i]),d=(Q[0]-x)**2+(Q[1]-y)**2;if(d<bd){bd=d;best=i;}}
    if(best<0)return;const t=c0.a+(c0.b-c0.a)*best/900,T=ts[shape];if(T.some(u=>Math.abs(u-t)<1e-3*(c0.b-c0.a)))return;
    if(T.length>129)return;T.push(t);T.sort((a,b)=>a-b);added[shape]++;draw();}
  cv.style.touchAction='pan-y';
  cv.addEventListener('pointerdown',e=>{if(C[shape].d!==2||!map)return;const r=cv.getBoundingClientRect();addAt(e.clientX-r.left,e.clientY-r.top);});
  if(V)V.interact(cv,C.helix.st,{active:()=>C[shape].d===3,state:()=>C[shape].st,grab:()=>false,move(){},tap:addAt,redraw:draw});
  sl.addEventListener('input',()=>{reset();draw();});bU.addEventListener('click',()=>{reset();draw();});
  const redraw=()=>draw();TB.onTheme(redraw);TB.onResize(cv,redraw);draw();
})();
</script>
