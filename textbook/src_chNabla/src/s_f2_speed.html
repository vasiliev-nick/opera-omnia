<script>
(function(){
  /* Fig. speed: the ellipse (2 cos τ, sin τ) with beads at equal steps of the parameter and at equal steps of arc length; velocity, unit tangent and left normal at the moment τ. */
  const TB=window.TB,cv=document.getElementById('speed');if(!TB||!cv)return;
  const sl=document.getElementById('spT'),so=document.getElementById('spTOut'),fx=document.getElementById('spFx'),gauge=new TB.Gauge('gSp');
  gauge.mark('one',1,'|<i>t</i>|');
  const N=48,M=4096,TP=2*Math.PI,DEL=0.2,LAM=0.5;
  const g=t=>[2*Math.cos(t),Math.sin(t)],dg=t=>[-2*Math.sin(t),Math.cos(t)],sp=t=>Math.hypot(2*Math.sin(t),Math.cos(t));
  /* arc length σ(τ) from (2, 0): a table by Simpson's rule on M cells */
  const S=new Float64Array(M+1);
  for(let i=0;i<M;i++){const a=i/M*TP,b=(i+1)/M*TP;S[i+1]=S[i]+(b-a)/6*(sp(a)+4*sp((a+b)/2)+sp(b));}
  const L=S[M];
  const sigma=t=>{const u=t/TP*M,i=Math.min(M-1,Math.floor(u)),a=i/M*TP;return S[i]+(t-a)/6*(sp(a)+4*sp((a+t)/2)+sp(t));};
  const tauOf=s=>{let lo=0,hi=M;while(hi-lo>1){const m=(lo+hi)>>1;if(S[m]<=s)lo=m;else hi=m;}
    let t=lo/M*TP;for(let k=0;k<4;k++)t-=(sigma(t)-s)/sp(t);return t;};
  const tauS=[];for(let k=0;k<N;k++)tauS.push(tauOf(k*L/N));
  function arrow(c,x1,y1,x2,y2,col,lw,hs){const a=Math.atan2(y2-y1,x2-x1);c.strokeStyle=col;c.lineWidth=lw;
    TB.ln(c,x1,y1,x2-hs*0.6*Math.cos(a),y2-hs*0.6*Math.sin(a));c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);
    c.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));c.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));c.closePath();c.fill();}
  function draw(){
    const tau=+sl.value,col=TB.cols(),v=sp(tau);so.textContent=TB.fmt(tau,2);gauge.set(v,col.eth);
    const f=TB.fit(cv,W=>Math.round(W*(W<560?0.8:0.56))),c=f.c,W=f.W,H=f.H;c.clearRect(0,0,W,H);
    const sc=Math.min(W/5.1,H/2.95),ay=W<560?1.85:1.4,ox=W/2,oy=H/2,T=p=>[ox+p[0]*sc,oy-p[1]*sc];
    /* axes */
    c.strokeStyle=TB.rgba(col.ink,0.28);c.lineWidth=1;TB.ln(c,ox-2.45*sc,oy,ox+2.45*sc,oy);TB.ln(c,ox,oy-ay*sc,ox,oy+ay*sc);
    c.fillStyle=TB.rgba(col.ink,0.55);for(const k of [-2,-1,1,2]){c.fillRect(ox+k*sc-0.5,oy-3,1,6);}for(const k of [-1,1])c.fillRect(ox-3,oy-k*sc-0.5,6,1);
    TB.rich(c,[['x','i'],['1','s']],ox+2.45*sc,oy+16,13,col.muted,'right');TB.rich(c,[['x','i'],['2','s']],ox+7,oy-ay*sc+11,13,col.muted,'start');
    /* the arc already travelled, from (2, 0) to γ(τ) */
    c.strokeStyle=TB.rgba(col.warm,0.32);c.lineWidth=8;c.lineCap='round';c.beginPath();
    for(let i=0;i<=400;i++){const P=T(g(tau*i/400));if(i)c.lineTo(P[0],P[1]);else c.moveTo(P[0],P[1]);}c.stroke();c.lineCap='butt';
    /* the ellipse and the outer ring */
    c.strokeStyle=col.ink;c.lineWidth=1.6;c.beginPath();for(let i=0;i<=360;i++){const P=T(g(i/360*TP));if(i)c.lineTo(P[0],P[1]);else c.moveTo(P[0],P[1]);}c.stroke();
    const ring=t=>{const p=g(t),d=dg(t),n=Math.hypot(d[0],d[1]);return [p[0]+DEL*d[1]/n,p[1]-DEL*d[0]/n];};
    c.strokeStyle=TB.rgba(col.warm,0.35);c.lineWidth=1;c.beginPath();for(let i=0;i<=360;i++){const P=T(ring(i/360*TP));if(i)c.lineTo(P[0],P[1]);else c.moveTo(P[0],P[1]);}c.stroke();
    /* beads */
    c.fillStyle=col.eth;for(let k=0;k<N;k++){const P=T(g(k/N*TP));c.beginPath();c.arc(P[0],P[1],2.7,0,TP);c.fill();}
    c.fillStyle=col.warm;for(let k=0;k<N;k++){const P=T(ring(tauS[k]));c.beginPath();c.arc(P[0],P[1],2.7,0,TP);c.fill();}
    /* start of the arc length */
    const P0=T([2,0]);c.fillStyle=col.ink;c.beginPath();c.arc(P0[0],P0[1],3,0,TP);c.fill();
    /* velocity, unit tangent and left normal, all in one scale */
    const p=g(tau),d=dg(tau),t=[d[0]/v,d[1]/v],jt=[-t[1],t[0]],P=T(p),hs=Math.max(7,sc*0.07);
    const A=T([p[0]+LAM*d[0],p[1]+LAM*d[1]]),B=T([p[0]+LAM*t[0],p[1]+LAM*t[1]]),C=T([p[0]+LAM*jt[0],p[1]+LAM*jt[1]]);
    arrow(c,P[0],P[1],A[0],A[1],col.eth,3.2,hs+3);
    arrow(c,P[0],P[1],B[0],B[1],col.warm,2,hs);
    arrow(c,P[0],P[1],C[0],C[1],col.ink,1.2,hs-1);
    c.fillStyle=col.paper;c.beginPath();c.arc(P[0],P[1],4.2,0,TP);c.fill();c.strokeStyle=col.ink;c.lineWidth=1.6;c.stroke();
    /* labels: γ′ beyond its tip, t beside its head on the outer side, Jt beyond its tip */
    const fs=W<560?13:15,out=[jt[0]*-1,jt[1]*-1];
    const lab=(segs,q,dx,dy,cl)=>{const Q=T(q);const w=TB.richW(c,segs,fs);TB.rich(c,segs,Q[0]+dx*(w/2+7)-w/2,Q[1]-dy*(fs*0.7+5)+fs*0.35,fs,cl);};
    lab([['γ','i'],['′','m']],[p[0]+LAM*d[0],p[1]+LAM*d[1]],t[0],t[1],col.eth);
    lab([['t','i']],[p[0]+LAM*t[0]+0.13*out[0],p[1]+LAM*t[1]+0.13*out[1]],out[0],out[1],col.warm);
    lab([['J','i'],['t','i']],[p[0]+LAM*jt[0],p[1]+LAM*jt[1]],jt[0],jt[1],col.ink);
    fx.innerHTML=TB.rows([['<i>τ</i> = '+TB.fmt(tau,2)+',','<i>γ</i>(<i>τ</i>) = ('+TB.fmt(p[0],2)+'; '+TB.fmt(p[1],2)+')'],
      ['|<i>γ</i>′(<i>τ</i>)| = '+TB.fmt(v,2)+',','пройденный путь <i>σ</i>(<i>τ</i>) = '+TB.fmt(sigma(tau),2),'из <i>ℓ</i> = '+TB.fmt(L,2)]]);
  }
  sl.addEventListener('input',draw);
  const redraw=()=>draw();TB.onTheme(redraw);TB.onResize(cv,redraw);draw();
})();
</script>
