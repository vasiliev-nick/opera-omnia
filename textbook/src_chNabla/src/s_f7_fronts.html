<script>
(function(){
  /* Fig. ∇.fronts: parallel curves γ+d·n of an ellipse or a Cassini peanut, the true level line {f_K=d} of the signed distance computed on a grid, the evolute and the cusps of γ_d. */
  const TB=window.TB,cv=document.getElementById('fronts');if(!TB||!cv||!TB.fit)return;
  const sl=document.getElementById('frD'),so=document.getElementById('frDOut'),fx=document.getElementById('frFx');
  const WAIST=Math.sqrt(Math.sqrt(1.6)-1);
  /* World windows have the same aspect 1.6, so the canvas keeps its height when the shape changes. */
  const SH={
    ell:{X:2.8,Y:1.75,g:t=>[2*Math.cos(t),Math.sin(t)],inside:(x,y)=>x*x/4+y*y<1},
    pea:{X:2.3,Y:2.3/1.6,g:t=>{const c=Math.cos(2*t),r=Math.sqrt(c+Math.sqrt(c*c+0.6));return [r*Math.cos(t),r*Math.sin(t)];},
      inside:(x,y)=>{const q=x*x+y*y;return q*q-2*(x*x-y*y)<0.6;}}};
  const N=1440,NX=168,NY=105;
  /* Samples of the curve: point, outward normal n=−Jt and curvature, by central differences of the parametrisation. */
  function prep(S){if(S.P)return S;const h=1e-4,P=[],Nn=[],K=[];
    for(let i=0;i<N;i++){const t=i/N*2*Math.PI,a=S.g(t-h),b=S.g(t),c=S.g(t+h);
      const x1=(c[0]-a[0])/(2*h),y1=(c[1]-a[1])/(2*h),x2=(c[0]-2*b[0]+a[0])/(h*h),y2=(c[1]-2*b[1]+a[1])/(h*h),v=Math.hypot(x1,y1);
      P.push(b);Nn.push([y1/v,-x1/v]);K.push((x1*y2-y1*x2)/(v*v*v));}
    S.P=P;S.Nn=Nn;S.K=K;
    /* signed distance on a grid: distance to the polygon of 480 boundary points, negative inside */
    const M=480,Q=[];for(let i=0;i<M;i++)Q.push(S.g(i/M*2*Math.PI));
    const F=new Float32Array(NX*NY),cx=2*S.X/(NX-1),cy=2*S.Y/(NY-1);
    for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const x=-S.X+i*cx,y=S.Y-j*cy;let m=1e9;
      for(let k=0;k<M;k++){const A=Q[k],B=Q[(k+1)%M],ux=B[0]-A[0],uy=B[1]-A[1],wx=x-A[0],wy=y-A[1];
        let s=(wx*ux+wy*uy)/(ux*ux+uy*uy);s=s<0?0:s>1?1:s;const dx=wx-s*ux,dy=wy-s*uy,q=dx*dx+dy*dy;if(q<m)m=q;}
      m=Math.sqrt(m);F[j*NX+i]=S.inside(x,y)?-m:m;}
    S.F=F;S.cell=cx;return S;}
  let md=TB.segs(cv,k=>{if(!SH[k])return;md=k;if(TB.V3)TB.V3.dim(cv,false);draw();}),off=null;
  const sm=()=>cv.parentNode.getBoundingClientRect().width<520;
  /* Legend rows are measured before sizing, so that the plot keeps the aspect of its world window. */
  const mctx=document.createElement('canvas').getContext('2d');
  function items(K){return [{k:'line',col:K.ink,t:[['граница ','r'],['Γ','m']]},{k:'thin',col:K.ink,t:[['γ','i'],['d','s'],[' = ','m'],['γ','i'],[' + ','m'],['d','i'],['n','i']]},
    {k:'fill',col:K.eth,a:0.35,t:[['{','m'],['f','i'],['K','s'],[' ≤ ','m'],['d','i'],['}','m']]},{k:'dash',col:K.muted,t:[['эволюта','r']]}];}
  function legH(W,s){const K=TB.cols(),L=sm()?4:10,R=W-(sm()?4:10);let x=L,rows=1;
    for(const it of items(K)){const w=22+6+TB.richW(mctx,it.t,s);if(x>L&&x+w>R){x=L;rows++;}x+=w+18;}
    return 6+s+(rows-1)*(s+9)+7+4;}
  function draw(){
    if(cv.dataset.dim==='3')return;
    const S=prep(SH[md]),d=+sl.value;so.textContent=TB.fmt(d,2);
    const s=sm()?12:13,f=TB.fit(cv,W=>Math.round(W/1.6)+legH(W,s)),c=f.c,W=f.W,H=f.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const top=TB.legend(c,items(K),sm()?4:10,W-(sm()?4:10),6,s)+4,ph=H-top,sc=Math.min(W/(2*S.X),ph/(2*S.Y)),ox=W/2,oy=top+ph/2;
    const X=x=>ox+x*sc,Y=y=>oy-y*sc;
    c.save();c.beginPath();c.rect(0,top,W,ph);c.clip();
    /* the set {f_K ≤ d}: a soft fill that deepens away from its edge */
    if(!off){off=document.createElement('canvas');off.width=NX;off.height=NY;}
    const ox2=off.getContext('2d'),im=ox2.createImageData(NX,NY),D=im.data,Pp=TB.hex(K.paper),E=TB.hex(K.eth),cell=S.cell;
    for(let q=0;q<NX*NY;q++){const v=d-S.F[q],a=Math.max(0,Math.min(1,0.5+v/cell)),al=a*(0.2+0.2*Math.min(1,Math.max(0,v)/0.45));
      for(let u=0;u<3;u++)D[4*q+u]=Pp[u]+(E[u]-Pp[u])*al;D[4*q+3]=255;}
    ox2.putImageData(im,0,0);c.imageSmoothingEnabled=true;
    const gx=2*S.X/(NX-1)*sc/2,gy=2*S.Y/(NY-1)*sc/2;c.drawImage(off,X(-S.X)-gx,Y(S.Y)-gy,2*S.X*sc+2*gx,2*S.Y*sc+2*gy);
    /* faint axes and a unit bar */
    c.strokeStyle=TB.rgba(K.ink,0.18);c.lineWidth=1;TB.ln(c,0,oy,W,oy);TB.ln(c,ox,top,ox,H);
    c.fillStyle=TB.rgba(K.ink,0.45);for(let t=-2;t<=2;t++){if(!t)continue;c.fillRect(X(t)-0.5,oy-3,1,6);if(Math.abs(t)<S.Y)c.fillRect(ox-3,Y(t)-0.5,6,1);}
    TB.rich(c,[['x','i'],['1','s']],W-6,oy-7,s,K.muted,'right');TB.rich(c,[['x','i'],['2','s']],ox+7,top+s+4,s,K.muted);
    /* the true level line {f_K=d} by marching squares on the grid */
    c.strokeStyle=K.eth;c.lineWidth=1.9;c.lineJoin='round';c.beginPath();
    const px=i=>X(-S.X+i*2*S.X/(NX-1)),py=j=>Y(S.Y-j*2*S.Y/(NY-1));
    for(let j=0;j<NY-1;j++)for(let i=0;i<NX-1;i++){
      const a=S.F[j*NX+i]-d,b=S.F[j*NX+i+1]-d,e=S.F[(j+1)*NX+i+1]-d,g=S.F[(j+1)*NX+i]-d;
      const k=(a<0?1:0)|(b<0?2:0)|(e<0?4:0)|(g<0?8:0);if(k===0||k===15)continue;
      const T=[px(i)+(px(i+1)-px(i))*a/(a-b),py(j)],R=[px(i+1),py(j)+(py(j+1)-py(j))*b/(b-e)],B=[px(i)+(px(i+1)-px(i))*g/(g-e),py(j+1)],L=[px(i),py(j)+(py(j+1)-py(j))*a/(a-g)];
      const seg=(p,q)=>{c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);},ctr=(a+b+e+g)/4<0;
      switch(k){case 1:case 14:seg(L,T);break;case 2:case 13:seg(T,R);break;case 3:case 12:seg(L,R);break;case 4:case 11:seg(R,B);break;
        case 6:case 9:seg(T,B);break;case 7:case 8:seg(L,B);break;
        case 5:if(ctr){seg(L,B);seg(T,R);}else{seg(L,T);seg(R,B);}break;case 10:if(ctr){seg(L,T);seg(R,B);}else{seg(T,R);seg(L,B);}break;}}
    c.stroke();
    /* evolute, broken where the curvature changes sign or nearly vanishes */
    c.strokeStyle=TB.rgba(K.ink,0.55);c.lineWidth=1.3;c.setLineDash([5,4]);c.beginPath();let pen=false;
    for(let i=0;i<=N;i++){const q=i%N,k=S.K[q];if(Math.abs(k)<0.03||(i&&Math.sign(k)!==Math.sign(S.K[(i-1)%N]))){pen=false;continue;}
      const zx=S.P[q][0]-S.Nn[q][0]/k,zy=S.P[q][1]-S.Nn[q][1]/k;if(Math.abs(zx)>40||Math.abs(zy)>40){pen=false;continue;}
      if(pen)c.lineTo(X(zx),Y(zy));else{c.moveTo(X(zx),Y(zy));pen=true;}}
    c.stroke();c.setLineDash([]);
    /* boundary and the parallel curve */
    const path=(dd)=>{c.beginPath();for(let i=0;i<=N;i++){const q=i%N,x=S.P[q][0]+dd*S.Nn[q][0],y=S.P[q][1]+dd*S.Nn[q][1];if(i)c.lineTo(X(x),Y(y));else c.moveTo(X(x),Y(y));}c.stroke();};
    c.strokeStyle=K.ink;c.lineWidth=2.6;path(0);
    if(Math.abs(d)>0.004){c.lineWidth=1.25;path(d);}
    /* cusps of γ_d: zeros of 1+dκ; they lie on the evolute */
    let mn=1e9,cusps=[];
    for(let i=0;i<N;i++){const u=1+d*S.K[i],w=1+d*S.K[(i+1)%N];if(u<mn)mn=u;
      if((u<0)!==(w<0)){const l=u/(u-w),A=S.P[i],B=S.P[(i+1)%N],nA=S.Nn[i],nB=S.Nn[(i+1)%N];
        cusps.push([A[0]+(B[0]-A[0])*l+d*(nA[0]+(nB[0]-nA[0])*l),A[1]+(B[1]-A[1])*l+d*(nA[1]+(nB[1]-nA[1])*l)]);}}
    for(const p of cusps){c.fillStyle=K.paper;c.beginPath();c.arc(X(p[0]),Y(p[1]),5.2,0,7);c.fill();c.fillStyle=K.warm;c.beginPath();c.arc(X(p[0]),Y(p[1]),3.6,0,7);c.fill();}
    c.restore();
    /* unit bar in the lower left corner */
    const x0=12,y0=H-12;c.strokeStyle=K.ink;c.lineWidth=1.4;TB.ln(c,x0,y0,x0+sc,y0);TB.ln(c,x0,y0-4,x0,y0+4);TB.ln(c,x0+sc,y0-4,x0+sc,y0+4);
    TB.rich(c,[['1','m']],x0+sc/2,y0-6,s,K.ink,'center');
    /* readout */
    const nm=['','одно','два','три','четыре','пять','шесть'],w=cusps.length;
    const cu=w===0?'у <i>γ</i><sub><i>d</i></sub> острий нет':'у <i>γ</i><sub><i>d</i></sub> '+(nm[w]||w)+' остри'+(w===1?'ё':w<5?'я':'ёв');
    const row=['min<sub><i>s</i></sub> (1 + <i>d</i> <i>κ</i>(<i>s</i>)) = '+TB.fmt(mn,2)+',',cu];
    const rows=[row];if(md==='pea'&&d<=-WAIST)rows.push(['стороны перешейка встретились:','линия уровня {<i>f</i><sub><i>K</i></sub> = <i>d</i>}','распалась на две части']);
    fx.innerHTML=TB.rows(rows);
  }
  sl.addEventListener('input',draw);TB.onTheme(draw);TB.onResize(cv,draw);draw();
})();
</script>
