<script>
(function(){
  /* Fig. fog: gradient descent on a winding ravine, seen either through a small window around the walker or as the whole map. */
  const cv=document.getElementById('fog');if(!cv||!window.TB||!TB.fit)return;
  const fx=document.getElementById('fogFx');
  const s=x=>0.7*Math.sin(1.5*x+0.3),ds=x=>1.05*Math.cos(1.5*x+0.3);
  const f=(x,y)=>1.6*(y-s(x))**2+0.035*(x-2.3)**2+0.06*Math.exp(-((x+0.6)**2+(y+0.9)**2));
  const grad=(x,y)=>{const e=y-s(x),b=0.06*Math.exp(-((x+0.6)**2+(y+0.9)**2));return [-3.2*e*ds(x)+0.07*(x-2.3)-2*(x+0.6)*b,3.2*e-2*(y+0.9)*b];};
  const ETA=0.19,X0=[-1.4,1.1];
  let mode=TB.seg1(cv.closest('figure').querySelector('.seg'),k=>{mode=k;draw();}),path=[X0.slice()],geo=null,img=null,imgKey='';
  let fmin=Infinity;for(let i=0;i<=600;i++){const x=-3+6*i/600;fmin=Math.min(fmin,f(x,s(x)));}
  const lev=v=>Math.log(v-fmin+0.004);
  function heat(K,n,ym){const key=K.paper+K.eth+n+ym;if(img&&imgKey===key)return img;
    const lo=lev(fmin),hi=lev(f(-3,-ym));
    img=TB.heat(n,(i,j)=>{const x=-3+6*(i+0.5)/n,y=-ym+2*ym*(j+0.5)/n;const t=Math.max(0,Math.min(1,(lev(f(x,y))-lo)/(hi-lo)));return TB.mixa(K.eth,K.paper,0.06+0.94*Math.pow(t,1.5));});
    imgKey=key;return img;}
  function draw(){
    const F=TB.fit(cv,W=>Math.max(250,Math.round(W*0.56))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    const ym=3*H/W,X=x=>(x+3)/6*W,Y=y=>H/2-y/ym*H/2,sc=W/6;geo={X:X,Y:Y,ux:x=>x/W*6-3,uy:y=>(H/2-y)/(H/2)*ym};
    const im=heat(K,180,ym),p=path[path.length-1],P=[X(p[0]),Y(p[1])];
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const levels=[];for(let k=-5;k<=1.2;k+=0.55)levels.push(fmin+Math.exp(k));
    if(mode==='map'){
      c.imageSmoothingEnabled=true;c.drawImage(im,0,0,W,H);
      TB.contours(c,f,-3,3,-ym,ym,X,Y,levels,90,()=>{c.strokeStyle=TB.rgba(K.ink,0.22);c.lineWidth=1;});
    }else{
      c.fillStyle=TB.rgba(K.muted,0.10);c.fillRect(0,0,W,H);
      const R=0.5*sc;c.save();c.beginPath();c.arc(P[0],P[1],R,0,7);c.clip();
      c.fillStyle=K.paper;c.fillRect(0,0,W,H);c.drawImage(im,0,0,W,H);
      TB.contours(c,f,Math.max(-3,p[0]-0.6),Math.min(3,p[0]+0.6),Math.max(-ym,p[1]-0.6),Math.min(ym,p[1]+0.6),X,Y,levels,30,()=>{c.strokeStyle=TB.rgba(K.ink,0.25);c.lineWidth=1;});
      const fade=c.createRadialGradient(P[0],P[1],R*0.55,P[0],P[1],R);fade.addColorStop(0,TB.rgba(K.paper,0));fade.addColorStop(1,TB.rgba(K.paper,0.95));
      c.fillStyle=fade;c.fillRect(P[0]-R,P[1]-R,2*R,2*R);c.restore();
    }
    // the path walked so far
    c.strokeStyle=TB.rgba(K.warm,0.85);c.lineWidth=1.6;c.beginPath();path.forEach((q,i)=>{i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1]));});c.stroke();
    for(let i=0;i<path.length-1;i++){c.fillStyle=K.warm;c.beginPath();c.arc(X(path[i][0]),Y(path[i][1]),2.3,0,7);c.fill();}
    // the downhill arrow at the walker
    const g=grad(p[0],p[1]),gn=Math.hypot(g[0],g[1]);
    if(gn>1e-6){const a=Math.min(0.42,0.15+gn*0.25)*sc;TB.arrow(c,P[0],P[1],P[0]-g[0]/gn*a,P[1]+g[1]/gn*a,K.ink,1.8);}
    TB.dot(c,P[0],P[1],K.warm,K,6);
    if(mode==='map'){const m=[X(2.3),Y(s(2.3))];c.strokeStyle=K.ink;c.lineWidth=1.6;c.beginPath();c.moveTo(m[0]-5,m[1]-5);c.lineTo(m[0]+5,m[1]+5);c.moveTo(m[0]+5,m[1]-5);c.lineTo(m[0]-5,m[1]+5);c.stroke();
      TB.tag(c,[['минимум','r']],m[0],m[1]+(W<500?24:26),W<500?12:13,K.ink,K,'center');}
    const k=path.length-1;
    fx.innerHTML=TB.rows([['шагов: '+k+',','<i>f</i>(<i>x</i><sub>'+k+'</sub>) = '+TB.fmt(f(p[0],p[1]),3)+',','‖∇<i>f</i>(<i>x</i><sub>'+k+'</sub>)‖ = '+TB.fmt(gn,3)]]);
  }
  const step=()=>{const p=path[path.length-1],g=grad(p[0],p[1]);path.push([p[0]-ETA*g[0],p[1]-ETA*g[1]]);};
  let left=0;const pl=TB.player(()=>{if(left<=0)return false;step();left--;draw();return left>0;},110);
  document.getElementById('fogStep').addEventListener('click',()=>{pl.stop();step();draw();});
  document.getElementById('fogRun').addEventListener('click',()=>{left=20;pl.start();});
  document.getElementById('fogReset').addEventListener('click',()=>{pl.stop();path=[X0.slice()];draw();});
  const setAt=(x,y)=>{if(!geo)return;let u=geo.ux(x),v=geo.uy(y);u=Math.max(-2.95,Math.min(2.95,u));const ym=3*cv.clientHeight/cv.clientWidth;v=Math.max(-ym+0.05,Math.min(ym-0.05,v));pl.stop();path=[[u,v]];draw();};
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();setAt(e.clientX-r.left,e.clientY-r.top);});
  draw();TB.onTheme(()=>{img=null;draw();});TB.onResize(cv,()=>{img=null;draw();});
})();
</script>
