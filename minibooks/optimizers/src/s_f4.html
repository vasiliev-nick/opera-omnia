<script>
(function(){

<script>
(function(){
  /* Fig. steep: level lines, the circle of unit directions coloured by the directional derivative, and that derivative as a function of the angle. */
  const cv=document.getElementById('steep');if(!cv||!window.TB||!TB.fit)return;

  const f=(x,y)=>0.35*x*x+0.9*y*y+0.4*x*y+0.6*Math.sin(1.3*x+0.8*y);
  const grad=(x,y)=>{const c=0.6*Math.cos(1.3*x+0.8*y);return [0.7*x+0.4*y+1.3*c,1.8*y+0.4*x+0.8*c];};
  let p=[-1.1,0.9],th=2.6,geo=null;const RU=0.75;
  function draw(){
    const F=TB.fit(cv,W=>W<560?Math.round(W*1.5):Math.max(300,Math.round(W*0.5))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<560,s=sm?12:13,R=2.5;
    const side=sm?W-8:Math.min(H-8,W*0.5-12),ox=4+side/2,oy=4+side/2,sc=side/(2*R);
    const X=v=>ox+v*sc,Y=v=>oy-v*sc;

    const gL=sm?40:W*0.5+40,gR=W-12,gT=sm?side+30:22,gB=H-30;
    const g=grad(p[0],p[1]),gn=Math.hypot(g[0],g[1]),ga=Math.atan2(g[1],g[0]);
    const A=TB.axes(c,{L:gL,T:gT,R:gR,B:gB,x0:0,x1:360,y0:-6,y1:6,xt:[0,90,180,270,360],yt:[-6,-3,0,3,6],s:s,xl:[['угол ','r'],['u','i'],[', °','r']],yl:[['∂','m'],['u','s'],['f','i'],['(','m'],['x','i'],[')','m']]},K);
    c.strokeStyle=TB.rgba(K.rule,0.9);c.beginPath();c.moveTo(gL,A.Y(0));c.lineTo(gR,A.Y(0));c.stroke();
    const deg=a=>((a*180/Math.PI)%360+360)%360;
    c.strokeStyle=TB.rgba(K.ink,0.45);c.setLineDash([4,4]);c.beginPath();c.moveTo(A.X(deg(ga)),gT);c.lineTo(A.X(deg(ga)),gB);c.stroke();c.setLineDash([]);
    TB.tag(c,[['∇','m'],['f','i']],A.X(deg(ga))+4,gT+s+2,s,K.ink,K);
    [gn,-gn].forEach(v=>{c.strokeStyle=TB.rgba(K.muted,0.6);c.setLineDash([2,4]);c.beginPath();c.moveTo(gL,A.Y(v));c.lineTo(gR,A.Y(v));c.stroke();c.setLineDash([]);});
    c.lineWidth=2.2;for(let i=0;i<360;i++){const a0=i,a1=i+1,v0=gn*Math.cos(a0*Math.PI/180-ga),v1=gn*Math.cos(a1*Math.PI/180-ga);
      c.strokeStyle=(v0+v1)>0?K.warm:K.eth;c.beginPath();c.moveTo(A.X(a0),A.Y(v0));c.lineTo(A.X(a1),A.Y(v1));c.stroke();}
    const du=gn*Math.cos(th-ga);TB.dot(c,A.X(deg(th)),A.Y(du),K.muted,K,6);
    // left (or upper) panel: level lines
    c.save();c.beginPath();c.rect(ox-side/2,oy-side/2,side,side);c.clip();
    const lv=[];for(let k=-0.8;k<=8;k+=0.4)lv.push(k);
    TB.contours(c,f,-R,R,-R,R,X,Y,lv,80,()=>{c.strokeStyle=TB.rgba(K.ink,0.25);c.lineWidth=1;});
    const P=[X(p[0]),Y(p[1])],r=RU*sc;
    for(let i=0;i<120;i++){const a0=i/120*2*Math.PI,a1=(i+1)/120*2*Math.PI,cs=Math.cos((a0+a1)/2-ga);
      c.strokeStyle=TB.rgba(cs>0?K.warm:K.eth,0.25+0.75*Math.abs(cs));c.lineWidth=6;c.beginPath();c.arc(P[0],P[1],r,-a1,-a0);c.stroke();}
    c.restore();
    const gl=Math.min(1.3,0.35+gn*0.3)*sc;
    TB.arrow(c,P[0],P[1],P[0]+Math.cos(ga)*gl,P[1]-Math.sin(ga)*gl,K.ink,2.4);
    TB.tag(c,[['∇','m'],['f','i'],['(','m'],['x','i'],[')','m']],P[0]+Math.cos(ga)*(gl+16),P[1]-Math.sin(ga)*(gl+16)+s*0.4,s,K.ink,K,'center');
    TB.arrow(c,P[0],P[1],P[0]+Math.cos(th)*r,P[1]-Math.sin(th)*r,K.muted,2.4);
    TB.ring(c,P[0]+Math.cos(th)*r,P[1]-Math.sin(th)*r,K.muted,K,5);
    TB.tag(c,[['u','i']],P[0]+Math.cos(th)*(r+14),P[1]-Math.sin(th)*(r+14)+s*0.4,s+1,K.muted,K,'center');
    TB.dot(c,P[0],P[1],K.ink,K,5);
    geo={X:X,Y:Y,sc:sc,ux:v=>(v-ox)/sc,uy:v=>(oy-v)/sc,side:side,ox:ox,oy:oy,A:A,gT:gT,gB:gB,gL:gL,gR:gR};
    let phi=((th-ga)*180/Math.PI)%360;if(phi>180)phi-=360;if(phi<-180)phi+=360;
    fx.innerHTML=TB.rows([['‖∇<i>f</i>(<i>x</i>)‖ = '+TB.fmt(gn,2)+',','угол между <i>u</i> и градиентом '+Math.round(Math.abs(phi))+'°'],['∂<sub><i>u</i></sub><i>f</i>(<i>x</i>) = ‖∇<i>f</i>(<i>x</i>)‖ cos φ = '+TB.fmt(du,2)]]);
  }
  const redraw=TB.raf(draw);
  TB.drag(cv,{hit:(x,y,t)=>{if(!geo)return null;const tol=t?24:12,P=[geo.X(p[0]),geo.Y(p[1])],r=RU*geo.sc,U=[P[0]+Math.cos(th)*r,P[1]-Math.sin(th)*r];
      if(Math.hypot(x-U[0],y-U[1])<tol)return 'u';if(Math.hypot(x-P[0],y-P[1])<tol)return 'p';
      if(x>=geo.gL&&x<=geo.gR&&y>=geo.gT&&y<=geo.gB)return 'g';return null;},
    move:(h,x,y)=>{if(h==='p'){p=[Math.max(-2,Math.min(2,geo.ux(x))),Math.max(-2,Math.min(2,geo.uy(y)))];}
      else if(h==='u'){const P=[geo.X(p[0]),geo.Y(p[1])];th=Math.atan2(P[1]-y,x-P[0]);}
      else{const a=(x-geo.gL)/(geo.gR-geo.gL)*360;th=Math.max(0,Math.min(360,a))*Math.PI/180;}redraw();}});
  draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Fig. grad3d: the graph of f over the plane, a point x dragged over the floor, the tangent plane z = f(x) + <grad f(x), h> at the point above it and the gradient on the floor and on the tangent plane. */
  const cv=document.getElementById('grad3d');if(!cv||!window.TB||!TB.V3)return;
  const V=TB.V3,fx=document.getElementById('g3Fx');
  const f=(x,y)=>0.35*x*x+0.9*y*y+0.4*x*y+0.6*Math.sin(1.3*x+0.8*y);
  const grad=(x,y)=>{const c=0.6*Math.cos(1.3*x+0.8*y);return [0.7*x+0.4*y+1.3*c,1.8*y+0.4*x+0.8*c];};
  const R=1.8,SX=0.66,SZ=0.2,ZB=-1.4,ZC=-0.2;            /* world: (SX x, SX y, SZ f − ZC); the floor is the plane z = ZB */
  const Wp=(x,y,z)=>[SX*x,SX*y,z-ZC],S=(x,y)=>Wp(x,y,SZ*f(x,y));
  let p=[-1.0,0.7],geo=null;const st={yaw:-0.75,pitch:0.42,dist:9},ST0={yaw:st.yaw,pitch:st.pitch,dist:st.dist};
  const m=V.mesh(S,{u0:-R,u1:R,v0:-R,v1:R,nu:44,nv:44});
  /* level lines of f on the floor: marching squares on an n×n grid, segments in (x,y) */
  function iso(c0,n){const out=[],h=2*R/n,val=[];for(let j=0;j<=n;j++){val.push([]);for(let i=0;i<=n;i++)val[j].push(f(-R+i*h,-R+j*h)-c0);}
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=[val[j][i],val[j][i+1],val[j+1][i+1],val[j+1][i]],P=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]],pts=[];
      for(let e=0;e<4;e++){const a=v[e],b=v[(e+1)%4];if((a<0)!==(b<0)){const t=a/(a-b),A=P[e],B=P[(e+1)%4];pts.push([-R+h*(A[0]+(B[0]-A[0])*t),-R+h*(A[1]+(B[1]-A[1])*t)]);}}
      if(pts.length>=2)out.push([pts[0],pts[1]]);if(pts.length===4)out.push([pts[2],pts[3]]);}
    return out;}
  const LV=[];for(let k=-0.4;k<=6;k+=0.5)LV.push(k);
  const floorSegs=[].concat(...LV.map(c0=>iso(c0,60))).map(([a,b])=>[Wp(a[0],a[1],ZB+ZC),Wp(b[0],b[1],ZB+ZC)]);
  const base=(x,y)=>Wp(x,y,ZB+ZC);
  let cam=null;
  function draw(){
    const F=TB.fit(cv,W=>W<560?Math.round(W*1.1):Math.round(W*0.66)),c=F.c,W=F.W,H=F.H,K=TB.cols(),sm=W<560,s=sm?12:13;
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    /* the scale is fitted once, to the box around the scene in the starting view, so that turning the view does not zoom it */
    if(!geo||geo.W!==W||geo.H!==H){let fmax=-1e9,fmin=1e9;for(const q of m.P){fmax=Math.max(fmax,q[2]);fmin=Math.min(fmin,q[2]);}
      const c0=V.camera(ST0,W,H,0,0,1),pts=[];for(const a of [-R,R])for(const b of [-R,R])for(const zz of [fmax,ZB])pts.push(c0.P([SX*a,SX*b,zz]));
      const x0=Math.min(...pts.map(q=>q[0])),x1=Math.max(...pts.map(q=>q[0])),y0=Math.min(...pts.map(q=>q[1])),y1=Math.max(...pts.map(q=>q[1]));
      const sc=Math.min((W-16)/(x1-x0),(H-16)/(y1-y0));geo={W:W,H:H,sc:sc,cx:W/2-sc*(x0+x1)/2,cy:H/2-sc*(y0+y1)/2};}
    cam=V.camera(st,W,H,geo.cx,geo.cy,geo.sc);
    const x=p[0],y=p[1],z=f(x,y),g=grad(x,y),gn=Math.hypot(g[0],g[1]),P=S(x,y),B=base(x,y);
    const items=[];
    items.push({t:'patch',p:base(0,0),e1:[SX,0,0],e2:[0,SX,0],h:R,n:8,fill:K.muted,alpha:0.1,bias:-0.05,edge:TB.rgba(K.muted,0.6)});
    items.push({t:'segs',s:floorSegs,col:TB.rgba(K.ink,0.28),w:1,bias:-0.02});
    items.push({t:'segs',s:iso(z,90).map(([a,b])=>[base(a[0],a[1]),base(b[0],b[1])]),col:K.ink,w:1.8,bias:0});
    items.push({t:'segs',s:iso(z,90).map(([a,b])=>[S(a[0],a[1]),S(b[0],b[1])]),col:K.ink,w:1.6,bias:0.04});
    items.push({t:'mesh',m:m,col:K.eth,grid:4,gridA:0.16,alpha:0.88});
    /* the tangent plane: p + a·e1 + b·e2 with e1, e2 the images of the unit shifts along the axes */
    const e1=[SX,0,SZ*g[0]],e2=[0,SX,SZ*g[1]];
    items.push({t:'patch',p:P,e1:e1,e2:e2,h:0.5,n:1,fill:K.sage,alpha:0.45,edge:K.sage,top:true});
    items.push({t:'line',pts:[B,P],col:TB.rgba(K.ink,0.6),w:1.2,dash:[4,4],ghost:0.5});
    const k=gn>0?Math.min(0.5,0.9/gn):0;
    if(gn>1e-3){items.push({t:'arrow',p:B,v:[SX*g[0]*k,SX*g[1]*k,0],col:K.warm,w:2.4});
      items.push({t:'arrow',p:P,v:[SX*g[0]*k,SX*g[1]*k,SZ*gn*gn*k],col:K.warm,w:2.2,top:true});}
    items.push({t:'pt',p:P,fill:K.ink,r:4,top:true});
    items.push({t:'pt',p:B,fill:K.warm,r:6.5});
    V.render(c,cam,items,K);
    /* labels of the two arrows, placed past their tips */
    const lab=(q,segs)=>{const Q=cam.P(q);TB.tag(c,segs,Q[0]+8,Q[1]-6,s,K.ink,K);};
    if(gn>1e-3){lab([B[0]+SX*g[0]*k,B[1]+SX*g[1]*k,B[2]],[['∇','m'],['f','i'],['(','m'],['x','i'],[')','m']]);}
    const Bq=cam.P(B);TB.tag(c,[['x','i']],Bq[0]-18,Bq[1]+16,s+1,K.warm,K);
    geo.B=Bq;
    const sg=v=>(v<0?' − ':' + ')+TB.fmt(Math.abs(v),2);
    fx.innerHTML=TB.rows([
      ['<i>x</i> = ('+TB.fmt(x,2)+', '+TB.fmt(y,2)+'),','<i>f</i>(<i>x</i>) = '+TB.fmt(z,3)],
      ['∇<i>f</i>(<i>x</i>) = ('+TB.fmt(g[0],2)+', '+TB.fmt(g[1],2)+'),','‖∇<i>f</i>(<i>x</i>)‖ = '+TB.fmt(gn,2)],
      (()=>{const eq='<i>z</i> = '+TB.fmt(z,2)+sg(g[0])+'·<i>h</i><sub>1</sub>'+sg(g[1])+'·<i>h</i><sub>2</sub>';return sm?['касательная плоскость:',eq]:['касательная плоскость: '+eq];})()]);
  }
  const redraw=TB.raf(draw);
  /* the floor point under the pointer: Newton's method for the projection of (x, y) on the floor */
  function floorAt(sx,sy){let x=p[0],y=p[1];const h=1e-4;
    for(let it=0;it<8;it++){const q=cam.P(base(x,y)),qx=cam.P(base(x+h,y)),qy=cam.P(base(x,y+h)),a=(qx[0]-q[0])/h,b=(qy[0]-q[0])/h,cc=(qx[1]-q[1])/h,d=(qy[1]-q[1])/h,det=a*d-b*cc;
      if(Math.abs(det)<1e-9)break;x+=(d*(sx-q[0])-b*(sy-q[1]))/det;y+=(-cc*(sx-q[0])+a*(sy-q[1]))/det;}
    return [Math.max(-R+0.05,Math.min(R-0.05,x)),Math.max(-R+0.05,Math.min(R-0.05,y))];}
  cv.style.touchAction='none';cv.style.cursor='grab';
  V.interact(cv,st,{active:()=>true,grab:(x,y)=>geo&&Math.hypot(x-geo.B[0],y-geo.B[1])<18,
    move:(x,y)=>{p=floorAt(x,y);redraw();},redraw:redraw});
  draw();V.intro(st,redraw);TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
