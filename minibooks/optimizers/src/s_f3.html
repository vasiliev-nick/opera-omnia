<script>
(function(){
  /* Fig. dirs: histogram of cosines between random directions in R^d and a fixed unit vector, filled one direction at a time. */
  const cv=document.getElementById('dirs');if(!cv||!window.TB||!TB.fit)return;
  const sd=document.getElementById('drD'),od=document.getElementById('drDOut'),fx=document.getElementById('drFx');
  const NB=40,rnd=TB.rng(7);let d=10,cnt=new Array(NB).fill(0),n=0,s2=0,big=0,ymax=1;
  /* the largest expected bin density: c = cos(phi) with phi distributed with density proportional to sin^(d-2) on [0, pi] */
  function expectMax(d){const M=6000,lw=[];let mx=-Infinity;
    for(let i=0;i<M;i++){const p=(i+0.5)/M*Math.PI,l=(d-2)*Math.log(Math.sin(p));lw.push(l);if(l>mx)mx=l;}
    const w=lw.map(l=>Math.exp(l-mx)),tot=w.reduce((a,b)=>a+b,0),bin=new Array(NB).fill(0);
    for(let i=0;i<M;i++){const c=Math.cos((i+0.5)/M*Math.PI),b=Math.min(NB-1,Math.floor((c+1)/2*NB));bin[b]+=w[i]/tot;}
    return Math.max(...bin)*NB/2;}
  function reset(){d=Math.round(Math.pow(10,+sd.value));od.textContent='d = '+d.toLocaleString('ru-RU');cnt.fill(0);n=0;s2=0;big=0;ymax=expectMax(d)*1.6;pl.stop();left=0;if(run)run.disabled=false;draw();}
  function add(){let q=0;const x1=TB.gauss(rnd);q=x1*x1;for(let i=1;i<d;i++){const g=TB.gauss(rnd);q+=g*g;}
    const c=x1/Math.sqrt(q);cnt[Math.min(NB-1,Math.floor((c+1)/2*NB))]++;n++;s2+=c*c;if(Math.abs(c)>=0.1)big++;}
  function draw(){
    const F=TB.fit(cv,W=>Math.max(250,Math.min(360,Math.round(W*0.47)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:13,yt=[];const st=ymax>20?10:ymax>8?4:ymax>3?1:0.5;for(let v=0;v<=ymax;v+=st)yt.push(+v.toFixed(2));
    const A=TB.axes(c,{L:sm?36:46,T:16,R:W-10,B:H-28,x0:-1,x1:1,y0:0,y1:ymax,xt:[-1,-0.5,0,0.5,1],yt:yt,s:s,
      xl:[['косинус ','r'],['c','i']],yl:[['плотность','r']]},K);
    const bw=(A.X(1)-A.X(-1))/NB;
    if(n>0)for(let b=0;b<NB;b++){if(!cnt[b])continue;const h=cnt[b]/n*NB/2,x=A.X(-1+2*b/NB);
      c.fillStyle=TB.rgba(K.eth,0.55);c.fillRect(x+0.5,A.Y(Math.min(h,ymax)),Math.max(1,bw-1),A.Y(0)-A.Y(Math.min(h,ymax)));}
    const e=1/Math.sqrt(d);c.strokeStyle=K.warm;c.lineWidth=1.6;c.setLineDash([6,4]);c.beginPath();
    [-e,e].forEach(v=>{c.moveTo(A.X(v),A.Y(0));c.lineTo(A.X(v),A.Y(ymax));});c.stroke();c.setLineDash([]);
    TB.tag(c,[['±1/√','r'],['d','i']],Math.min(W-60,A.X(e)+6),A.Y(ymax)+s+4,s,K.warm,K);
    fx.innerHTML=TB.rows([['направлений: '+n],['средний квадрат косинуса '+(n?TB.fmt(s2/n,4):'—')+',','по теореме 1/<i>d</i> = '+TB.fmt(1/d,4)],['доля направлений с |<i>c</i>| ≥ 0,1: '+(n?TB.fmt(big/n,3):'—')]]);
  }
  /* one batch at a time: the button is off until the current 500 directions are drawn */
  const run=document.getElementById('drRun');
  let left=0;const pl=TB.player(()=>{const k=Math.min(left,10);for(let i=0;i<k;i++)add();left-=k;draw();if(left<=0)run.disabled=false;return left>0;},40);
  run.addEventListener('click',()=>{if(left>0)return;left=500;run.disabled=true;pl.start();});
  document.getElementById('drReset').addEventListener('click',reset);
  sd.addEventListener('input',reset);reset();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Fig. anneal: Metropolis walk on a 301-node grid with neighbour proposals; the Boltzmann distribution and the histogram of visits. */
  const cv=document.getElementById('anneal');if(!cv||!window.TB||!TB.fit)return;
  const sT=document.getElementById('anT'),oT=document.getElementById('anTOut'),fx=document.getElementById('anFx');
  const N=301,NB=50,f=t=>2.4*(t-0.6)**2-0.42*Math.cos(2*Math.PI*4.6*(t-0.66))-0.12*Math.cos(2*Math.PI*11*(t-0.2))-0.2*Math.exp(-(((t-0.657)/0.05)**2));
  const v=[];for(let i=0;i<N;i++)v.push(f(i/(N-1)));
  let gmin=0;for(let i=1;i<N;i++)if(v[i]<v[gmin])gmin=i;
  let bl=gmin,br=gmin;while(bl>0&&v[bl-1]>v[bl])bl--;while(br<N-1&&v[br+1]>v[br])br++;
  const START=64,rnd=TB.rng(11);
  let mode=TB.seg1(cv.closest('figure').querySelector('.seg'),k=>{mode=k;reset();});
  let start=START,pos=START,T=1,visits=new Array(N).fill(0),steps=0,inW=0,last=null,geo=null;
  const T0=()=>Math.pow(10,+sT.value);
  function boltz(T){const m=Math.min(...v),w=v.map(x=>Math.exp(-(x-m)/T)),z=w.reduce((a,b)=>a+b,0);return w.map(x=>x/z);}
  function reset(){pl.stop();pos=start;last=null;T=T0();oT.textContent='T = '+TB.fmt(T,T<0.1?3:2);visits.fill(0);steps=0;inW=0;draw();}
  /* one Metropolis step; the last proposal is kept so that a single step can be explained */
  function step(keep){const sh=(rnd()<0.5?-1:1)*(1+Math.floor(rnd()*10)),y=pos+sh,L={from:pos,to:y,sh:sh,T:T};
    if(y<0||y>=N){L.edge=true;L.acc=false;}
    else{const dl=v[y]-v[pos];L.dl=dl;if(dl<=0)L.acc=true;else{L.p=Math.exp(-dl/T);L.u=rnd();L.acc=L.u<L.p;}if(L.acc)pos=y;}
    visits[pos]++;steps++;if(pos>=bl&&pos<=br)inW++;last=keep?L:null;}
  const coolT=()=>{const t0=T0();return t0*Math.pow(0.01/t0,Math.min(1,steps/60000));};
  function draw(){
    const F=TB.fit(cv,W=>Math.max(330,Math.min(430,Math.round(W*0.56)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:13,L=sm?40:50,R=W-10,mid=Math.round(H*0.5);
    const A=TB.axes(c,{L:L,T:12,R:R,B:mid-14,x0:0,x1:1,y0:-0.9,y1:1.1,yt:[-0.5,0,0.5,1],s:s,yl:[['f','i']]},K);
    c.strokeStyle=TB.rgba(K.eth,0.10);c.fillStyle=TB.rgba(K.eth,0.07);c.fillRect(A.X(bl/(N-1)),12,A.X(br/(N-1))-A.X(bl/(N-1)),mid-26);
    c.strokeStyle=K.ink;c.lineWidth=2;c.beginPath();v.forEach((y,i)=>{const X=A.X(i/(N-1)),Y=A.Y(y);i?c.lineTo(X,Y):c.moveTo(X,Y);});c.stroke();
    if(last&&!last.edge){const x1=A.X(last.from/(N-1)),y1=A.Y(v[last.from]),x2=A.X(last.to/(N-1)),y2=A.Y(v[last.to]),col=last.acc?K.sage:K.muted;
      c.setLineDash(last.acc?[]:[4,4]);c.strokeStyle=col;c.lineWidth=1.6;c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo((x1+x2)/2,Math.min(y1,y2)-26,x2,y2);c.stroke();c.setLineDash([]);
      TB.ring(c,x2,y2,col,K,5);if(!last.acc)TB.dot(c,x1,y1,K.muted,K,3);}
    TB.dot(c,A.X(pos/(N-1)),A.Y(v[pos]),K.warm,K,6);
    if(!steps){c.strokeStyle=TB.rgba(K.warm,0.6);c.lineWidth=1;c.beginPath();c.moveTo(A.X(pos/(N-1)),A.Y(v[pos])+9);c.lineTo(A.X(pos/(N-1)),mid-14);c.stroke();
      TB.tag(c,[['старт','r']],A.X(pos/(N-1)),mid-18,s-1,K.warm,K,'center');}
    geo={X:A.X,top:12,bot:mid-14,L:L,R:R};
    // lower panel: square-root scale of the share per bin
    const B2=H-28,T2=mid+14,Y2=p=>B2-Math.sqrt(Math.max(0,p))*(B2-T2);
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,T2);c.lineTo(L,B2);c.lineTo(R,B2);c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';
    [0,0.05,0.25,0.5,1].forEach(p=>{c.beginPath();c.moveTo(L-4,Y2(p));c.lineTo(L,Y2(p));c.stroke();c.fillText(TB.tickLabel(p),L-7,Y2(p)+s*0.35);});
    c.textAlign='center';[0,0.25,0.5,0.75,1].forEach(t=>{c.fillText(TB.tickLabel(t),A.X(t),B2+s+5);});c.textAlign='start';
    
    const pi=boltz(T),pb=new Array(NB).fill(0),hb=new Array(NB).fill(0),bi=i=>Math.min(NB-1,Math.floor(i/(N-1)*NB));
    for(let i=0;i<N;i++){pb[bi(i)]+=pi[i];hb[bi(i)]+=steps?visits[i]/steps:0;}
    const bw=(R-L)/NB;
    c.fillStyle=TB.rgba(K.eth,0.22);c.strokeStyle=K.eth;c.lineWidth=2;c.beginPath();c.moveTo(L,B2);
    for(let b=0;b<NB;b++){c.lineTo(L+b*bw,Y2(pb[b]));c.lineTo(L+(b+1)*bw,Y2(pb[b]));}c.lineTo(R,B2);c.closePath();c.fill();c.stroke();
    if(steps)for(let b=0;b<NB;b++){if(!hb[b])continue;c.fillStyle=TB.rgba(K.warm,0.75);const w=bw*0.5;c.fillRect(L+b*bw+bw*0.25,Y2(hb[b]),w,B2-Y2(hb[b]));}
    TB.legend(c,[{k:'fill',col:K.eth,a:0.35,t:[['ожидаемая доля ∝ exp(−','r'],['f','i'],['(','r'],['x','i'],[')/','r'],['T','i'],[')','r']]},{k:'fill',col:K.warm,a:0.75,t:[['доля времени блуждания','r']]}],L+10,R,T2-6,s-1);
    let pw=0;for(let i=bl;i<=br;i++)pw+=pi[i];
    oT.textContent='T = '+TB.fmt(T,T<0.1?3:2);
    const rows=[['шагов: '+steps.toLocaleString('ru-RU')+',','<i>T</i> = '+TB.fmt(T,T<0.1?3:2)],
      ['в самой глубокой яме: доля времени '+(steps?TB.fmt(inW/steps,2):'—')+',','по Больцману '+TB.fmt(pw,2)]];
    if(last){const sh='предложен сдвиг на '+(last.sh>0?'+':'−')+Math.abs(last.sh)+' '+TB.plural(Math.abs(last.sh),'узел','узла','узлов')+':';
      if(last.edge)rows.push([sh,'за край отрезка, предложение отклонено,','точка стоит на месте']);
      else if(last.dl<=0)rows.push([sh,'<i>f</i> уменьшилась на '+TB.fmt(-last.dl,3)+',','спуск принимается всегда — переход']);
      else rows.push([sh,'<i>f</i> выросла на Δ = '+TB.fmt(last.dl,3)+',','принять с вероятностью <i>e</i><sup>−Δ/<i>T</i></sup> = '+TB.fmt(last.p,3)+';',
        'выпало <i>u</i> = '+TB.fmt(last.u,3)+(last.acc?' &lt; ':' ≥ ')+TB.fmt(last.p,3)+' — '+(last.acc?'переход':'точка остаётся на месте')]);}
    fx.innerHTML=TB.rows(rows);
  }
  const PER={cool:600,const:1000};
  const pl=TB.player(()=>{if(mode==='cool'){const t0=T0(),K=60000;for(let i=0;i<PER.cool;i++){T=t0*Math.pow(0.01/t0,Math.min(1,steps/K));step();}draw();return steps<60000;}
    for(let i=0;i<PER.const;i++)step();draw();return steps<100000;},40);
  document.getElementById('anRun').addEventListener('click',()=>{reset();pl.start();});
  document.getElementById('anStep').addEventListener('click',()=>{pl.stop();if(mode==='cool')T=coolT();step(true);draw();});
  /* a click on the upper graph moves the starting point there */
  cv.addEventListener('click',e=>{if(!geo)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(y<geo.top||y>geo.bot||x<geo.L||x>geo.R)return;start=Math.max(0,Math.min(N-1,Math.round((x-geo.L)/(geo.R-geo.L)*(N-1))));reset();});
  document.getElementById('anReset').addEventListener('click',reset);
  sT.addEventListener('input',reset);reset();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Fig. markov: 400 independent walkers on a three-state chain; their shares against mu_0 P^k and the stationary distribution. */
  const cv=document.getElementById('markov');if(!cv||!window.TB||!TB.fit)return;
  const bS=document.getElementById('mkStep'),bR=document.getElementById('mkRun'),fx=document.getElementById('mkFx');
  const P=[[0.6,0.3,0.1],[0.2,0.5,0.3],[0.2,0.4,0.4]],PI=[9/27,11/27,7/27],NM=['A','B','C'],N=400;
  const rnd=TB.rng(11);
  /* each walker: state, previous state, its own offset inside the cloud of a node */
  const W=[];for(let i=0;i<N;i++){const a=rnd()*2*Math.PI,r=Math.sqrt(rnd());W.push({s:0,p:0,ox:r*Math.cos(a),oy:r*Math.sin(a),px:0,py:0});}
  let mu=[1,0,0],k=0,t=1,left=0,geo=null;
  function place(st){for(const w of W){w.s=st;w.p=st;}mu=[0,0,0];mu[st]=1;k=0;t=1;left=0;bS.disabled=false;bR.disabled=false;draw();}
  function step(){for(const w of W){w.p=w.s;let u=rnd(),j=0;while(j<2&&u>=P[w.s][j]){u-=P[w.s][j];j++;}w.s=j;
      const a=rnd()*2*Math.PI,r=Math.sqrt(rnd());w.px=w.ox;w.py=w.oy;w.ox=r*Math.cos(a);w.oy=r*Math.sin(a);}
    mu=[0,1,2].map(y=>mu[0]*P[0][y]+mu[1]*P[1][y]+mu[2]*P[2][y]);k++;t=0;}
  const pl=TB.player(()=>{t=Math.min(1,t+1/14);if(t>=1){if(left>0){left--;step();}else{draw();bS.disabled=false;bR.disabled=false;return false;}}draw();return true;},30);
  function go(n){if(!bS.disabled){bS.disabled=true;bR.disabled=true;left=n-1;step();pl.start();}}
  bS.addEventListener('click',()=>go(1));bR.addEventListener('click',()=>go(20));
  const ease=u=>u<0.5?2*u*u:1-2*(1-u)*(1-u);
  function draw(){
    const F=TB.fit(cv,Wd=>Wd>=600?380:Math.round(Math.min(Wd,380)*0.8)+250),c=F.c,Wd=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,Wd,H);
    const wide=Wd>=600,s=wide?14:12,col=[K.eth,K.warm,K.sage];
    /* left: the graph */
    const G=wide?Math.min(420,Math.round(Wd*0.55)):Wd,GH=wide?H:Math.round(Math.min(Wd,380)*0.8);
    const cx=G/2,cy=GH/2+(wide?14:10),R=Math.min(G*0.29,GH*0.33),nr=Math.max(26,R*0.27);
        const pos=[[cx-R*0.95,cy+R*0.5],[cx,cy-R*0.62],[cx+R*0.95,cy+R*0.5]];
    geo={pos:pos,nr:nr};
    /* arrows between nodes: x -> y bends to the right of the direction */
    const bend=(a,b,off)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;return [(a[0]+b[0])/2+nx*off,(a[1]+b[1])/2+ny*off];};
    const qpt=(a,m,b,u)=>[(1-u)*(1-u)*a[0]+2*(1-u)*u*m[0]+u*u*b[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*m[1]+u*u*b[1]];
    const off=R*0.22;
    c.lineWidth=1.4;
    for(let x=0;x<3;x++)for(let y=0;y<3;y++){if(x===y)continue;
      const a=pos[x],b=pos[y],m=bend(a,b,off);
      /* trim the curve at both node circles */
      let u0=0,u1=1;for(let i=0;i<=40;i++){const u=i/40,p=qpt(a,m,b,u);if(Math.hypot(p[0]-a[0],p[1]-a[1])<nr+4)u0=u;}
      for(let i=40;i>=0;i--){const u=i/40,p=qpt(a,m,b,u);if(Math.hypot(p[0]-b[0],p[1]-b[1])<nr+6)u1=u;}
      c.strokeStyle=TB.rgba(K.ink,0.45);c.beginPath();for(let i=0;i<=30;i++){const p=qpt(a,m,b,u0+(u1-u0)*i/30);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);}c.stroke();
      const e=qpt(a,m,b,u1),e0=qpt(a,m,b,u1-0.1);c.fillStyle=TB.rgba(K.ink,0.6);{const an=Math.atan2(e[1]-e0[1],e[0]-e0[0]),hd=9;c.beginPath();c.moveTo(e[0],e[1]);c.lineTo(e[0]-hd*Math.cos(an-0.38),e[1]-hd*Math.sin(an-0.38));c.lineTo(e[0]-hd*Math.cos(an+0.38),e[1]-hd*Math.sin(an+0.38));c.closePath();c.fill();}
      const lp=qpt(a,m,b,0.5),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
      TB.tag(c,[[TB.fmt(P[x][y],1),'r']],lp[0]-dy/L*13,lp[1]+dx/L*13+s*0.35,s-1,K.muted,K,'center');}
    /* self-loops, drawn outward from the centre */
    for(let x=0;x<3;x++){const p=pos[x],dx=p[0]-cx,dy=p[1]-(cy-R*0.04),L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,lc=[p[0]+ux*(nr+14),p[1]+uy*(nr+14)];
      c.strokeStyle=TB.rgba(K.ink,0.45);c.beginPath();c.arc(lc[0],lc[1],15,0,7);c.stroke();
      TB.tag(c,[[TB.fmt(P[x][x],1),'r']],lc[0]+(ux>0.3?27:ux<-0.3?-27:0),lc[1]+(Math.abs(ux)>0.3?s*0.35+12:-22),s-1,K.muted,K,'center');}
    /* nodes */
    for(let x=0;x<3;x++){c.fillStyle=TB.rgba(col[x],0.12);c.strokeStyle=col[x];c.lineWidth=2;c.beginPath();c.arc(pos[x][0],pos[x][1],nr,0,7);c.fill();c.stroke();}
    /* walkers */
    const e=ease(t);
    c.fillStyle=TB.rgba(K.ink,0.75);
    for(const w of W){const a=[pos[w.p][0]+w.px*nr*0.82,pos[w.p][1]+w.py*nr*0.82],b=[pos[w.s][0]+w.ox*nr*0.82,pos[w.s][1]+w.oy*nr*0.82];
      let q;if(w.p===w.s||t>=1)q=[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e];else{const m=bend(pos[w.p],pos[w.s],off);q=qpt(a,m,b,e);}
      if(t>=1)q=b;c.beginPath();c.arc(q[0],q[1],1.9,0,7);c.fill();}
    for(let x=0;x<3;x++){if(x===1)TB.tag(c,[[NM[x],'i']],pos[x][0]-nr-8,pos[x][1]-nr*0.55,s+2,col[x],K,'right');else TB.tag(c,[[NM[x],'i']],pos[x][0],pos[x][1]-nr-8,s+2,col[x],K,'center');}
    /* right: shares */
    const cnt=[0,0,0];if(t>=1)for(const w of W)cnt[w.s]++;else for(const w of W)cnt[e<0.5?w.p:w.s]++;
    let L0,T0,R0,B0;if(wide){L0=G+44;T0=18;R0=Wd-10;B0=H-46;}else{L0=40;T0=GH+14;R0=Wd-10;B0=H-46;}
    const A=TB.axes(c,{L:L0,T:T0,R:R0,B:B0,x0:0,x1:3,y0:0,y1:1.12,yt:[0,0.25,0.5,0.75,1],s:s-1,yl:[['доля','r']]},K);
    const bw=(A.X(1)-A.X(0))*0.5;
    for(let x=0;x<3;x++){const xm=A.X(x+0.5);
      c.fillStyle=TB.rgba(col[x],0.55);const h=cnt[x]/N;c.fillRect(xm-bw/2,A.Y(h),bw,A.Y(0)-A.Y(h));
      c.strokeStyle=col[x];c.lineWidth=1.6;c.strokeRect(xm-bw/2-3,A.Y(mu[x]),bw+6,A.Y(0)-A.Y(mu[x]));
      c.strokeStyle=K.ink;c.lineWidth=1.4;c.setLineDash([5,4]);c.beginPath();c.moveTo(xm-bw/2-12,A.Y(PI[x]));c.lineTo(xm+bw/2+12,A.Y(PI[x]));c.stroke();c.setLineDash([]);
      TB.rich(c,[[NM[x],'i']],xm,B0+s+5,s+1,col[x],'center');}
    TB.legend(c,[{k:'fill',col:K.muted,a:0.5,t:[['доли частиц','r']]},{k:'thin',col:K.muted,t:[['μ','i'],['k','s']]},{k:'dash',col:K.ink,t:[['π','i']]}],L0,R0,B0+s+12,s-1);
    /* readout: the matrix and the numbers */
    const m='<span style="display:inline-grid;grid-template-columns:auto auto auto;gap:0 .9em;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:6px;padding:0 .45em;vertical-align:middle;text-align:right">'+P.flat().map(v=>'<span>'+TB.fmt(v,1)+'</span>').join('')+'</span>';
    const v3=a=>'('+a.map(z=>TB.fmt(z,3)).join('; ')+')';
    fx.innerHTML=TB.rows([['<i>P</i> = '+m],['шаг <i>k</i> = '+k,'доли частиц '+v3(cnt.map(z=>z/N))],['μ<sub><i>k</i></sub> = μ<sub>0</sub><i>P</i><sup><i>k</i></sup> = '+v3(mu)],['π = '+v3(PI),'π<i>P</i> = '+v3([0,1,2].map(y=>PI[0]*P[0][y]+PI[1]*P[1][y]+PI[2]*P[2][y]))]]);
  }
  const redraw=TB.raf(draw);
  TB.drag(cv,{hit:(px,py,tc)=>{if(!geo||bS.disabled)return null;for(let x=0;x<3;x++)if(Math.hypot(px-geo.pos[x][0],py-geo.pos[x][1])<geo.nr+(tc?10:2))return x;return null;},
    move:(h)=>{if(W[0].s!==h||k>0||!W.every(w=>w.s===h))place(h);},cursor:'pointer'});
  place(0);TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Fig. rsearch: random search with two probes x +- sigma*u on the winding ravine of fig. fog; one step at a time, with an explanation. */
  const cv=document.getElementById('rsearch');if(!cv||!window.TB||!TB.fit)return;
  const sS=document.getElementById('rsS'),oS=document.getElementById('rsSOut'),fx=document.getElementById('rsFx');
  const sn=x=>0.7*Math.sin(1.5*x+0.3),ds=x=>1.05*Math.cos(1.5*x+0.3);
  const f=(x,y)=>1.6*(y-sn(x))**2+0.035*(x-2.3)**2+0.06*Math.exp(-((x+0.6)**2+(y+0.9)**2));
  const grad=(x,y)=>{const e=y-sn(x),b=0.06*Math.exp(-((x+0.6)**2+(y+0.9)**2));return [-3.2*e*ds(x)+0.07*(x-2.3)-2*(x+0.6)*b,3.2*e-2*(y+0.9)*b];};
  const X0=[-1.4,1.1],rnd=TB.rng(13);
  let path=[X0.slice()],last=null,geo=null,img=null,imgKey='';
  let fmin=Infinity;for(let i=0;i<=600;i++){const x=-3+6*i/600;fmin=Math.min(fmin,f(x,sn(x)));}
  const lev=v=>Math.log(v-fmin+0.004);
  function heat(K,n,ym){const key=K.paper+K.eth+n+ym;if(img&&imgKey===key)return img;
    const lo=lev(fmin),hi=lev(f(-3,-ym));
    img=TB.heat(n,(i,j)=>{const x=-3+6*(i+0.5)/n,y=-ym+2*ym*(j+0.5)/n;const t=Math.max(0,Math.min(1,(lev(f(x,y))-lo)/(hi-lo)));return TB.mixa(K.eth,K.paper,0.06+0.94*Math.pow(t,1.5));});
    imgKey=key;return img;}
  function step(){const p=path[path.length-1],sg=+sS.value,a=rnd()*2*Math.PI,u=[Math.cos(a),Math.sin(a)];
    const pp=[p[0]+sg*u[0],p[1]+sg*u[1]],pm=[p[0]-sg*u[0],p[1]-sg*u[1]],f0=f(p[0],p[1]),fp=f(pp[0],pp[1]),fm=f(pm[0],pm[1]);
    const g=grad(p[0],p[1]),gn=Math.hypot(g[0],g[1]),cs=gn>0?-(u[0]*g[0]+u[1]*g[1])/gn:0,pg=gn>0?[p[0]-sg*g[0]/gn,p[1]-sg*g[1]/gn]:p.slice();
    let to=null;if(Math.min(fp,fm)<f0)to=fp<=fm?'+':'-';
    last={p:p,pp:pp,pm:pm,f0:f0,fp:fp,fm:fm,c:cs,pg:pg,fg:f(pg[0],pg[1]),to:to,sg:sg};
    path.push(to==='+'?pp:to==='-'?pm:p.slice());}
  function draw(){
    oS.textContent=TB.fmt(+sS.value,2);
    const F=TB.fit(cv,W=>Math.max(250,Math.round(W*0.56))),c=F.c,W=F.W,H=F.H,K=TB.cols(),sm=W<520,s=sm?12:13;
    const ym=3*H/W,X=x=>(x+3)/6*W,Y=y=>H/2-y/ym*H/2;geo={ux:x=>x/W*6-3,uy:y=>(H/2-y)/(H/2)*ym,ym:ym};
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);c.imageSmoothingEnabled=true;c.drawImage(heat(K,180,ym),0,0,W,H);
    const levels=[];for(let k=-5;k<=1.2;k+=0.55)levels.push(fmin+Math.exp(k));
    TB.contours(c,f,-3,3,-ym,ym,X,Y,levels,90,()=>{c.strokeStyle=TB.rgba(K.ink,0.22);c.lineWidth=1;});
    const m=[X(2.3),Y(sn(2.3))];c.strokeStyle=K.ink;c.lineWidth=1.6;c.beginPath();c.moveTo(m[0]-5,m[1]-5);c.lineTo(m[0]+5,m[1]+5);c.moveTo(m[0]+5,m[1]-5);c.lineTo(m[0]-5,m[1]+5);c.stroke();
    c.strokeStyle=TB.rgba(K.warm,0.85);c.lineWidth=1.6;c.beginPath();path.forEach((q,i)=>{i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1]));});c.stroke();
    if(last){const L=last;
      TB.arrow(c,X(L.p[0]),Y(L.p[1]),X(L.pg[0]),Y(L.pg[1]),K.ink,1.8);
      c.strokeStyle=K.ink;c.lineWidth=1.3;c.setLineDash([4,4]);c.beginPath();c.moveTo(X(L.pm[0]),Y(L.pm[1]));c.lineTo(X(L.pp[0]),Y(L.pp[1]));c.stroke();c.setLineDash([]);
      [['+',L.pp],['-',L.pm]].forEach(([k,q])=>{TB.ring(c,X(q[0]),Y(q[1]),L.to===k?K.sage:K.muted,K,5);});}
    const p=path[path.length-1];TB.dot(c,X(p[0]),Y(p[1]),K.warm,K,6);
    const k=path.length-1,rows=[['шагов: '+k+',','<i>f</i>(<i>x</i>) = '+TB.fmt(f(p[0],p[1]),3)]];
    if(last){const L=last;
      const cb=L.fp<=L.fm?L.c:-L.c;rows.push(['косинус угла между сдвигом к лучшей пробе','и антиградиентом: '+TB.fmt(cb,2)]);
      rows.push(['<i>f</i>(<i>x</i>) = '+TB.fmt(L.f0,3)+',','<i>f</i>(<i>x</i> + σ<i>u</i>) = '+TB.fmt(L.fp,3)+',','<i>f</i>(<i>x</i> − σ<i>u</i>) = '+TB.fmt(L.fm,3)]);
      rows.push([L.to?('переход в <i>x</i> '+(L.to==='+'?'+':'−')+' σ<i>u</i>: там меньше, выигрыш '+TB.fmt(L.f0-Math.min(L.fp,L.fm),3)):'обе пробы не ниже <i>x</i> — точка остаётся на месте',
        'шаг σ против градиента дал бы '+TB.fmt(L.f0-L.fg,3)]);}
    fx.innerHTML=TB.rows(rows);
  }
  let left=0;const pl=TB.player(()=>{if(left<=0)return false;step();left--;draw();return left>0;},110);
  document.getElementById('rsStep').addEventListener('click',()=>{pl.stop();step();draw();});
  document.getElementById('rsRun').addEventListener('click',()=>{left=20;pl.start();});
  document.getElementById('rsReset').addEventListener('click',()=>{pl.stop();path=[path[0].slice()];last=null;draw();});
  cv.addEventListener('click',e=>{if(!geo)return;const r=cv.getBoundingClientRect();let u=geo.ux(e.clientX-r.left),v=geo.uy(e.clientY-r.top);
    u=Math.max(-2.95,Math.min(2.95,u));v=Math.max(-geo.ym+0.05,Math.min(geo.ym-0.05,v));pl.stop();path=[[u,v]];last=null;draw();});
  sS.addEventListener('input',()=>{oS.textContent=TB.fmt(+sS.value,2);});
  draw();TB.onTheme(()=>{img=null;draw();});TB.onResize(cv,()=>{img=null;draw();});
})();
</script>
