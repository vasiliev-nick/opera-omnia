<script>
(function(){
  /* Helpers for this book: random numbers, pointer dragging, redraw throttling, dots and arrows, toggle groups, the theme switch. */
  const TB=window.TB;if(!TB)return;
  TB.rng=function(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};};
  /* A standard normal number from a uniform generator (Box–Muller). */
  TB.gauss=r=>{let u=0;while(u<1e-12)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
  TB.plural=(n,a,b,c)=>{const m=n%100,k=n%10;return (m>10&&m<20)?c:k===1?a:(k>=2&&k<=4)?b:c;};
  TB.vec=(v,d)=>'('+v.map(x=>TB.fmt(x,d===undefined?2:d)).join('; ')+')';
  /* Dragging: o.hit(x,y,touch) returns a handle or null, o.move(handle,x,y) updates the state. A touch that starts on a handle does not scroll the page. */
  TB.drag=function(cv,o){
    let h=null;
    const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
    cv.addEventListener('pointerdown',e=>{const p=pos(e);h=o.hit(p[0],p[1],e.pointerType==='touch');if(h===null)return;
      try{cv.setPointerCapture(e.pointerId);}catch(_){}cv.style.cursor='grabbing';e.preventDefault();o.move(h,p[0],p[1]);});
    cv.addEventListener('pointermove',e=>{const p=pos(e);
      if(h!==null){o.move(h,p[0],p[1]);return;}
      if(e.pointerType==='mouse')cv.style.cursor=o.hit(p[0],p[1],false)!==null?(o.cursor||'grab'):'default';});
    const end=()=>{if(h!==null){h=null;cv.style.cursor='default';if(o.end)o.end();}};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
    cv.addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;const r=cv.getBoundingClientRect();
      if(o.hit(t.clientX-r.left,t.clientY-r.top,true)!==null)e.preventDefault();},{passive:false});
  };
  /* Redraw at most once per frame. */
  TB.raf=fn=>{let q=false;return ()=>{if(q)return;q=true;requestAnimationFrame(()=>{q=false;fn();});};};
  /* A step-by-step animation: tick() returns false when done; a new start cancels the previous run. */
  TB.player=function(tick,ms){let id=0;return {start(){const my=++id;let last=0;
      const f=t=>{if(my!==id)return;if(t-last>=(ms||60)){last=t;if(tick()===false){id++;return;}}requestAnimationFrame(f);};requestAnimationFrame(f);},
    stop(){id++;},get on(){return false;}};};
  TB.dot=function(c,x,y,col,K,r){c.fillStyle=K.paper;c.beginPath();c.arc(x,y,(r||6)+2.5,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x,y,r||6,0,7);c.fill();};
  TB.ring=function(c,x,y,col,K,r){c.fillStyle=K.paper;c.beginPath();c.arc(x,y,(r||6),0,7);c.fill();c.strokeStyle=col;c.lineWidth=2;c.stroke();};
  TB.arrow=function(c,x1,y1,x2,y2,col,w){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1),hd=Math.min(11,L*0.45);
    if(L<0.5)return;
    c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w||2;c.setLineDash([]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-hd*0.7*Math.cos(a),y2-hd*0.7*Math.sin(a));c.stroke();
    c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-hd*Math.cos(a-0.4),y2-hd*Math.sin(a-0.4));c.lineTo(x2-hd*Math.cos(a+0.4),y2-hd*Math.sin(a+0.4));c.closePath();c.fill();};
  /* One group of toggle buttons. */
  TB.seg1=function(el,fn){const b=[...el.querySelectorAll('button')];
    b.forEach(e=>e.addEventListener('click',()=>{b.forEach(o=>o.setAttribute('aria-pressed',o===e?'true':'false'));fn(e.dataset.k);}));
    const on=b.find(e=>e.getAttribute('aria-pressed')==='true');return on?on.dataset.k:b[0].dataset.k;};
  /* A label with a light backing so that it stays readable over curves. */
  TB.tag=function(c,segs,x,y,s,col,K,align){const w=TB.richW(c,segs,s);let x0=align==='center'?x-w/2:align==='right'?x-w:x;
    c.fillStyle=TB.rgba(K.paper,0.86);c.fillRect(x0-3,y-s-1,w+6,s+6);TB.rich(c,segs,x0,y,s,col);return w;};
  /* Axes with ticks: returns maps X, Y. o = {L,T,R,B,x0,x1,y0,y1,xt,yt,xl,yl,s}. */
  TB.axes=function(c,o,K){const X=v=>o.L+(v-o.x0)/(o.x1-o.x0)*(o.R-o.L),Y=v=>o.B-(v-o.y0)/(o.y1-o.y0)*(o.B-o.T),s=o.s||13;
    c.strokeStyle=K.rule;c.lineWidth=1;c.setLineDash([]);c.beginPath();c.moveTo(o.L,o.T);c.lineTo(o.L,o.B);c.lineTo(o.R,o.B);c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;
    if(o.xt){c.textAlign='center';for(const v of o.xt){c.beginPath();c.moveTo(X(v),o.B);c.lineTo(X(v),o.B+4);c.stroke();c.fillText(TB.tickLabel(v),X(v),o.B+s+5);}}
    if(o.yt){c.textAlign='right';for(const v of o.yt){c.beginPath();c.moveTo(o.L-4,Y(v));c.lineTo(o.L,Y(v));c.stroke();c.fillText(TB.tickLabel(v),o.L-7,Y(v)+s*0.35);}}
    c.textAlign='start';
    if(o.xl)TB.rich(c,o.xl,o.R,o.B-6,s,K.muted,'right');
    if(o.yl)TB.rich(c,o.yl,o.L+6,o.T+s,s,K.muted);
    return {X:X,Y:Y};};
  /* Level lines of f on a rectangle by marching squares. X, Y map the plane to the canvas; n cells per side. */
  TB.contours=function(c,f,x0,x1,y0,y1,X,Y,levels,n,style){
    const nx=n,ny=n,dx=(x1-x0)/nx,dy=(y1-y0)/ny,v=new Float64Array((nx+1)*(ny+1));
    for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++)v[j*(nx+1)+i]=f(x0+i*dx,y0+j*dy);
    for(let li=0;li<levels.length;li++){const lv=levels[li];style(li,lv);c.beginPath();
      for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
        const a=v[j*(nx+1)+i]-lv,b=v[j*(nx+1)+i+1]-lv,cc=v[(j+1)*(nx+1)+i+1]-lv,d=v[(j+1)*(nx+1)+i]-lv;
        const P=[];const xa=x0+i*dx,ya=y0+j*dy;
        if((a>0)!==(b>0))P.push([xa+dx*a/(a-b),ya]);
        if((b>0)!==(cc>0))P.push([xa+dx,ya+dy*b/(b-cc)]);
        if((cc>0)!==(d>0))P.push([xa+dx*d/(d-cc),ya+dy]);
        if((d>0)!==(a>0))P.push([xa,ya+dy*a/(a-d)]);
        for(let k=0;k+1<P.length;k+=2){c.moveTo(X(P[k][0]),Y(P[k][1]));c.lineTo(X(P[k+1][0]),Y(P[k+1][1]));}}
      c.stroke();}
    c.setLineDash([]);};
})();
</script>
<script>
(function(){
  /* Theme switch: a round button above the glossary; the choice is remembered in this browser when storage is available. */
  const b=document.querySelector('.tbtn');if(!b)return;const R=document.documentElement;
  try{const t=localStorage.getItem('opt-theme');if(t==='dark'||t==='light')R.setAttribute('data-theme',t);}catch(e){}
  const cur=()=>R.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const lab=()=>b.setAttribute('aria-label',cur()==='dark'?'Включить светлую тему':'Включить тёмную тему');lab();
  b.addEventListener('click',()=>{const n=cur()==='dark'?'light':'dark';R.setAttribute('data-theme',n);lab();try{localStorage.setItem('opt-theme',n);}catch(e){}});
})();
</script>
<script>
(function(){
  /* A display formula a little wider than the column (on a phone) is scaled down to fit, but not below 72%; longer ones are split into lines in the source. */
  function fit(){document.querySelectorAll('.math-wrap').forEach(w=>{const m=w.querySelector('mjx-container');if(!m)return;m.style.fontSize='';
    const r=w.scrollWidth/w.clientWidth;if(r>1.005)m.style.fontSize=Math.max(72,Math.floor(100/r))+'%';});}
  const go=()=>{fit();let t=0;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(fit,150);});};
  const wait=()=>{if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(go);else setTimeout(wait,100);};wait();
})();
</script>
