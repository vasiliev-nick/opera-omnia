<script>
(function(){
  /* Fig. mom: gradient descent, the heavy ball and Nesterov's method on f = ((x.q1)^2/kappa + (x.q2)^2)/2, L = 1, mu = 1/kappa, the flat axis q1 turned by -20 degrees; trajectories and log f by steps. */
  const cv=document.getElementById('mom');if(!cv||!window.TB||!TB.fit)return;
  const sK=document.getElementById('momK'),oK=document.getElementById('momKOut'),sB=document.getElementById('momB'),oB=document.getElementById('momBOut'),fx=document.getElementById('momFx');
  const ANG=-20*Math.PI/180,q1=[Math.cos(ANG),Math.sin(ANG)],q2=[-Math.sin(ANG),Math.cos(ANG)],NS=120;
  let x0=[-2.45,1.16],shown=NS,geo=null;
  const kap=()=>Math.pow(10,+sK.value);
  const fq=(p,k)=>{const a=p[0]*q1[0]+p[1]*q1[1],b=p[0]*q2[0]+p[1]*q2[1];return 0.5*(a*a/k+b*b);};
  const grad=(p,k)=>{const a=(p[0]*q1[0]+p[1]*q1[1])/k,b=p[0]*q2[0]+p[1]*q2[1];return [a*q1[0]+b*q2[0],a*q1[1]+b*q2[1]];};
  /* largest modulus of the roots of r^2 - s r + p = 0; the heavy ball takes the longest step (1 + sqrt(beta))^2 / L at which the steep direction still decays by sqrt(beta) */
  const rmax=(s,p)=>{const D=s*s-4*p;return D>=0?Math.max(Math.abs((s+Math.sqrt(D))/2),Math.abs((s-Math.sqrt(D))/2)):Math.sqrt(p);};
  function par(k,beta){const mu=1/k;return {mu:mu,egd:1,ehb:Math.pow(1+Math.sqrt(beta),2),ens:1,beta:beta};}
  function runs(k,P){const gd=[x0.slice()],hb=[x0.slice()],ns=[x0.slice()];
    let a=x0.slice(),b=x0.slice(),bp=x0.slice(),n=x0.slice(),np=x0.slice();
    for(let i=0;i<NS;i++){
      let g=grad(a,k);a=[a[0]-P.egd*g[0],a[1]-P.egd*g[1]];gd.push(a);
      g=grad(b,k);const b2=[b[0]-P.ehb*g[0]+P.beta*(b[0]-bp[0]),b[1]-P.ehb*g[1]+P.beta*(b[1]-bp[1])];bp=b;b=b2;hb.push(b);
      const y=[n[0]+P.beta*(n[0]-np[0]),n[1]+P.beta*(n[1]-np[1])];g=grad(y,k);np=n;n=[y[0]-P.ens*g[0],y[1]-P.ens*g[1]];ns.push(n);}
    return [gd,hb,ns];}
  function rates(k,P){let hb=0,ns=0;for(let i=0;i<=200;i++){const l=P.mu+(1-P.mu)*i/200;
      hb=Math.max(hb,rmax(1+P.beta-P.ehb*l,P.beta));const t=1-P.ens*l;ns=Math.max(ns,rmax(t*(1+P.beta),t*P.beta));}
    return [1-1/k,hb,ns];}
  function draw(){
    const k=kap(),beta=+sB.value,P=par(k,beta);oK.textContent='κ = '+TB.fmt(k,k<10?1:0);oB.textContent=TB.fmt(beta,2);
    const F=TB.fit(cv,W=>W<560?Math.round(W*1.3):Math.max(300,Math.round(W*0.5))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<560,s=sm?12:13,R=3,pw=sm?W-8:W*0.52,ph=sm?Math.round((W-8)*0.62):H-8,sc=Math.min(pw/(2*R),ph/(2*R*0.62)),ox=4+pw/2,oy=4+ph/2;
    const X=v=>ox+v*sc,Y=v=>oy-v*sc;geo={ux:p=>(p-ox)/sc,uy:p=>(oy-p)/sc,X:X,Y:Y};
    c.save();c.beginPath();c.rect(4,4,pw,ph);c.clip();
    c.fillStyle=TB.rgba(K.eth,0.04);c.fillRect(4,4,pw,ph);
    for(const v of [0.005,0.02,0.08,0.2,0.45,0.9,1.6,2.6,4]){c.beginPath();c.ellipse(ox,oy,Math.sqrt(2*v*k)*sc,Math.sqrt(2*v)*sc,-ANG,0,7);c.strokeStyle=TB.rgba(K.ink,0.25);c.lineWidth=1;c.stroke();}
    const tr=runs(k,P),cols=[K.warm,K.eth,K.sage],m=Math.min(shown,NS);
    tr.forEach((T,j)=>{c.strokeStyle=cols[j];c.lineWidth=j?2:1.6;c.beginPath();
      for(let i=0;i<=m;i++){const p=[X(T[i][0]),Y(T[i][1])];i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);}c.stroke();
      for(let i=1;i<=Math.min(m,40);i++){c.fillStyle=cols[j];c.beginPath();c.arc(X(T[i][0]),Y(T[i][1]),2.1,0,7);c.fill();}});
    c.restore();
    c.strokeStyle=K.ink;c.lineWidth=1.4;c.beginPath();c.moveTo(ox-4,oy-4);c.lineTo(ox+4,oy+4);c.moveTo(ox+4,oy-4);c.lineTo(ox-4,oy+4);c.stroke();
    TB.dot(c,X(x0[0]),Y(x0[1]),K.ink,K,6);TB.tag(c,[['x','i'],['0','s']],X(x0[0])+9,Y(x0[1])-9,s+1,K.ink,K);
    const gL=sm?44:W*0.52+56,gR=W-12,gB=H-30;
    const lgB=TB.legend(c,[{k:'line',col:K.warm,t:[['спуск','r']]},{k:'line',col:K.eth,t:[['тяжёлый шар','r']]},{k:'line',col:K.sage,t:[['Нестеров','r']]}],gL,gR,sm?ph+10:6,s-1);
    const A=TB.axes(c,{L:gL,T:lgB+14,R:gR,B:gB,x0:0,x1:NS,y0:-14,y1:2,xt:[0,40,80,120],yt:[-12,-8,-4,0],s:s,xl:[['шаг ','r'],['k','i']],yl:[['lg ','r'],['f','i']]},K);
    c.save();c.beginPath();c.rect(gL,lgB+14,gR-gL,gB-lgB-14);c.clip();
    tr.forEach((T,j)=>{c.strokeStyle=cols[j];c.lineWidth=2;c.beginPath();
      for(let i=0;i<=m;i++){const y=A.Y(Math.max(-15,Math.min(3,Math.log10(Math.max(1e-300,fq(T[i],k))))));i?c.lineTo(A.X(i),y):c.moveTo(A.X(i),y);}c.stroke();});
    c.restore();
    const r=rates(k,P),best=Math.pow((Math.sqrt(k)-1)/(Math.sqrt(k)+1),2);
    const steps=v=>v<1?Math.ceil(Math.log(1e-6)/(2*Math.log(v))).toLocaleString('ru-RU'):'∞';
    fx.innerHTML=TB.rows([['множитель за шаг:','спуск '+TB.fmt(r[0],3)+',','тяжёлый шар '+TB.fmt(r[1],3)+',','Нестеров '+TB.fmt(r[2],3)],
      ['шагов до <i>f</i> &lt; 10⁻⁶·<i>f</i>(<i>x</i><sub>0</sub>):','примерно '+steps(r[0])+', '+steps(r[1])+', '+steps(r[2])+','],['наилучшее <i>β</i> = '+TB.fmt(best,3)]]);
  }
  const pl=TB.player(()=>{shown+=2;draw();return shown<NS;},40);
  const full=()=>{pl.stop();shown=NS;draw();};
  document.getElementById('momRun').addEventListener('click',()=>{shown=0;draw();pl.start();});
  document.getElementById('momBest').addEventListener('click',()=>{const k=kap();sB.value=Math.min(0.99,Math.pow((Math.sqrt(k)-1)/(Math.sqrt(k)+1),2)).toFixed(2);full();});
  const redraw=TB.raf(draw);
  TB.drag(cv,{hit:(px,py,t)=>{if(!geo)return null;return Math.hypot(px-geo.X(x0[0]),py-geo.Y(x0[1]))<(t?26:14)?1:null;},
    move:(h,px,py)=>{pl.stop();shown=NS;x0=[Math.max(-2.9,Math.min(2.9,geo.ux(px))),Math.max(-1.75,Math.min(1.75,geo.uy(py)))];redraw();}});
  sK.addEventListener('input',full);sB.addEventListener('input',full);draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
