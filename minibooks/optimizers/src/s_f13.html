<script>
(function(){
  /* Fig. shampoo: the Shampoo statistics R, L and their Kronecker product next to the full-matrix AdaGrad matrix S, accumulated example by example. */
  const cv=document.getElementById('shampoo');if(!cv||!window.TB||!TB.fit)return;
  const fx=document.getElementById('shFx');
  const Ax=[[1.4,0,0,0],[0.9,0.6,0,0],[0,0.3,0.5,0],[0.2,0,0.4,0.3]],Ad=[[1.0,0,0],[-0.7,0.5,0],[0.3,0.3,0.35]],M=[[1,-1,0,0.5],[0,1,1,0],[0.5,0,-1,1]];
  const NMAX=300;let mode=TB.seg1(cv.closest('figure').querySelector('.seg'),k=>{mode=k;full();}),S,L,R,N=0,rnd;
  const mv=(A,v)=>A.map(r=>r.reduce((s,a,j)=>s+a*v[j],0));
  const zero=(a,b)=>Array.from({length:a},()=>new Float64Array(b));
  function reset(){S=zero(12,12);L=zero(3,3);R=zero(4,4);N=0;rnd=TB.rng(mode==='ind'?11:12);}
  function add(){const z4=[0,1,2,3].map(()=>TB.gauss(rnd)),x=mv(Ax,z4);
    const d=mode==='ind'?mv(Ad,[0,1,2].map(()=>TB.gauss(rnd))):mv(M,x).map(v=>0.6*v+0.25*TB.gauss(rnd));
    const g=[];for(let b=0;b<4;b++)for(let a=0;a<3;a++)g.push(d[a]*x[b]);
    for(let i=0;i<12;i++)for(let j=0;j<12;j++)S[i][j]+=g[i]*g[j];
    const xx=x.reduce((s,v)=>s+v*v,0),dd=d.reduce((s,v)=>s+v*v,0);
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)L[i][j]+=xx*d[i]*d[j];
    for(let i=0;i<4;i++)for(let j=0;j<4;j++)R[i][j]+=dd*x[i]*x[j];N++;}
  const kron=()=>{const K=zero(12,12);for(let i=0;i<12;i++)for(let j=0;j<12;j++)K[i][j]=R[Math.floor(i/3)][Math.floor(j/3)]*L[i%3][j%3];return K;};
  const fro=A=>Math.sqrt(A.reduce((s,r)=>s+r.reduce((t,v)=>t+v*v,0),0));
  function draw(){
    const F=TB.fit(cv,W=>W<560?Math.round(26+16*4+44+12*Math.min(13,Math.floor((W-44)/24))+12):34+12*16+16),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<560,s=sm?12:13,c1=16,c2=sm?Math.min(13,Math.floor((W-44)/24)):16;
    const KR=kron();
    const heat=(A,x0,y0,cs,title)=>{const n=A.length;let mx=1e-12;A.forEach(r=>r.forEach(v=>mx=Math.max(mx,Math.abs(v))));
      for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=A[i][j]/mx;c.fillStyle=TB.rgba(v>=0?K.warm:K.eth,0.06+0.8*Math.sqrt(Math.abs(v)));c.fillRect(x0+j*cs,y0+i*cs,cs-1,cs-1);}
      c.strokeStyle=K.rule;c.lineWidth=1;c.strokeRect(x0-0.5,y0-0.5,n*cs,n*cs);
      if(n===12){c.strokeStyle=TB.rgba(K.ink,0.5);for(let k=1;k<4;k++){c.beginPath();c.moveTo(x0+3*k*cs-0.5,y0);c.lineTo(x0+3*k*cs-0.5,y0+12*cs);c.moveTo(x0,y0+3*k*cs-0.5);c.lineTo(x0+12*cs,y0+3*k*cs-0.5);c.stroke();}}
      TB.rich(c,title,x0+n*cs/2,y0-9,s+1,K.ink,'center');};
    const sym=(t,x,y)=>{c.fillStyle=K.ink;c.font=(s+4)+'px '+TB.serif;c.textAlign='center';c.fillText(t,x,y);c.textAlign='start';};
    if(!sm){const g=26,tw=4*c1+g+3*c1+g+12*c2+40+12*c2,x0=Math.round((W-tw)/2),yb=34,ym=yb+6*c2;
      heat(R,x0,ym-2*c1,c1,[['R','i']]);sym('⊗',x0+4*c1+g/2,ym+5);heat(L,x0+4*c1+g,ym-1.5*c1,c1,[['L','i']]);sym('=',x0+7*c1+1.5*g,ym+5);
      const xk=x0+7*c1+2*g;heat(KR,xk,yb,c2,[['R','i'],[' ⊗ ','r'],['L','i']]);heat(S,xk+12*c2+40,yb,c2,[['S','i'],[' (AdaGrad)','r']]);if(mode==='ind')sym('≈',xk+12*c2+20,ym+5);}
    else{const g=24,tw=4*c1+g+3*c1,x0=Math.round((W-tw)/2),y1=26;heat(R,x0,y1,c1,[['R','i']]);sym('⊗',x0+4*c1+g/2,y1+2*c1+5);heat(L,x0+4*c1+g,y1+0.5*c1,c1,[['L','i']]);
      const y2=y1+4*c1+44,xk=Math.round((W-24*c2-20)/2);heat(KR,xk,y2,c2,[['R','i'],[' ⊗ ','r'],['L','i']]);heat(S,xk+12*c2+20,y2,c2,[['S','i']]);}
    const a=fro(S),b=fro(KR);let e=0;for(let i=0;i<12;i++)for(let j=0;j<12;j++)e+=(S[i][j]/a-KR[i][j]/b)**2;
    fx.innerHTML=TB.rows([['примеров: '+N+',','расхождение <i>S</i> и <i>R</i> ⊗ <i>L</i>: '+(N?TB.fmt(Math.sqrt(e),3):'—')]]);
  }
  function full(){pl.stop();reset();while(N<NMAX)add();draw();}
  const pl=TB.player(()=>{const k=N<30?1:N<100?2:5;for(let i=0;i<k&&N<NMAX;i++)add();draw();return N<NMAX;},60);
  document.getElementById('shRun').addEventListener('click',()=>{reset();draw();pl.start();});
  full();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
