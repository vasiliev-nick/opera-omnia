<script>
(function(){
  /* Fig. sky1: the skyline of surprise; columns of width p_x and height log2(1/p_x), area = entropy. */
  const cv=document.getElementById('sky1');if(!cv||!window.TB||!TB.fit)return;
  const g=new TB.Gauge('gSky1');
  const INIT={2:[0.7,0.3],3:[0.5,0.3,0.2],5:[0.35,0.25,0.2,0.12,0.08]};
  let n=+TB.segs(cv,k=>{n=+k;P=INIT[n].slice();draw();}),P=INIT[n].slice(),geo=null;
  const CAP=6;

    const F=TB.fit(cv,W=>Math.max(300,Math.min(400,Math.round(W*0.52)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);

    const xs=TB.strip(c,P,L,R,sy,sh,K.eth,K,s,[['p','i']]);geo={L:L,R:R,sy:sy,sh:sh,xs:xs};
    const T=sy+sh+(sm?34:40),B=H-(sm?26:30),X=u=>L+u*(R-L),Y=v=>B-v/(CAP+0.4)*(B-T);
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,T-6);c.lineTo(L,B);c.lineTo(R,B);for(let v=0;v<=CAP;v++){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));}c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';for(let v=0;v<=CAP;v+=sm?2:1)c.fillText(String(v),L-7,Y(v)+s*0.35);c.textAlign='start';
    TB.rich(c,[['бит','r']],L-7,T-12,s,K.muted,'right');
    let u=0,Hp=0;const labs=[];
    for(let i=0;i<n;i++){const w=P[i],h=Math.log2(1/w),hc=Math.min(h,CAP);Hp+=w*h;
      c.fillStyle=TB.rgba(K.eth,i%2?0.2:0.32);c.fillRect(X(u),Y(hc),X(u+w)-X(u),B-Y(hc));
      c.strokeStyle=K.eth;c.lineWidth=1.6;c.strokeRect(X(u),Y(hc),X(u+w)-X(u),B-Y(hc));
      const mid=(X(u)+X(u+w))/2,cw=X(u+w)-X(u);
      if(h>CAP)labs.push([TB.fmt(h,1),mid,Y(CAP)-5]);else if(cw>s*2.4)labs.push([TB.fmt(h,2),mid,Y(hc)-5]);
      if(cw>s){c.fillStyle=K.muted;c.font=(s-1)+'px '+TB.ui;c.textAlign='center';c.fillText(String(i+1),mid,B+s+5);c.textAlign='start';}
      u+=w;}
    c.setLineDash([6,4]);c.strokeStyle=K.ink;c.lineWidth=1.3;c.beginPath();c.moveTo(L,Y(Hp));c.lineTo(R,Y(Hp));c.stroke();c.setLineDash([]);
    const hl=[['H','i'],['(','m'],['p','i'],[')','m']],hw=TB.richW(c,hl,s);
    c.fillStyle=TB.rgba(K.paper,0.85);c.fillRect(R-hw-8,Y(Hp)-s-6,hw+8,s+4);TB.rich(c,hl,R-4,Y(Hp)-6,s,K.ink,'right');
    c.font=(s-1)+'px '+TB.ui;c.textAlign='center';
    for(const [t,x,y] of labs){const w=c.measureText(t).width;c.fillStyle=TB.rgba(K.paper,0.85);c.fillRect(x-w/2-3,y-s+1,w+6,s+1);c.fillStyle=K.ink;c.fillText(t,x,y-1);}
    c.textAlign='start';
    g.set(Hp);g.mark('m',Math.log2(n),'log<sub>2</sub> '+n);
  }
  TB.drag(cv,{hit:(x,y,t)=>{if(!geo)return null;const tol=t?16:8;if(y<geo.sy-tol||y>geo.sy+geo.sh+tol)return null;
      let best=null,bd=tol;geo.xs.forEach((d,j)=>{const e=Math.abs(x-d);if(e<bd){bd=e;best=j;}});return best;},
    move:(j,x)=>{TB.moveDiv(P,j,(x-geo.L)/(geo.R-geo.L),0.01);draw();},cursor:'ew-resize'});
  draw();TB.onTheme(draw);TB.onResize(cv,draw);

</script>
<script>
(function(){
  /* Fig. sky2: two skylines over the same widths p_x; heights log2(1/p_x) and log2(1/q_x); the signed area between them is D(p||q). */
  const cv=document.getElementById('sky2');if(!cv||!window.TB||!TB.fit)return;
  const g1=new TB.Gauge('gSk2a'),g2=new TB.Gauge('gSk2b'),g3=new TB.Gauge('gSk2c');
  const P=[0.4,0.3,0.15,0.1,0.05],Q=[0.25,0.35,0.25,0.05,0.1];let geo=null,CAP=8;
  function draw(){
    const F=TB.fit(cv,W=>Math.max(360,Math.min(470,Math.round(W*0.6)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<520,s=sm?12:14,L=sm?38:52,R=W-(sm?10:18),sh=sm?22:26,y1=10,y2=y1+sh+(sm?14:16);
    const xp=TB.strip(c,P,L,R,y1,sh,K.eth,K,s,[['p','i']]),xq=TB.strip(c,Q,L,R,y2,sh,K.warm,K,s,[['q','i']]);
    geo={L:L,R:R,y1:y1,y2:y2,sh:sh,xp:xp,xq:xq};
    let mh=0;for(let i=0;i<P.length;i++)mh=Math.max(mh,Math.log2(1/P[i]),Math.log2(1/Q[i]));CAP=Math.max(4,Math.min(8,Math.ceil(mh+0.3)));
    const T=y2+sh+(sm?34:40),B=H-(sm?26:30),X=u=>L+u*(R-L),Y=v=>B-v/(CAP+0.4)*(B-T);
    c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,T-6);c.lineTo(L,B);c.lineTo(R,B);for(let v=0;v<=CAP;v+=2){c.moveTo(L-4,Y(v));c.lineTo(L,Y(v));}c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';for(let v=0;v<=CAP;v+=2)c.fillText(String(v),L-7,Y(v)+s*0.35);c.textAlign='start';
    TB.rich(c,[['бит','r']],L-7,T-12,s,K.muted,'right');
    let u=0,Hp=0,Hpq=0;
    for(let i=0;i<P.length;i++){const w=P[i],hp=Math.log2(1/w),hq=Math.log2(1/Q[i]);Hp+=w*hp;Hpq+=w*hq;
      const a=Math.min(hp,CAP),b=Math.min(hq,CAP),x0=X(u),x1=X(u+w),lo=Math.min(a,b),hi=Math.max(a,b);
      c.fillStyle=TB.rgba(K.muted,0.13);c.fillRect(x0,Y(lo),x1-x0,B-Y(lo));
      if(b>a){c.fillStyle=TB.rgba(K.warm,0.5);c.fillRect(x0,Y(hi),x1-x0,Y(lo)-Y(hi));}
      else if(a>b){c.fillStyle=TB.rgba(K.eth,0.38);c.fillRect(x0,Y(hi),x1-x0,Y(lo)-Y(hi));
        c.save();c.beginPath();c.rect(x0,Y(hi),x1-x0,Y(lo)-Y(hi));c.clip();c.strokeStyle=TB.rgba(K.eth,0.7);c.lineWidth=1;c.beginPath();
        for(let t=-200;t<x1-x0+200;t+=6){c.moveTo(x0+t,Y(lo));c.lineTo(x0+t+(Y(lo)-Y(hi)),Y(hi));}c.stroke();c.restore();}
      c.strokeStyle=K.eth;c.lineWidth=1.6;c.strokeRect(x0,Y(a),x1-x0,B-Y(a));
      c.strokeStyle=K.warm;c.lineWidth=2.4;c.beginPath();c.moveTo(x0,Y(b));c.lineTo(x1,Y(b));c.stroke();
      const mid=(x0+x1)/2;c.font=(s-1)+'px '+TB.ui;c.textAlign='center';
      if(hp>CAP){c.fillStyle=K.eth;c.fillText(TB.fmt(hp,1),mid,Y(CAP)-5);}
      if(hq>CAP){c.fillStyle=K.warm;c.fillText(TB.fmt(hq,1),mid,Y(CAP)-5-(hp>CAP?s+2:0));}
      if(x1-x0>s){c.fillStyle=K.muted;c.fillText(String(i+1),mid,B+s+5);}c.textAlign='start';
      u+=w;}
    const D=Hpq-Hp;
    const lg=[{k:'thin',col:K.eth,t:[['log','m'],['2','s'],[' 1/','m'],['p','i'],['x','s']]},{k:'line',col:K.warm,t:[['log','m'],['2','s'],[' 1/','m'],['q','i'],['x','s']]},
      {k:'fill',col:K.warm,a:0.5,t:[['надстройка','r']]},{k:'fill',col:K.eth,a:0.38,t:[['провал','r']]}];
    TB.legend(c,lg,L+10,R,T-(sm?26:30),s-1);
    g1.set(Hp);g2.set(Hpq);g3.set(D);
  }
  TB.drag(cv,{hit:(x,y,t)=>{if(!geo)return null;const tol=t?16:8;let row=null;
      if(Math.abs(y-(geo.y1+geo.sh/2))<geo.sh/2+tol*0.6)row='p';else if(Math.abs(y-(geo.y2+geo.sh/2))<geo.sh/2+tol*0.6)row='q';if(!row)return null;
      const xs=row==='p'?geo.xp:geo.xq;let best=null,bd=tol;xs.forEach((d,j)=>{const e=Math.abs(x-d);if(e<bd){bd=e;best=j;}});return best===null?null:[row,best];},
    move:(h,x)=>{TB.moveDiv(h[0]==='p'?P:Q,h[1],(x-geo.L)/(geo.R-geo.L),0.01);draw();},cursor:'ew-resize'});
  draw();TB.onTheme(draw);TB.onResize(cv,draw);

</script>
<script>
(function(){
  /* Fig. simplex: the triangle of distributions on three outcomes; level sets of D(p||.) or D(.||q) in bits, draggable p and q. */
  const cv=document.getElementById('simplex');if(!cv||!window.TB||!TB.fit)return;
  const fx=document.getElementById('spFx'),g1=new TB.Gauge('gSp1'),g2=new TB.Gauge('gSp2');
  let p=[0.5,0.3,0.2],q=[0.2,0.25,0.55],geo=null;
  let md=TB.segs(cv,k=>{md=k;draw();});
  const LV=[0.05,0.1,0.2,0.4,0.8,1.6];
  const kl=(a,b)=>{let s=0;for(let i=0;i<3;i++){if(a[i]<=0)continue;if(b[i]<=0)return Infinity;s+=a[i]*Math.log2(a[i]/b[i]);}return s;};
  const off=document.createElement('canvas');
  function draw(){
    const F=TB.fit(cv,W=>Math.round(Math.max(280,Math.min(520,W*0.93)))),c=F.c,W=F.W,H=F.H,K=TB.cols(),r=window.devicePixelRatio||1;
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const sm=W<440,s=sm?12:14,G=TB.tri(W,H,sm?24:28,sm?26:30,sm?22:30);geo=G;
    const bw=Math.round(W*r),bh=Math.round(H*r);off.width=bw;off.height=bh;
    const ox=off.getContext('2d'),im=ox.createImageData(bw,bh),d=im.data,idx=new Int8Array(bw*bh).fill(-1),tv=new Float32Array(bw*bh);
    const pc=TB.hex(K.paper),ec=TB.hex(K.eth),ic=TB.hex(K.ink);
    const ymin=Math.floor(G.V[2][1]*r)-1,ymax=Math.ceil(G.V[0][1]*r)+1,xmin=Math.floor(G.V[0][0]*r)-1,xmax=Math.ceil(G.V[1][0]*r)+1;
    for(let py=Math.max(0,ymin);py<Math.min(bh,ymax);py++)for(let px=Math.max(0,xmin);px<Math.min(bw,xmax);px++){
      const l=G.B((px+0.5)/r,(py+0.5)/r);if(l[0]<0||l[1]<0||l[2]<0)continue;
      const D=md==='F'?kl(p,l):kl(l,q);let k=0;while(k<LV.length&&D>LV[k])k++;const j=py*bw+px;idx[j]=k;tv[j]=isFinite(D)?1-Math.exp(-D/0.9):1;}
    for(let py=0;py<bh;py++)for(let px=0;px<bw;px++){const j=py*bw+px,k=idx[j];if(k<0)continue;const t=tv[j]*0.78;
      let col=[pc[0]+(ec[0]-pc[0])*t,pc[1]+(ec[1]-pc[1])*t,pc[2]+(ec[2]-pc[2])*t];
      const nb=[px+1<bw?idx[j+1]:k,py+1<bh?idx[j+bw]:k];
      if((nb[0]>=0&&nb[0]!==k)||(nb[1]>=0&&nb[1]!==k)){const a=0.6;col=[col[0]+(ic[0]-col[0])*a,col[1]+(ic[1]-col[1])*a,col[2]+(ic[2]-col[2])*a];}
      const o=4*j;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;}
    ox.putImageData(im,0,0);c.drawImage(off,0,0,W,H);
    c.strokeStyle=K.ink;c.lineWidth=1.4;c.beginPath();c.moveTo(G.V[0][0],G.V[0][1]);c.lineTo(G.V[1][0],G.V[1][1]);c.lineTo(G.V[2][0],G.V[2][1]);c.closePath();c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='center';
    c.fillText('1',G.V[0][0]-10,G.V[0][1]+s+2);c.fillText('2',G.V[1][0]+10,G.V[1][1]+s+2);c.fillText('3',G.V[2][0],G.V[2][1]-9);c.textAlign='start';
    const P1=G.P(p),Q1=G.P(q);
    c.setLineDash([4,4]);c.strokeStyle=K.ink;c.lineWidth=1.1;c.beginPath();c.moveTo(P1[0],P1[1]);c.lineTo(Q1[0],Q1[1]);c.stroke();c.setLineDash([]);
    TB.dot(c,P1[0],P1[1],K.eth,K,6.5);TB.dot(c,Q1[0],Q1[1],K.warm,K,6.5);
    const lab=(pt,o,txt,col)=>{const dx=pt[0]-o[0],dy=pt[1]-o[1],n=Math.hypot(dx,dy)||1;TB.rich(c,txt,pt[0]+dx/n*16,pt[1]+dy/n*16+s*0.35,s+2,col,'center');};
    lab(P1,Q1,[['p','i']],K.eth);lab(Q1,P1,[['q','i']],K.warm);
    const a=kl(p,q),b=kl(q,p);
    fx.innerHTML=TB.rows([['<i>p</i> = '+TB.vec(p),'<i>q</i> = '+TB.vec(q)]]);
    g1.set(a);g2.set(b);
  }
  const redraw=TB.raf(draw);
  TB.drag(cv,{hit:(x,y,t)=>{if(!geo)return null;const tol=t?24:12,P1=geo.P(p),Q1=geo.P(q),dp=Math.hypot(x-P1[0],y-P1[1]),dq=Math.hypot(x-Q1[0],y-Q1[1]);
      if(dp>tol&&dq>tol)return null;return dp<=dq?'p':'q';},
    move:(h,x,y)=>{const l=TB.clampSimplex(geo.B(x,y),0.01);if(h==='p')p=l;else q=l;redraw();}});
  draw();TB.onTheme(draw);TB.onResize(cv,draw);
})();
</script>
<script>
(function(){
  /* Fig. lnx: ln x lies under its tangent x-1; the gap g(x)=x-1-ln x; p-weighted centres of mass of the points t_x=q_x/p_x. */
  const cv=document.getElementById('lnx');if(!cv||!window.TB||!TB.fit)return;
  const fig=cv.closest('figure'),fx=document.getElementById('lnFx'),segEl=fig.querySelector('.seg');
  const TMIN=0.25,TMAX=2;
  let mode=TB.seg1(segEl,k=>{mode=k;showPre();redraw();}),x0=0.25,geo=null;
  let P=[0.5,0.25,0.25],Q=[1/3,1/3,1/3];
  const rnd=TB.rng(7);
  const pre=fig.querySelector('.lnpre');function showPre(){if(pre)pre.hidden=mode!=='gib';}showPre();
  function randomPQ(){for(let n=0;n<500;n++){const a=[0,1,2].map(()=>0.15+rnd()),b=[0,1,2].map(()=>0.1+rnd());
      const sa=a[0]+a[1]+a[2],sb=b[0]+b[1]+b[2],p=a.map(v=>v/sa),q=b.map(v=>v/sb);
      if(p.every((v,i)=>q[i]/v>TMIN&&q[i]/v<TMAX)&&p.some((v,i)=>Math.abs(q[i]/v-1)>0.35)){P=p;Q=q;return;}}}
  function draw(){
    const F=TB.fit(cv,W=>Math.max(340,Math.min(480,Math.round(W*0.62)))),c=F.c,W=F.W,H=F.H,K=TB.cols();
    c.fillStyle=K.paper;c.fillRect(0,0,W,H);
    const gb=mode==='gib',XA=0,XB=gb?2.2:3.2,YA=gb?-1.6:-2.7,YB=gb?1.3:2.3;
    const sm=W<520,s=sm?12:14,L=sm?30:40,R=W-(sm?12:20),T=sm?14:18,B=H-(sm?26:30);
    const X=v=>L+(v-XA)/(XB-XA)*(R-L),Y=v=>B-(v-YA)/(YB-YA)*(B-T);geo={X:X,Xi:px=>XA+(px-L)/(R-L)*(XB-XA),L:L,R:R,T:T,B:B};
    // axes and grid
    c.strokeStyle=TB.rgba(K.rule,0.6);c.lineWidth=1;c.setLineDash([2,4]);c.beginPath();
    for(let v=Math.ceil(YA);v<=YB;v++)if(v){c.moveTo(L,Y(v));c.lineTo(R,Y(v));}
    for(let v=0.5;v<XB;v+=0.5){c.moveTo(X(v),T);c.lineTo(X(v),B);}c.stroke();c.setLineDash([]);
    c.strokeStyle=K.rule;c.beginPath();c.moveTo(L,T);c.lineTo(L,B);c.moveTo(L,Y(0));c.lineTo(R,Y(0));c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';
    for(let v=Math.ceil(YA);v<=YB;v++)c.fillText(TB.fmt(v,0),L-6,Y(v)+s*0.35);
    c.textAlign='center';for(let v=1;v<XB;v++)c.fillText(String(v),X(v),Y(0)+s+5);c.textAlign='start';
    TB.rich(c,[['x','i']],R-2,Y(0)-6,s,K.muted,'right');TB.rich(c,[['y','i']],L+6,T+s,s,K.muted);
    const curve=(f,a,b)=>{c.beginPath();for(let i=0;i<=300;i++){const x=a+(b-a)*i/300,y=f(x);i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));}c.stroke();};
    const xl=Math.exp(YA);
    c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();
    // the gap function, dashed
    const g=x=>x-1-Math.log(x);
    c.strokeStyle=TB.rgba(K.eth,mode==='tan'?0.85:0.35);c.lineWidth=1.6;c.setLineDash([6,4]);curve(g,0.06,XB);c.setLineDash([]);
    c.strokeStyle=K.warm;c.lineWidth=2.2;curve(x=>x-1,XA,XB);
    c.strokeStyle=K.ink;c.lineWidth=2.2;curve(Math.log,xl,XB);
    c.restore();
    const xr=XB*(sm?0.7:0.82);TB.rich(c,[['y','i'],[' = ','m'],['x','i'],[' − 1','m']],X(xr)-6,Y(xr-1)-4,s,K.warm,'right');
    TB.rich(c,[['y','i'],[' = ln ','m'],['x','i']],X(XB*(sm?0.92:0.9)),Y(Math.log(XB*(sm?0.92:0.9)))-10,s,K.ink,'center');
    if(mode==='tan'){
      TB.rich(c,[['g','i'],['(','m'],['x','i'],[') = ','m'],['x','i'],[' − 1 − ln ','m'],['x','i']],X(0.3)+13,Y(g(0.3))-4,s,K.eth);
      if(!sm){TB.rich(c,[['g','i'],['′ < 0','m']],X(0.62)-6,Y(g(0.62))+s+6,s-1,TB.rgba(K.eth,0.85),'right');
        TB.rich(c,[['g','i'],['′ > 0','m']],X(2.05)+4,Y(g(2.05))+s+6,s-1,TB.rgba(K.eth,0.85));}
      const a=Math.log(x0),b=x0-1,gv=b-a;
      c.strokeStyle=TB.rgba(K.muted,0.5);c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(X(x0),T);c.lineTo(X(x0),B);c.stroke();c.setLineDash([]);
      c.strokeStyle=K.eth;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(X(x0),Y(a));c.lineTo(X(x0),Y(b));c.stroke();c.lineCap='butt';
      // the same length laid off from the x axis up to the dashed graph
      c.strokeStyle=TB.rgba(K.eth,0.45);c.lineWidth=4;c.beginPath();c.moveTo(X(x0)+9,Y(0));c.lineTo(X(x0)+9,Y(gv));c.stroke();
      TB.dot(c,X(x0),Y(a),K.ink,K,4.5);TB.dot(c,X(x0),Y(b),K.warm,K,4.5);TB.dot(c,X(x0)+9,Y(gv),K.eth,K,4);
      TB.dot(c,X(1),Y(0),K.ink,K,3.5);
      // handle on the x axis
      c.fillStyle=K.eth;c.beginPath();c.moveTo(X(x0),B-1);c.lineTo(X(x0)-7,B+9);c.lineTo(X(x0)+7,B+9);c.closePath();c.fill();
      const f=v=>TB.fmt(v,3);
      fx.innerHTML=TB.rows([['<i>x</i> = '+TB.fmt(x0,2)+':','ln <i>x</i> = '+f(a)+',','<i>x</i> − 1 = '+f(b)],
        ['<i>g</i>(<i>x</i>) = <i>x</i> − 1 − ln <i>x</i> = '+f(gv)+(Math.abs(x0-1)<0.005?' (точка касания)':' &gt; 0')]]);
    }else{
      const t=P.map((v,i)=>Q[i]/v),Et=t.reduce((a,v,i)=>a+P[i]*v,0),El=t.reduce((a,v,i)=>a+P[i]*Math.log(v),0);
      t.forEach((v,i)=>{c.strokeStyle=TB.rgba(K.muted,0.55);c.lineWidth=1.2;c.setLineDash([3,3]);c.beginPath();c.moveTo(X(v),Y(0));c.lineTo(X(v),Y(Math.min(Math.log(v),v-1)));c.stroke();c.setLineDash([]);
        c.strokeStyle=TB.rgba(K.eth,0.9);c.lineWidth=2.5;c.beginPath();c.moveTo(X(v),Y(Math.log(v)));c.lineTo(X(v),Y(v-1));c.stroke();});

      ring(X(Et),Y(Et-1),K.warm);ring(X(Et),Y(El),K.ink);
      const gap=Y(El)-Y(Et-1);
      TB.rich(c,[['𝔼','m'],['p','s'],['(','m'],['t','i'],[' − 1)','m']],X(Et)-14,Y(Et-1)-s-12,s,K.warm,'right');

      const f=v=>TB.fmt(v,3),f2=v=>TB.fmt(v,2);
      fx.innerHTML=TB.rows([['<i>p</i> = ('+P.map(f2).join('; ')+'),','<i>q</i> = ('+Q.map(f2).join('; ')+'),','<i>t</i> = ('+t.map(f2).join('; ')+')'],
        ['𝔼<sub><i>p</i></sub> <i>t</i> − 1 = '+f(Et-1)+',','𝔼<sub><i>p</i></sub> ln <i>t</i> = <i>H</i>(<i>p</i>) − <i>H</i>(<i>p</i>, <i>q</i>) = '+TB.nb(El)]]);

    if(k==='ex'){P=[0.5,0.25,0.25];Q=[1/3,1/3,1/3];}else if(k==='eq'){Q=P.slice();}else randomPQ();redraw();}));
  TB.drag(cv,{hit:(x,y,tc)=>{if(!geo||mode!=='tan')return null;return Math.abs(x-geo.X(x0))<(tc?22:10)&&y>geo.T-6&&y<geo.B+14?'x':null;},
    move:(h,x)=>{let v=geo.Xi(x);if(Math.abs(v-1)<0.03)v=1;x0=Math.max(0.08,Math.min(3.15,v));redraw();},cursor:'ew-resize'});

<script>
(function(){

  const qt=t=>p.map((v,i)=>(1-t)*v+t*r[i]);

    const P=G.P(p),R=G.P(r),Q=G.P(qt(t));
    c.strokeStyle=TB.rgba(K.ink,0.25);c.lineWidth=1;c.setLineDash([3,4]);c.beginPath();c.moveTo(P[0],P[1]);c.lineTo(R[0],R[1]);c.stroke();c.setLineDash([]);
    c.strokeStyle=K.ink;c.lineWidth=3;c.beginPath();c.moveTo(P[0],P[1]);c.lineTo(Q[0],Q[1]);c.stroke();

    c.strokeStyle=TB.rgba(K.ink,0.6);c.lineWidth=1.2;c.beginPath();for(const u of [0.25,0.5,0.75]){const x=P[0]+u*dx,y=P[1]+u*dy;c.moveTo(x-nx*5,y-ny*5);c.lineTo(x+nx*5,y+ny*5);}c.stroke();

    const lab=(pt,o,txt,col)=>{const ex=pt[0]-o[0],ey=pt[1]-o[1],m=Math.hypot(ex,ey)||1;TB.rich(c,txt,pt[0]+ex/m*17,pt[1]+ey/m*17+s*0.35,s+2,col,'center');};
    lab(P,R,[['p','i']],K.eth);lab(R,P,[['r','i']],K.warm);

    c.strokeStyle=K.rule;c.beginPath();c.moveTo(gx,gy);c.lineTo(gx,gy+gh);c.lineTo(gx+gw,gy+gh);c.stroke();
    c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='right';for(const v of [0,0.5,1,1.5,2])c.fillText(TB.tickLabel(v),gx-6,Y(v)+s*0.35);
    c.textAlign='center';for(const u of [0,0.25,0.5,0.75,1])c.fillText(TB.tickLabel(u),X(u),gy+gh+s+5);c.textAlign='start';
    TB.rich(c,[['t','i']],gx+gw,gy+gh-6,s,K.muted,'right');
    TB.rich(c,[['F','i'],['(','m'],['t','i'],[')','m'],[', бит','r']],gx+8,gy+s,s,K.muted);
    // tangent at 0: F'(0) = (1 - r(supp p)) / ln 2 bits
    let rs=0;for(let i=0;i<3;i++)if(p[i]>0)rs+=r[i];const d0=(1-rs)/Math.LN2;
    c.save();c.beginPath();c.rect(gx,gy-2,gw+2,gh+4);c.clip();
    c.strokeStyle=K.eth;c.lineWidth=1.5;c.setLineDash([6,4]);c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(1),Y(d0));c.stroke();c.setLineDash([]);

      TB.rich(c,[['F','i'],['(1) = ','m'],[isFinite(F1)?TB.fmt(F1,2):'+∞','m']],X(u)-8,gy+s+4,s,K.ink,'right');}
    const Ft=F(t);

    fx.innerHTML=TB.rows([['<i>p</i> = '+TB.vec(p)+',','<i>r</i> = '+TB.vec(r)+',','<i>q</i><sub><i>t</i></sub> = '+TB.vec(qt(t))],
      ['<i>F</i>(<i>t</i>) = <i>D</i><sub>KL</sub>(<i>p</i> ‖ <i>q</i><sub><i>t</i></sub>) = '+(isFinite(Ft)?TB.fmt(Ft,3):'+∞')+' бит,','<i>F</i>′(0) = '+TB.fmt(d0,3)+' бит']]);
  }
  const redraw=TB.raf(draw);
  sl.addEventListener('input',redraw);
  fig.querySelectorAll('button.act').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.pre==='ex'){p=[0.5,0.25,0.25];r=[0,0.5,0.5];}else{p=[0.5,0.3,0.2];r=[0.15,0.25,0.6];}redraw();}));
  const near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<0.04;
  TB.drag(cv,{hit:(x,y,tc)=>{if(!geo)return null;const tol=tc?24:12,d=pt=>Math.hypot(x-pt[0],y-pt[1]);
      const c=[['q',d(geo.Q)],['r',d(geo.R)],['p',d(geo.P)]].filter(e=>e[1]<tol).sort((a,b)=>a[1]-b[1]);return c.length?c[0][0]:null;},
    move:(h,x,y)=>{const G=geo.G;
      if(h==='q'){const P=geo.P,R=geo.R,dx=R[0]-P[0],dy=R[1]-P[1],L=dx*dx+dy*dy;if(L>0)sl.value=Math.max(0,Math.min(1,((x-P[0])*dx+(y-P[1])*dy)/L));}
      else{let l=G.B(x,y).map(v=>v<0.02?0:v);const tt=l.reduce((a,b)=>a+Math.max(0,b),0)||1;l=l.map(v=>Math.max(0,v)/tt);
        if(h==='p'){l=TB.clampSimplex(l,0.02);if(!near(l,r))p=l;}else if(!near(l,p))r=l;}
      redraw();},cursor:'grab'});

})();
