<script>
(function(){
  /* Small figures inside the exercises of §11: drawn on the exercise background, they show the setting, never the answer. */
  const TB=window.TB;if(!TB||!TB.fit)return;
  const KX=()=>{const K=TB.cols();K.paper=TB.tok('--warm-soft');return K;};
  const mount=(id,h,draw)=>{const cv=document.getElementById(id);if(!cv)return null;
    const run=()=>{const F=TB.fit(cv,h),c=F.c;c.clearRect(0,0,F.W,F.H);draw(c,F.W,F.H,KX(),F.W<480);};
    run();TB.onTheme(run);TB.onResize(cv,run);return run;};
  /* a coin chip: filled for heads (1), hollow for tails (0) */
  const chip=(c,x,y,r,v,K,col)=>{c.lineWidth=1.4;c.strokeStyle=col;c.fillStyle=v?col:K.paper;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.stroke();
    c.fillStyle=v?K.paper:col;c.font=Math.round(r*1.05)+'px '+TB.ui;c.textAlign='center';c.fillText(v?'Г':'Р',x,y+r*0.37);c.textAlign='start';};

  /* exvar: an independent series and a copying series of N tosses */
  (function(){
    const th=document.getElementById('exVarTh'),to=document.getElementById('exVarThOut'),bt=document.getElementById('exVarNew'),fx=document.getElementById('exVarFx');if(!th)return;
    const N=20,rnd=TB.rng(11);let U=[],U0=0;
    const roll=()=>{U=Array.from({length:N},()=>rnd());U0=rnd();};roll();
    const run=mount('exVar',W=>W<480?226:170,(c,W,H,K,sm)=>{
      const t=+th.value;to.textContent=TB.fmt(t,2);const s=sm?12:14,per=sm?10:N;
      const a=U.map(u=>u<t?1:0),h=U0<t?1:0,b=a.map(()=>h);
      const r=Math.min(13,(W-8)/per/2-1.5),gap=(W-2*r*per)/(per+1);
      const row=(y,v,col,lab)=>{TB.rich(c,lab,gap,y-r-8,s,K.muted);v.forEach((e,i)=>chip(c,gap+r+(i%per)*(2*r+gap),y+Math.floor(i/per)*(2*r+6),r,e,K,col));};
      const sa=a.reduce((x,y)=>x+y,0)/N,sb=h;
      row(sm?40:52,a,K.eth,[['независимые броски: доля гербов ','r'],[TB.fmt(sa,2),'m']]);
      row(sm?148:132,b,K.warm,[['копирующая монета: доля гербов ','r'],[TB.fmt(sb,2),'m']]);
      fx.innerHTML=TB.rows([['<i>N</i> = '+N]]);});
    th.addEventListener('input',run);bt.addEventListener('click',()=>{roll();run();});
  })();

  /* exsurp: a fair die, A = even, B = at least 4 */
  mount('exDie',W=>W<480?150:140,(c,W,H,K,sm)=>{
    const s=sm?12:14,n=6,sz=Math.min(46,(W-20)/n*0.62),gap=(W-n*sz)/(n+1),y=58;
    const X=i=>gap+sz/2+i*(sz+gap);
    c.fillStyle=TB.rgba(K.eth,0.16);for(const i of [1,3,5])c.fillRect(X(i)-sz/2-6,y-sz/2-6,sz+12,sz+12);
    c.fillStyle=K.warm;c.fillRect(X(3)-sz/2-6,y+sz/2+12,X(5)-X(3)+sz+12,4);
    for(let i=0;i<n;i++)TB.face(c,X(i),y,sz,i+1,K.ink,K);
    TB.rich(c,[['A','i'],[' — выпало чётное','r']],gap,18,s,K.eth);
    TB.rich(c,[['B','i'],[' — выпало не меньше 4','r']],X(3)-sz/2-6,y+sz/2+36,s,K.warm);});

  /* exlik: two sequences of ten tosses with seven heads */
  mount('exSeq',W=>W<480?140:120,(c,W,H,K,sm)=>{
    const S=['ГГГГГГГРРР','ГРГГРГГРГГ'],s=sm?12:14,n=10,lw=sm?0:110,r=Math.min(14,(W-lw-8)/n/2-2),gap=(W-lw-2*r*n)/(n+1);
    S.forEach((q,k)=>{const y=sm?(k?104:44):(k?84:34);if(!sm)TB.rich(c,[['выборка '+(k+1),'r']],0,y+s*0.35,s,K.muted);else TB.rich(c,[['выборка '+(k+1),'r']],gap,y-r-7,s,K.muted);
      [...q].forEach((ch,i)=>chip(c,lw+gap+r+i*(2*r+gap),y,r,ch==='Г'?1:0,K,K.eth));});});

  /* exgroup: guessing in two stages */
  mount('exTree',W=>W<480?230:210,(c,W,H,K,sm)=>{
    const s=sm?12:14,top=30,mid=sm?120:110,bot=sm?200:185;
    const xs=[0.2,0.5,0.66,0.86].map(v=>v*W),root=[W*0.5,top];
    const node=(x,y,lab,col)=>{const w=TB.richW(c,lab,s)+16;c.fillStyle=K.paper;c.strokeStyle=col;c.lineWidth=1.4;c.beginPath();c.roundRect?c.roundRect(x-w/2,y-13,w,26,6):c.rect(x-w/2,y-13,w,26);c.fill();c.stroke();TB.rich(c,lab,x,y+s*0.35,s,col,'center');};
    const edge=(a,b,lab,col,side)=>{c.strokeStyle=TB.rgba(col,0.7);c.lineWidth=1.4;c.beginPath();c.moveTo(a[0],a[1]+13);c.lineTo(b[0],b[1]-13);c.stroke();
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,vert=Math.abs(a[0]-b[0])<2;TB.rich(c,lab,mx+(side||0)*(vert?6:4),vert?my+s*0.35:my-5,s-1,col,side<0?'right':side>0?'start':'center');};
    const G=[xs[0],mid],g1=[xs[0]-W*0.11,bot],g2=[xs[0]+W*0.11,bot];
    edge(root,G,[['s','i'],[' = ','m'],['p','i'],['1','s'],[' + ','m'],['p','i'],['2','s']],K.warm,-1);
    edge(root,[xs[1],mid],[['p','i'],['3','s']],K.ink,1);edge(root,[xs[3],mid],[['p','i'],['n','s']],K.ink,1);
    edge(G,g1,[['p','i'],['1','s'],[' / ','m'],['s','i']],K.warm,-1);edge(G,g2,[['p','i'],['2','s'],[' / ','m'],['s','i']],K.warm,1);
    node(root[0],root[1],[['исход','r']],K.ink);node(G[0],G[1],[['{1, 2}','m']],K.warm);
    node(xs[1],mid,[['3','m']],K.ink);TB.rich(c,[['…','m']],xs[2],mid+s*0.35,s,K.muted,'center');node(xs[3],mid,[['n','i']],K.ink);
    node(g1[0],g1[1],[['1','m']],K.warm);node(g2[0],g2[1],[['2','m']],K.warm);
    if(!sm){TB.rich(c,[['этап 1','r']],W-4,top+s*0.35,s-1,K.muted,'right');TB.rich(c,[['этап 2','r']],W-4,bot+s*0.35,s-1,K.muted,'right');}});

  /* exhand: the three distributions as bars with exact fractions */
  mount('exHand',W=>W<480?170:160,(c,W,H,K,sm)=>{
    const D=[['p',[[1,2],[1,4],[1,4]],K.eth],['q',[[1,4],[1,2],[1,4]],K.warm],['r',[[1,8],[1,8],[3,4]],K.ink]];
    const s=sm?11:13,pw=W/3,B=H-24,T=34;
    D.forEach((d,k)=>{const L=k*pw+pw*0.12,R=(k+1)*pw-pw*0.12,bw=(R-L)/3;
      c.strokeStyle=K.rule;c.lineWidth=1;c.beginPath();c.moveTo(L,B);c.lineTo(R,B);c.stroke();
      d[1].forEach((f,i)=>{const v=f[0]/f[1],x=L+i*bw,h=v*(B-T);c.fillStyle=TB.rgba(d[2],0.35);c.fillRect(x+bw*0.18,B-h,bw*0.64,h);
        c.strokeStyle=d[2];c.lineWidth=1.6;c.beginPath();c.moveTo(x+bw*0.18,B-h);c.lineTo(x+bw*0.82,B-h);c.stroke();
        c.fillStyle=K.ink;c.font=s+'px '+TB.ui;c.textAlign='center';c.fillText(f[0]+'/'+f[1],x+bw/2,B-h-6);
        c.fillStyle=K.muted;c.fillText(String(i+1),x+bw/2,B+s+5);c.textAlign='start';});
      TB.rich(c,[[d[0],'i']],(L+R)/2,16,s+3,d[2],'center');});});

  /* extri: three distributions on two outcomes on the segment, and the numbers 0, 1, 2 */
  mount('exTri',W=>W<480?170:150,(c,W,H,K,sm)=>{
    const s=sm?12:14,L=sm?24:40,R=W-(sm?24:40),y1=50,y2=H-34,X=v=>L+v*(R-L);
    c.strokeStyle=K.ink;c.lineWidth=2;c.beginPath();c.moveTo(L,y1);c.lineTo(R,y1);c.stroke();
    c.fillStyle=K.muted;c.font=(s-1)+'px '+TB.ui;c.textAlign='center';c.fillText('(1, 0)',L,y1+s+8);c.fillText('(0, 1)',R,y1+s+8);c.textAlign='start';
    [['p',0,K.eth],['q',0.5,K.warm],['r',0.75,K.ink]].forEach(e=>{TB.dot(c,X(e[1]),y1,e[2],K,6);TB.rich(c,[[e[0],'i']],X(e[1]),y1-14,s+2,e[2],'center');});
    TB.rich(c,[['распределения на двух исходах','r']],W/2,y1+s+8,s-1,K.muted,'center');
    const Z=v=>L+v/2*(R-L);c.strokeStyle=K.rule;c.lineWidth=1.4;c.beginPath();c.moveTo(L-10,y2);c.lineTo(R+10,y2);c.stroke();
    [0,1,2].forEach(v=>{TB.dot(c,Z(v),y2,K.ink,K,4.5);c.fillStyle=K.muted;c.font=s+'px '+TB.ui;c.textAlign='center';c.fillText(String(v),Z(v),y2+s+8);c.textAlign='start';});
    TB.rich(c,[['числовая прямая','r']],W/2,y2-12,s-1,K.muted,'center');});

  /* exsmooth: a one-hot label and its smoothed version for K = 10 */
  (function(){
    const e=document.getElementById('exSmE'),eo=document.getElementById('exSmEOut'),fx=document.getElementById('exSmFx');if(!e)return;
    const K0=10,y=3;
    const run=mount('exSm',W=>W<480?210:200,(c,W,H,K,sm)=>{
      const ep=+e.value;eo.textContent=TB.fmt(ep,2);
      const v=Array.from({length:K0},(_,i)=>(i===y-1?1-ep:0)+ep/K0),ref=Array.from({length:K0},(_,i)=>i===y-1?1:0);
      TB.bars(c,v,sm?30:36,22,W-6,H-26,K,sm?11:13,{ref:ref,col:K.warm});
      fx.innerHTML=TB.rows([['ε = '+TB.fmt(ep,2)+':','правильный класс '+TB.fmt(1-ep+ep/K0,3)+',','остальные по '+TB.fmt(ep/K0,3)]]);});
    e.addEventListener('input',run);
  })();

  /* exlin: the last layer of a classifier */
  mount('exLin',W=>W<480?240:210,(c,W,H,K,sm)=>{
    const s=sm?12:14,d=4,Kc=3,cx=[0.1,0.42,0.7,0.92].map(v=>v*W),top=40,bot=H-40;
    const ys=(n,i)=>top+(bot-top)*(n===1?0.5:i/(n-1));
    c.strokeStyle=TB.rgba(K.muted,0.45);c.lineWidth=1;c.beginPath();
    for(let i=0;i<d;i++)for(let j=0;j<Kc;j++){c.moveTo(cx[0],ys(d,i));c.lineTo(cx[1],ys(Kc,j));}
    for(let j=0;j<Kc;j++)for(let k=0;k<Kc;k++){c.moveTo(cx[1],ys(Kc,j));c.lineTo(cx[2],ys(Kc,k));}c.stroke();
    c.setLineDash([4,4]);c.strokeStyle=TB.rgba(K.warm,0.8);c.beginPath();for(let k=0;k<Kc;k++){c.moveTo(cx[2]+12,ys(Kc,k));c.lineTo(cx[3]-12,ys(Kc,k));}c.stroke();c.setLineDash([]);
    for(let i=0;i<d;i++)TB.dot(c,cx[0],ys(d,i),K.eth,K,7);
    for(let j=0;j<Kc;j++)TB.dot(c,cx[1],ys(Kc,j),K.ink,K,7);
    for(let k=0;k<Kc;k++)TB.dot(c,cx[2],ys(Kc,k),K.ink,K,7);
    for(let k=0;k<Kc;k++)TB.dot(c,cx[3],ys(Kc,k),K.warm,K,7);
    const lab=(x,segs,col)=>TB.rich(c,segs,x,top-20,s,col,'center');
    lab(cx[0],[['u','i'],[' ∈ ℝ','m'],['ᵈ','m']],K.eth);lab(cx[1],[['z','i'],[' = ','m'],['W','i'],['u','i'],[' + ','m'],['b','i']],K.ink);
    lab(cx[2],[['σ','m'],['(','m'],['z','i'],[')','m']],K.ink);lab(cx[3],[['p','i']],K.warm);
    const mid=(a,b,segs,col)=>TB.rich(c,segs,(a+b)/2,bot+26,s-1,col,'center');
    mid(cx[0],cx[1],[['W','i'],[', ','m'],['b','i']],K.muted);mid(cx[1],cx[2],[['софтмакс','r']],K.muted);mid(cx[2],cx[3],[['ℓ','m'],[' = ','m'],['H','i'],['(','m'],['p','i'],[', ','m'],['σ','m'],['(','m'],['z','i'],['))','m']],K.warm);});
})();
</script>
